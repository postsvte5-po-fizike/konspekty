<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тренажёр тестов</title>
    <style>
      /* Шрифты сайта (quartz/static/fonts, те же файлы, что в quartz/styles/custom.scss). */
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("../fonts/lora-cyrillic-a06a17f4.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("../fonts/lora-latin-a64795df.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
          U+2122, U+2191, U+2193, U+2212, U+2215;
      }
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("../fonts/lora-cyrillic-a06a17f4.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Lora";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("../fonts/lora-latin-a64795df.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
          U+2122, U+2191, U+2193, U+2212, U+2215;
      }
      @font-face {
        font-family: "Lora";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("../fonts/lora-cyrillic-6a581005.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Lora";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("../fonts/lora-latin-b9997362.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
          U+2122, U+2191, U+2193, U+2212, U+2215;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("../fonts/cormorant-garamond-cyrillic-6d314ca4.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("../fonts/cormorant-garamond-latin-6c00f6ef.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
          U+2122, U+2191, U+2193, U+2212, U+2215;
      }

      /* Токены — те же имена и значения, что в quartz/styles/custom.scss.
         Внутри страницы сайта они перезаписываются живыми значениями со страницы
         (syncTokens в скрипте), так что тренажёр следует за темой сайта. */
      :root {
        --font-heading: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --font-body: "Lora", Georgia, "Times New Roman", serif;
        --radius-sm: 2px;
        --radius-md: 4px;
        --radius-lg: 7px;
        --radius-pill: 999px;
        color-scheme: light;
        --bg: #f3f2f2;
        --bg-elevated: #f9f8f7;
        --surface: #eae9e9;
        --text: #201f1d;
        --text-muted: #5b5856;
        --text-faint: #75716d;
        --divider: color-mix(in srgb, #201f1d 13%, transparent);
        --divider-strong: color-mix(in srgb, #201f1d 26%, transparent);
        --accent: #b68235;
        --accent-text: #7d5411;
        --accent-tint: #fbefdd;
        --nb-bg: #ffe5e2;
        --nb-border: #cb4644;
        --nb-title: #a21921;
        --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
        /* Свои: верно и кнопка. Неверно — цвета выноски «NB» сайта. */
        --ok: #2f7a4a;
        --ok-tint: #e3f1e6;
        --btn-bg: var(--accent-text);
        --btn-fg: #fff;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1a1918;
        --bg-elevated: #211f1e;
        --surface: #262422;
        --text: #e7e3de;
        --text-muted: #aba59f;
        --text-faint: #8f8983;
        --divider: color-mix(in srgb, #e7e3de 12%, transparent);
        --divider-strong: color-mix(in srgb, #e7e3de 24%, transparent);
        --accent: #e1ad66;
        --accent-text: #f2c485;
        --accent-tint: color-mix(in srgb, #e1ad66 13%, transparent);
        --nb-bg: #4d1c1a;
        --nb-border: #dc5e59;
        --nb-title: #ffc1ba;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
        --ok: #8fcf9f;
        --ok-tint: color-mix(in srgb, #8fcf9f 14%, transparent);
        --btn-bg: var(--accent);
        --btn-fg: #1a1918;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16.5px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      html:has(body.embedded),
      body.embedded {
        background: transparent;
      }
      ::selection {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px;
      }
      body.embedded main {
        padding: 4px 2px 16px;
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-heading);
        font-weight: 600;
        line-height: 1.14;
        margin: 0 0 8px;
      }
      h1 {
        font-size: 2.2rem;
      }
      h2 {
        font-size: 1.7rem;
        margin-top: 20px;
      }
      h3 {
        font-size: 1.45rem;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--text-muted);
      }
      .small {
        font-size: 0.875rem;
      }
      button,
      .btn {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 0.92rem;
        line-height: 1.2;
        border-radius: var(--radius-md);
        border: 1px solid var(--divider-strong);
        background: var(--bg-elevated);
        color: var(--text);
        padding: 10px 14px;
        cursor: pointer;
        min-height: 44px;
        transition:
          border-color 0.15s,
          background-color 0.15s;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      label:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.primary {
        background: var(--btn-bg);
        border-color: var(--btn-bg);
        color: var(--btn-fg);
      }
      button.primary:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
      button.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--accent-text);
        padding-inline: 6px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .spacer {
        flex: 1;
      }
      .card {
        background: var(--bg-elevated);
        border: 1px solid var(--divider);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 16px;
        margin-bottom: 12px;
      }
      .deck h3 {
        margin-bottom: 2px;
      }
      .deck.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .deck-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .deck-head > div {
        flex: 1;
        min-width: 0;
      }
      .pick {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.875rem;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px 8px;
        margin: -6px -8px 0 0;
        border-radius: var(--radius-md);
        min-height: 40px;
      }
      .pick input {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
        margin: 0;
      }
      .picker {
        background: var(--accent-tint);
        border: 1px solid var(--divider);
        border-radius: var(--radius-lg);
        padding: 12px 14px;
        margin-bottom: 14px;
      }
      .picker p {
        margin: 0 0 10px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0 12px;
      }
      .chip {
        font-size: 0.8rem;
        padding: 2px 9px;
        border-radius: var(--radius-pill);
        background: var(--accent-tint);
        color: var(--accent-text);
      }
      .chip.ok {
        background: var(--ok-tint);
        color: var(--ok);
      }
      .chip.bad {
        background: var(--nb-bg);
        color: var(--nb-title);
      }
      .toggles {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin: 4px 0 16px;
      }
      .toggles label {
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
        border-radius: var(--radius-md);
      }
      .toggles select {
        font: inherit;
        min-height: 36px;
        padding: 4px 8px;
        border-radius: var(--radius-md);
        border: 1px solid var(--divider-strong);
        background: var(--bg-elevated);
        color: var(--text);
      }
      .toggles input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      /* Вопрос */
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .counter {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 4px;
        background: var(--divider);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.2s;
      }
      .question {
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 1.6rem;
        line-height: 1.2;
        margin-bottom: 6px;
      }
      .hint {
        font-size: 0.875rem;
        font-style: italic;
        color: var(--text-muted);
        margin-bottom: 12px;
      }
      .options {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        text-align: left;
        width: 100%;
        font-weight: 400;
        font-size: 1rem;
        line-height: 1.45;
        padding: 12px;
      }
      .opt .key {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: var(--radius-md);
        border: 1px solid var(--divider-strong);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .opt.multi .key {
        border-radius: 50%;
      }
      .opt[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-tint);
      }
      .opt[aria-pressed="true"] .key {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--btn-fg);
      }
      .opt.right {
        border-color: var(--ok);
        background: var(--ok-tint);
      }
      .opt.right .key {
        background: var(--ok);
        border-color: var(--ok);
        color: var(--bg);
      }
      .opt.wrong {
        border-color: var(--nb-border);
        background: var(--nb-bg);
      }
      .opt.wrong .key {
        background: var(--nb-border);
        border-color: var(--nb-border);
        color: #fff;
      }
      .opt.missed {
        border-style: dashed;
      }
      .opt:disabled {
        opacity: 1;
        cursor: default;
      }
      .steps {
        list-style: none;
        padding: 0;
        margin: 0 0 14px;
        display: grid;
        gap: 8px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-elevated);
        border: 1px solid var(--divider-strong);
        border-radius: var(--radius-md);
        padding: 6px 6px 6px 12px;
      }
      .step .n {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-muted);
        width: 18px;
      }
      .step .t {
        flex: 1;
      }
      .step button {
        min-height: 40px;
        min-width: 40px;
        padding: 6px;
      }
      .step.right {
        border-color: var(--ok);
        background: var(--ok-tint);
      }
      .step.wrong {
        border-color: var(--nb-border);
        background: var(--nb-bg);
      }
      .answer {
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        margin: 0 0 14px;
        background: var(--accent-tint);
        border-radius: 0 var(--radius-md) var(--radius-md) 0;
        white-space: pre-line;
      }
      .verdict {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .verdict.ok {
        color: var(--ok);
      }
      .verdict.bad {
        color: var(--nb-title);
      }
      .explain {
        color: var(--text-muted);
        margin-bottom: 14px;
      }
      .latin {
        font-style: italic;
        color: var(--text-muted);
      }

      /* Итоги */
      .score {
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 3rem;
        line-height: 1;
        margin: 8px 0;
      }
      .mistake {
        border-top: 1px solid var(--divider);
        padding: 12px 0;
      }
      .mistake:first-child {
        border-top: 0;
      }
      .mistake .q {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .mistake .yours {
        color: var(--nb-title);
      }
      .mistake .correct {
        color: var(--ok);
      }

      textarea,
      .field {
        width: 100%;
        font-size: 0.95rem;
        padding: 10px;
        border-radius: var(--radius-md);
        border: 1px solid var(--divider-strong);
        background: var(--bg);
        color: var(--text);
      }
      textarea {
        min-height: 140px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        line-height: 1.4;
      }
      .field {
        font-family: var(--font-body);
        flex: 1;
        min-width: 180px;
        min-height: 44px;
      }
      details summary {
        cursor: pointer;
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 1.3rem;
        min-height: 32px;
      }
      details details summary {
        font-family: var(--font-body);
        font-size: 0.875rem;
      }
      pre.example {
        background: var(--bg);
        border: 1px solid var(--divider);
        border-radius: var(--radius-md);
        padding: 10px;
        overflow-x: auto;
        font-size: 0.85rem;
      }
      .problems {
        color: var(--nb-title);
        font-size: 0.9rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      @media (max-width: 480px) {
        .question {
          font-size: 1.4rem;
        }
        .row > button {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"><p class="muted">Загрузка тестов…</p></main>

    <script>
      "use strict"

      // ─── Тема: как у сайта ──────────────────────────────────────────────
      // В iframe читаем атрибут saved-theme у страницы сайта и следим за ним;
      // отдельно — тот же ключ localStorage «theme», что пишет Quartz.
      const embedded = (() => {
        try {
          return window.self !== window.top && !!window.frameElement
        } catch {
          return false
        }
      })()
      if (embedded) document.body.classList.add("embedded")

      // Токены оформления сайта (quartz/styles/custom.scss). Внутри страницы
      // сайта берём их живые значения — тренажёр не разойдётся с темой, даже
      // если её поменяют.
      const TOKENS = [
        "--font-heading",
        "--font-body",
        "--bg",
        "--bg-elevated",
        "--surface",
        "--text",
        "--text-muted",
        "--text-faint",
        "--divider",
        "--divider-strong",
        "--accent",
        "--accent-text",
        "--accent-tint",
        "--nb-bg",
        "--nb-border",
        "--nb-title",
        "--shadow-sm",
        "--radius-sm",
        "--radius-md",
        "--radius-lg",
      ]
      function syncTokens() {
        const root = document.documentElement
        let cs = null
        try {
          if (embedded) cs = window.parent.getComputedStyle(window.parent.document.documentElement)
        } catch {}
        for (const name of TOKENS) {
          const v = cs ? cs.getPropertyValue(name).trim() : ""
          if (v) root.style.setProperty(name, v)
          else root.style.removeProperty(name)
        }
      }

      function applyTheme() {
        let theme = null
        try {
          if (embedded) theme = window.parent.document.documentElement.getAttribute("saved-theme")
        } catch {}
        if (!theme) {
          try {
            theme = localStorage.getItem("theme")
          } catch {}
        }
        if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = theme
        syncTokens()
      }
      applyTheme()
      try {
        if (embedded)
          new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {
            attributes: true,
            attributeFilter: ["saved-theme"],
          })
      } catch {}
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme)

      // Высота iframe — по содержимому, чтобы не было второй прокрутки.
      function fitFrame() {
        if (!embedded) return
        try {
          window.frameElement.style.height =
            Math.ceil(document.getElementById("app").getBoundingClientRect().height) + "px"
        } catch {}
      }
      if (embedded) new ResizeObserver(fitFrame).observe(document.getElementById("app"))

      function scrollToTop() {
        if (embedded) {
          try {
            const r = window.frameElement.getBoundingClientRect()
            if (r.top < 0)
              window.frameElement.scrollIntoView({ block: "start", behavior: "smooth" })
          } catch {}
        } else window.scrollTo({ top: 0, behavior: "smooth" })
      }

      // ─── Хранилище: результаты и свои колоды — только в этом браузере ────
      const STORE_KEY = "konspekty-testy-v1"
      function loadStore() {
        try {
          const s = JSON.parse(localStorage.getItem(STORE_KEY) || "{}")
          return { stats: s.stats || {}, imported: s.imported || [], prefs: s.prefs || {} }
        } catch {
          return { stats: {}, imported: [], prefs: {} }
        }
      }
      let store = loadStore()
      function saveStore() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(store))
        } catch {}
      }

      // Ключ карточки — по тексту вопроса и вариантов: переживает правку порядка в колоде,
      // а одинаковые формулировки с разными вариантами не сливаются.
      function cardKey(card) {
        const s = [
          card.type,
          card.question,
          card.answer || "",
          ...(card.options || []).map((o) => (o.correct ? "+" : "-") + o.text),
          ...(card.steps || []),
        ].join("|")
        let h = 5381
        for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0
        return (h >>> 0).toString(36)
      }

      // ─── Разбор текста в карточки: тот же формат, что импорт/экспорт StudyStasMed
      // (lib/importParser.ts). Вопрос — первая строка блока; «+ верный / - неверный»
      // или «а) … б) …» и «Ответ: а, в»; «Порядок: …» и шаги «1. …».
      const MAX_ITEMS = 8
      const QUESTION_NUMBER = /^\s*(?:вопрос\s*)?\d{1,4}\s*(?:[.)]\s+|\t\s*)(?=\S)/i
      const ORDER_HEAD =
        /^\s*(?:порядок|последовательность|расставьте(?:\s+по\s+порядку)?)\s*[:.\-—]?\s*/i
      const MARK_OPTION = /^\s*([+\-*•])\s*(.+)$/
      const LETTER_OPTION = /^\s*([а-жa-h])\s*(?:[).]|\t)\s*(.+)$/i
      const NUMBER_ITEM = /^\s*(\d{1,2})\s*(?:[.)]|\t)\s*(.+)$/
      const ANSWER_KEY = /^\s*(?:правильн[а-яё]*\s+)?ответ[а-яё]*\s*[:.\-—–]\s*(.+)$/i
      const Q_PREFIX = /^\s*(?:в|q|вопрос)\s*[:.]\s*/i
      const A_PREFIX = /^\s*(?:о|a|ответ)\s*[:.]\s+/i
      const COMMENT = /^\s*#/
      const LETTERS_RU = "абвгдежз"
      const LETTERS_EN = "abcdefgh"
      const clean = (s) => s.replace(/\s+/g, " ").trim()

      function optionIndex(token) {
        const t = token.toLowerCase()
        if (/^\d+$/.test(t)) return Number(t) - 1
        const ru = LETTERS_RU.indexOf(t)
        if (ru >= 0) return ru
        const en = LETTERS_EN.indexOf(t)
        return en >= 0 ? en : null
      }
      function parseKey(key) {
        const tokens = key.match(/\d+|[а-жa-h](?![а-яa-z])/gi) || []
        const joined = key.replace(/[\s,;и&]+|and/gi, "")
        const letters = /^[а-жa-h]+$/i.test(joined) ? joined.split("") : tokens
        return [...new Set(letters.map(optionIndex).filter((i) => i !== null && i >= 0))]
      }
      const hasBody = (block) =>
        block
          .slice(1)
          .some(
            (l) =>
              MARK_OPTION.test(l.text) ||
              LETTER_OPTION.test(l.text) ||
              ANSWER_KEY.test(l.text) ||
              l.list === "nested",
          )
      function splitBlocks(lines) {
        const blocks = []
        let current = []
        let inOrder = false
        const flush = () => {
          if (current.length) blocks.push(current)
          current = []
          inOrder = false
        }
        for (const line of lines) {
          if (COMMENT.test(line.text)) continue
          if (!line.text.trim()) {
            flush()
            continue
          }
          const startsQuestion =
            (QUESTION_NUMBER.test(line.text) && !inOrder) ||
            (line.list === "top" && current.length > 0 && !inOrder)
          if (startsQuestion && current.length > 0 && hasBody(current)) flush()
          if (current.length === 0 && ORDER_HEAD.test(line.text)) inOrder = true
          current.push(line)
        }
        flush()
        return blocks
      }
      function parseBlock(block) {
        const [head, ...rest] = block
        if (ORDER_HEAD.test(head.text)) {
          const title = clean(head.text.replace(ORDER_HEAD, ""))
          const steps = rest
            .map((l) => clean(l.text.replace(NUMBER_ITEM, "$2").replace(MARK_OPTION, "$2")))
            .filter(Boolean)
          if (steps.length < 2) return "в «Порядке» нужно хотя бы два шага"
          if (steps.length > MAX_ITEMS) return `в «Порядке» больше ${MAX_ITEMS} шагов`
          return { type: "order", question: title || "Расставьте по порядку", steps }
        }
        const question = clean(head.text.replace(QUESTION_NUMBER, "").replace(Q_PREFIX, ""))
        if (!question) return "пустой вопрос"
        const options = []
        const answerLines = []
        let key = null
        let latin
        for (const line of rest) {
          const keyMatch = line.text.match(ANSWER_KEY)
          const mark = line.text.match(MARK_OPTION)
          const letter = line.text.match(LETTER_OPTION)
          if (keyMatch && options.length > 0) {
            key = parseKey(keyMatch[1])
          } else if (mark) {
            const sign = mark[1]
            let text = clean(mark[2])
            const starred = text.endsWith("*")
            if (starred) text = clean(text.slice(0, -1))
            options.push({
              text,
              correct:
                sign === "+" || sign === "*" || starred || line.bold === true
                  ? true
                  : sign === "-"
                    ? false
                    : null,
            })
          } else if (letter) {
            let text = clean(letter[2])
            const starred = text.endsWith("*") || text.startsWith("*")
            text = clean(text.replace(/^\*|\*$/g, ""))
            options.push({ text, correct: starred || line.bold === true ? true : null })
          } else if (line.list === "nested" || (line.list && options.length > 0)) {
            let text = clean(line.text)
            const starred = text.endsWith("*")
            if (starred) text = clean(text.slice(0, -1))
            options.push({ text, correct: starred || line.bold === true ? true : null })
          } else if (keyMatch) {
            answerLines.push(clean(keyMatch[1]))
          } else {
            const t = clean(line.text.replace(A_PREFIX, ""))
            // Экспорт StudyStasMed пишет латынь строкой «Лат.: …».
            const lat = t.match(/^Лат\.:\s*(.+)$/)
            if (lat) latin = lat[1]
            else answerLines.push(t)
          }
        }
        if (options.length > 0) {
          if (key) key.forEach((i) => options[i] && (options[i].correct = true))
          const marked = options.map((o) => ({ text: o.text, correct: o.correct === true }))
          if (marked.length < 2) return "у вопроса с вариантами нужен хотя бы второй вариант"
          if (marked.length > MAX_ITEMS) return `больше ${MAX_ITEMS} вариантов`
          if (!marked.some((o) => o.correct))
            return "не отмечен верный вариант (+, жирный шрифт или строка «Ответ: …»)"
          return { type: "multi", question, options: marked }
        }
        const answer = answerLines.filter(Boolean).join("\n")
        if (!answer)
          return latin ? { type: "single", question, answer: latin } : "нет ответа под вопросом"
        return latin
          ? { type: "single", question, answer, latin }
          : { type: "single", question, answer }
      }
      function parseLines(lines) {
        const cards = []
        const problems = []
        splitBlocks(lines).forEach((block, i) => {
          const parsed = parseBlock(block)
          if (typeof parsed === "string")
            problems.push({
              block: i + 1,
              preview: clean(block[0].text).slice(0, 80),
              reason: parsed,
            })
          else cards.push(parsed)
        })
        return { cards, problems }
      }
      function parseText(text) {
        return parseLines(
          text
            .replace(/\r\n?/g, "\n")
            .split("\n")
            .map((t) => ({ text: t })),
        )
      }

      // Word (.docx): достаём word/document.xml из zip и берём абзацы.
      async function readDocxXml(buffer) {
        const view = new DataView(buffer)
        const bytes = new Uint8Array(buffer)
        let eocd = -1
        for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
          if (view.getUint32(i, true) === 0x06054b50) {
            eocd = i
            break
          }
        }
        if (eocd < 0) throw new Error("это не файл Word")
        const count = view.getUint16(eocd + 10, true)
        let p = view.getUint32(eocd + 16, true)
        for (let n = 0; n < count; n++) {
          const method = view.getUint16(p + 10, true)
          const size = view.getUint32(p + 20, true)
          const nameLen = view.getUint16(p + 28, true)
          const extraLen = view.getUint16(p + 30, true)
          const commentLen = view.getUint16(p + 32, true)
          const local = view.getUint32(p + 42, true)
          const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen))
          if (name === "word/document.xml") {
            const start =
              local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true)
            const data = bytes.subarray(start, start + size)
            if (method === 0) return new TextDecoder().decode(data)
            const stream = new Blob([data])
              .stream()
              .pipeThrough(new DecompressionStream("deflate-raw"))
            return await new Response(stream).text()
          }
          p += 46 + nameLen + extraLen + commentLen
        }
        throw new Error("в файле нет текста документа")
      }
      const decodeXml = (s) =>
        s
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'")
          .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
          .replace(/&amp;/g, "&")
      function docxParagraphs(xml) {
        const out = []
        const paragraphs = xml.match(/<w:p[ >][\s\S]*?<\/w:p>|<w:p\/>/g) || []
        for (const p of paragraphs) {
          const runs = p.match(/<w:r[ >][\s\S]*?<\/w:r>/g) || []
          let text = ""
          let allBold = runs.length > 0
          let anyText = false
          for (const r of runs) {
            const pieces = r.match(/<w:t(?:\s[^>]*)?>[\s\S]*?<\/w:t>|<w:tab\/>|<w:br\/>/g) || []
            const runText = pieces
              .map((x) =>
                x === "<w:tab/>"
                  ? "\t"
                  : x === "<w:br/>"
                    ? "\n"
                    : decodeXml(x.replace(/<[^>]+>/g, "")),
              )
              .join("")
            if (runText.trim()) {
              anyText = true
              if (!/<w:b\/>|<w:b\s+w:val="(?:1|true)"\s*\/>/.test(r)) allBold = false
            }
            text += runText
          }
          const numbered = /<w:numPr>/.test(p)
          const level = Number((p.match(/<w:ilvl\s+w:val="(\d+)"/) || [])[1] || "0")
          text.split("\n").forEach((part, i) =>
            out.push({
              text: part,
              list: numbered && i === 0 ? (level > 0 ? "nested" : "top") : undefined,
              bold: anyText && allBold,
            }),
          )
        }
        return out
      }
      // Заголовок экспорта: «# Название» и «# Предмет: …».
      function headerOf(lines) {
        const comments = lines
          .filter((l) => COMMENT.test(l.text))
          .map((l) => l.text.replace(/^\s*#\s*/, ""))
        const subject = (comments.find((c) => /^Предмет:/.test(c)) || "").match(
          /^Предмет:\s*([^.]+)/,
        )
        return {
          title: comments.find((c) => c && !/^Предмет:/.test(c)) || "",
          subject: subject ? subject[1].trim() : "",
        }
      }

      // ─── Колоды ────────────────────────────────────────────────────────
      let builtIn = []
      const allDecks = () => [...builtIn, ...store.imported]
      const deckById = (id) => allDecks().find((d) => d.id === id)

      // ─── Утилиты ───────────────────────────────────────────────────────
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        )
      function shuffle(items) {
        const out = [...items]
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[out[i], out[j]] = [out[j], out[i]]
        }
        return out
      }
      const plural = (n, one, few, many) => {
        const m10 = n % 10,
          m100 = n % 100
        if (m10 === 1 && m100 !== 11) return one
        if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few
        return many
      }
      const LETTERS = "АБВГДЕЖЗ"
      const fmtTime = (ms) => {
        const s = Math.round(ms / 1000)
        return s < 60 ? `${s} с` : `${Math.floor(s / 60)} мин ${String(s % 60).padStart(2, "0")} с`
      }
      const fmtDate = (t) =>
        new Date(t).toLocaleDateString("ru-RU", { day: "numeric", month: "long" })

      // ─── Сборка теста ──────────────────────────────────────────────────
      // Карточка «вопрос — ответ» становится вопросом с выбором: неверные
      // варианты — ответы других карточек той же колоды (как квиз в StudyStasMed).
      // Если таких карточек меньше четырёх — самопроверка «показать ответ».
      function buildQuestions(entries, { shuffleOrder }) {
        const singles = entries.filter((e) => e.card.type === "single" && e.card.answer.trim())
        const list = shuffleOrder ? shuffle(entries) : entries
        return list.map(({ card, deckId }) => {
          const q = { card, deckId, key: deckId + ":" + cardKey(card) }
          if (card.type === "single") {
            const others = singles.filter((o) => o.card !== card && o.card.answer !== card.answer)
            if (others.length >= 3) {
              const same = shuffle(others.filter((o) => o.deckId === deckId))
              const elsewhere = shuffle(others.filter((o) => o.deckId !== deckId))
              const wrong = [...same, ...elsewhere].slice(0, 3).map((o) => o.card.answer)
              q.kind = "choice"
              q.options = shuffle([
                { text: card.answer, correct: true },
                ...wrong.map((text) => ({ text, correct: false })),
              ])
            } else q.kind = "self"
          } else if (card.type === "multi") {
            q.kind = "choice"
            q.options = shuffle(card.options)
          } else {
            q.kind = "order"
            let order = shuffle(card.steps.map((_, i) => i))
            // Перемешанный порядок не должен совпасть с верным.
            if (order.every((v, i) => v === i) && order.length > 1)
              order = [...order.slice(1), order[0]]
            q.order = order
          }
          return q
        })
      }

      // ─── Состояние экрана ──────────────────────────────────────────────
      let session = null // { title, deckIds, questions, i, answers, started, picked, checked }
      const app = document.getElementById("app")

      function prefs() {
        return { shuffle: store.prefs.shuffle !== false, limit: store.prefs.limit ?? 20 }
      }

      function startSession(deckIds, { onlyKeys = null, title } = {}) {
        const entries = []
        for (const id of deckIds) {
          const d = deckById(id)
          if (!d) continue
          for (const card of d.cards) entries.push({ card, deckId: id })
        }
        let filtered = entries
        if (onlyKeys)
          filtered = entries.filter((e) => onlyKeys.has(e.deckId + ":" + cardKey(e.card)))
        if (!filtered.length) return
        let questions = buildQuestions(filtered, { shuffleOrder: prefs().shuffle })
        // Неверные варианты берём из всей колоды, даже если проходим только ошибки.
        if (onlyKeys) {
          const full = buildQuestions(entries, { shuffleOrder: false })
          const byKey = new Map(full.map((q) => [q.key, q]))
          questions.forEach((q, i) => {
            const f = byKey.get(q.key)
            if (f && q.kind === "self" && f.kind === "choice") questions[i] = { ...f }
          })
        }
        if (prefs().limit) questions = questions.slice(0, prefs().limit)
        session = {
          title: title || scopeTitle(deckIds),
          deckIds,
          mistakesMode: !!onlyKeys,
          questions,
          i: 0,
          results: [],
          started: Date.now(),
        }
        resetQuestionState()
        renderQuestion()
        scrollToTop()
      }

      function resetQuestionState() {
        const q = session.questions[session.i]
        session.picked = new Set()
        session.checked = false
        session.revealed = false
        session.order = q && q.kind === "order" ? [...q.order] : null
      }

      // ─── Экран: список тестов ──────────────────────────────────────────
      // Ошибки колоды — только по вопросам, которые в ней ещё есть.
      function wrongKeys(id) {
        const d = deckById(id)
        const st = store.stats[id]
        if (!d || !st || !st.wrong || !st.wrong.length) return []
        const have = new Set(d.cards.map(cardKey))
        return st.wrong.filter((k) => have.has(k))
      }
      function mistakesSession(ids, title) {
        const keys = new Set(ids.flatMap((id) => wrongKeys(id).map((k) => id + ":" + k)))
        if (keys.size) startSession(ids, { onlyKeys: keys, title: title + " — ошибки" })
      }
      // Выбранные темы — запоминаются в этом браузере.
      function selectedIds() {
        const ids = new Set(allDecks().map((d) => d.id))
        return (store.prefs.selected || []).filter((id) => ids.has(id))
      }
      function scopeTitle(ids) {
        if (ids.length === 1) return deckById(ids[0]).title
        if (ids.length === allDecks().length) return "Все темы"
        return `Выбранные темы (${ids.length})`
      }
      function pickerHtml() {
        const decks = allDecks()
        const sel = selectedIds()
        const scope = sel.length ? sel : decks.map((d) => d.id)
        const questions = scope.reduce((n, id) => n + deckById(id).cards.length, 0)
        const wrong = scope.reduce((n, id) => n + wrongKeys(id).length, 0)
        const qWord = plural(questions, "вопрос", "вопроса", "вопросов")
        const text = sel.length
          ? `Выбрано: <b>${sel.length}</b> ${plural(sel.length, "тема", "темы", "тем")} из ${decks.length}, ${questions} ${qWord}${wrong ? `, ошибок к повтору: ${wrong}` : ""}.`
          : `Отметьте темы галочками, чтобы пройти несколько сразу. Без выбора — все темы${wrong ? `, ошибок к повтору: ${wrong}` : ""}.`
        return `<p class="small">${text}</p>
          <div class="row">
            <button class="primary" id="run-scope">${sel.length ? "Пройти выбранные" : "Пройти все темы"}</button>
            <button id="run-mistakes" ${wrong ? "" : "disabled"}>Только ошибки${wrong ? ` (${wrong})` : ""}</button>
            <span class="spacer"></span>
            ${
              sel.length
                ? `<button class="ghost" id="pick-none">Снять выбор</button>`
                : `<button class="ghost" id="pick-all">Выбрать все</button>`
            }
          </div>`
      }
      function bindPicker() {
        const box = app.querySelector("#picker")
        if (!box) return
        box.innerHTML = pickerHtml()
        const scope = () => {
          const sel = selectedIds()
          return sel.length ? sel : allDecks().map((d) => d.id)
        }
        box.querySelector("#run-scope").onclick = () => {
          const ids = scope()
          startSession(ids, { title: scopeTitle(ids) })
        }
        box.querySelector("#run-mistakes").onclick = () => {
          const ids = scope()
          mistakesSession(ids, scopeTitle(ids))
        }
        const setAll = (on) => {
          store.prefs.selected = on ? allDecks().map((d) => d.id) : []
          saveStore()
          app.querySelectorAll("[data-pick]").forEach((cb) => {
            cb.checked = on
            cb.closest(".deck").classList.toggle("selected", on)
          })
          bindPicker()
        }
        const all = box.querySelector("#pick-all")
        if (all) all.onclick = () => setAll(true)
        const none = box.querySelector("#pick-none")
        if (none) none.onclick = () => setAll(false)
      }

      function renderList(message) {
        session = null
        const decks = allDecks()
        const total = decks.reduce((n, d) => n + d.cards.length, 0)
        const p = prefs()
        let html = ""
        if (!embedded) html += `<h1>Тренажёр тестов</h1>`
        html += `<p class="muted">${decks.length} ${plural(decks.length, "тест", "теста", "тестов")}, ${total} ${plural(total, "вопрос", "вопроса", "вопросов")}. Результаты сохраняются только в этом браузере.</p>`
        if (message) html += `<p class="chip ok" style="display:inline-block">${esc(message)}</p>`
        html += `<div class="toggles">
          <label><input type="checkbox" id="opt-shuffle" ${p.shuffle ? "checked" : ""}> Перемешивать вопросы</label>
          <label>Вопросов за раз:
            <select id="opt-limit">
              ${[10, 20, 50, 0].map((n) => `<option value="${n}" ${p.limit === n ? "selected" : ""}>${n || "все"}</option>`).join("")}
            </select>
          </label>
        </div>`
        if (decks.length > 1) html += `<div class="picker" id="picker"></div>`
        for (const d of decks) {
          const st = store.stats[d.id]
          const wrong = wrongKeys(d.id).length
          const picked = selectedIds().includes(d.id)
          const counts = { single: 0, multi: 0, order: 0 }
          d.cards.forEach((c) => counts[c.type]++)
          html += `<section class="card deck${picked ? " selected" : ""}">
            <div class="deck-head">
              <div>
                <h3>${esc(d.title)}</h3>
                <div class="muted small">${esc(d.subject || "")}${d.author ? " · " + esc(d.author) : ""}</div>
              </div>
              <label class="pick"><input type="checkbox" data-pick="${esc(d.id)}" ${picked ? "checked" : ""} aria-label="Выбрать тему «${esc(d.title)}»"> Выбрать</label>
            </div>
            ${d.description ? `<p class="small" style="margin:6px 0 0">${esc(d.description)}</p>` : ""}
            <div class="chips">
              <span class="chip">${d.cards.length} ${plural(d.cards.length, "вопрос", "вопроса", "вопросов")}</span>
              ${counts.order ? `<span class="chip">${counts.order} на порядок</span>` : ""}
              ${st ? `<span class="chip ${st.last.score === st.last.total ? "ok" : ""}">последний: ${st.last.score} из ${st.last.total}, ${fmtDate(st.last.at)}</span>` : ""}
              ${st && st.best != null ? `<span class="chip">лучший: ${Math.round(st.best * 100)}%</span>` : ""}
              ${wrong ? `<span class="chip bad">ошибок к повтору: ${wrong}</span>` : ""}
              ${d.imported ? `<span class="chip">своя колода</span>` : ""}
            </div>
            <div class="row">
              <button class="primary" data-start="${esc(d.id)}">Пройти тест</button>
              ${wrong ? `<button data-mistakes="${esc(d.id)}">Только ошибки</button>` : ""}
              <span class="spacer"></span>
              ${d.imported ? `<button class="ghost" data-remove="${esc(d.id)}">Удалить</button>` : ""}
            </div>
          </section>`
        }

        html += `<section class="card">
          <details id="import">
            <summary>Добавить свою колоду</summary>
            <p class="small" style="margin-top:8px">Выгрузите колоду из приложения StudyStasMed (колода → «Выгрузить» → текст или Word) и выберите файл — или вставьте текст теста. Колода сохранится в этом браузере.</p>
            <div class="row" style="margin-bottom:10px">
              <label class="btn" style="display:inline-flex;align-items:center">
                Выбрать файл .txt или .docx
                <input type="file" id="file" accept=".txt,.docx,text/plain" class="sr-only">
              </label>
            </div>
            <label for="paste" class="small muted">Или вставьте текст:</label>
            <textarea id="paste" placeholder="Каковы характеристики пассивного транспорта?\n+ Осуществляется по градиенту концентраций\n- Требует затраты энергии АТФ"></textarea>
            <div class="row" style="margin-top:8px">
              <input id="paste-title" class="field" placeholder="Название колоды">
              <button id="paste-go">Добавить</button>
            </div>
            <div id="import-msg" class="problems" style="margin-top:8px"></div>
            <details style="margin-top:10px">
              <summary class="small">Формат</summary>
              <pre class="example">Вопрос с ответом текстом
Ответ — следующей строкой

Вопрос с вариантами?
+ верный вариант
- неверный вариант

Или так?
а) первый
б) второй
в) третий
Ответ: б, в

Порядок: заголовок
1. первый шаг
2. второй шаг</pre>
            </details>
          </details>
        </section>`
        app.innerHTML = html

        app.querySelector("#opt-limit").onchange = (e) => {
          store.prefs.limit = Number(e.target.value)
          saveStore()
        }
        app.querySelector("#opt-shuffle").onchange = (e) => {
          store.prefs.shuffle = e.target.checked
          saveStore()
        }
        app
          .querySelectorAll("[data-start]")
          .forEach((b) => (b.onclick = () => startSession([b.dataset.start])))
        app.querySelectorAll("[data-mistakes]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.mistakes
              mistakesSession([id], deckById(id).title)
            }),
        )
        app.querySelectorAll("[data-remove]").forEach(
          (b) =>
            (b.onclick = () => {
              const d = deckById(b.dataset.remove)
              if (!confirm(`Удалить колоду «${d.title}» из этого браузера?`)) return
              store.imported = store.imported.filter((x) => x.id !== d.id)
              store.prefs.selected = (store.prefs.selected || []).filter((x) => x !== d.id)
              delete store.stats[d.id]
              saveStore()
              renderList()
            }),
        )
        app.querySelectorAll("[data-pick]").forEach(
          (cb) =>
            (cb.onchange = () => {
              const id = cb.dataset.pick
              const sel = new Set(selectedIds())
              cb.checked ? sel.add(id) : sel.delete(id)
              store.prefs.selected = allDecks()
                .map((d) => d.id)
                .filter((x) => sel.has(x))
              saveStore()
              cb.closest(".deck").classList.toggle("selected", cb.checked)
              bindPicker()
            }),
        )
        bindPicker()

        app.querySelector("#file").onchange = async (e) => {
          const file = e.target.files[0]
          if (!file) return
          try {
            const lines = /\.docx$/i.test(file.name)
              ? docxParagraphs(await readDocxXml(await file.arrayBuffer()))
              : (await file.text())
                  .replace(/\r\n?/g, "\n")
                  .split("\n")
                  .map((t) => ({ text: t }))
            const head = headerOf(lines)
            addImported(
              parseLines(lines),
              head.title || file.name.replace(/\.(txt|docx)$/i, ""),
              head.subject,
            )
          } catch (err) {
            app.querySelector("#import-msg").textContent =
              "Не удалось прочитать файл: " + err.message
          }
        }
        app.querySelector("#paste-go").onclick = () => {
          const text = app.querySelector("#paste").value
          const lines = text
            .replace(/\r\n?/g, "\n")
            .split("\n")
            .map((t) => ({ text: t }))
          const head = headerOf(lines)
          const title = app.querySelector("#paste-title").value.trim() || head.title || "Моя колода"
          addImported(parseLines(lines), title, head.subject)
        }
      }

      function addImported(result, title, subject) {
        const msg = app.querySelector("#import-msg")
        if (!result.cards.length) {
          msg.innerHTML =
            "Не нашлось ни одного вопроса." +
            (result.problems.length
              ? "<br>" +
                result.problems
                  .slice(0, 5)
                  .map((p) => `Блок ${p.block} («${esc(p.preview)}»): ${esc(p.reason)}`)
                  .join("<br>")
              : "")
          return
        }
        const deck = {
          id: "own-" + Date.now().toString(36),
          title,
          subject: subject || "",
          author: "",
          description: "",
          imported: true,
          cards: result.cards,
        }
        store.imported.push(deck)
        saveStore()
        const skipped = result.problems.length
          ? `, пропущено ${result.problems.length}: ` +
            result.problems
              .slice(0, 3)
              .map((p) => `«${p.preview}» — ${p.reason}`)
              .join("; ")
          : ""
        renderList(
          `Добавлено: «${title}», ${result.cards.length} ${plural(result.cards.length, "вопрос", "вопроса", "вопросов")}${skipped}`,
        )
      }

      // ─── Экран: вопрос ─────────────────────────────────────────────────
      function renderQuestion() {
        const s = session
        const q = s.questions[s.i]
        const card = q.card
        const n = s.questions.length
        let html = `<div class="top">
          <button class="ghost" id="quit" aria-label="Выйти к списку тестов">← Тесты</button>
          <span class="spacer"></span>
          <span class="counter">${s.i + 1} / ${n}</span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${s.i}"><i style="width:${(s.i / n) * 100}%"></i></div>
        <div class="muted small" style="margin-bottom:4px">${esc(s.title)}</div>
        <div class="question">${esc(card.question)}</div>`

        if (q.kind === "choice") {
          const correctCount = q.options.filter((o) => o.correct).length
          const multi = correctCount > 1
          html += `<div class="hint">${multi ? `Выберите все верные ответы (их ${correctCount})` : "Выберите один ответ"}</div><div class="options" role="group">`
          q.options.forEach((o, i) => {
            let cls = "opt" + (multi ? " multi" : "")
            const picked = s.picked.has(i)
            if (s.checked) {
              if (o.correct && picked) cls += " right"
              else if (!o.correct && picked) cls += " wrong"
              else if (o.correct) cls += " missed right"
            }
            html += `<button class="${cls}" data-opt="${i}" aria-pressed="${picked && !s.checked}" ${s.checked ? "disabled" : ""}>
              <span class="key">${LETTERS[i]}</span><span>${esc(o.text)}</span></button>`
          })
          html += `</div>`
        } else if (q.kind === "order") {
          html += `<div class="hint">Расставьте по порядку кнопками ↑ ↓</div><ol class="steps">`
          s.order.forEach((stepIdx, pos) => {
            const cls = s.checked ? (stepIdx === pos ? " right" : " wrong") : ""
            html += `<li class="step${cls}"><span class="n">${pos + 1}</span><span class="t">${esc(card.steps[stepIdx])}</span>
              ${
                s.checked
                  ? ""
                  : `<button data-up="${pos}" ${pos === 0 ? "disabled" : ""} aria-label="Выше">↑</button><button data-down="${pos}" ${pos === s.order.length - 1 ? "disabled" : ""} aria-label="Ниже">↓</button>`
              }</li>`
          })
          html += `</ol>`
        } else if (q.kind === "self") {
          html += `<div class="hint">Вспомните ответ, затем проверьте себя</div>`
        }

        // Итог по вопросу
        if (s.checked || s.revealed) {
          if (q.kind !== "self") {
            const ok = s.results[s.i].correct
            html += `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Верно" : "Неверно"}</div>`
            if (!ok && q.kind === "order")
              html += `<div class="answer">${card.steps.map((t, i) => `${i + 1}. ${esc(t)}`).join("\n")}</div>`
          } else {
            html += `<div class="answer">${esc(card.answer)}</div>`
          }
          if (card.latin) html += `<p class="latin">${esc(card.latin)}</p>`
          if (card.explanation) html += `<p class="explain">${esc(card.explanation)}</p>`
        }

        html += `<div class="row">`
        if (q.kind === "self") {
          if (!s.revealed) html += `<button class="primary" id="reveal">Показать ответ</button>`
          else if (!s.checked)
            html += `<button class="primary" data-self="1">Знал</button><button data-self="0">Не знал</button>`
          else html += nextButton()
        } else if (!s.checked) {
          const can = q.kind === "order" || s.picked.size > 0
          html += `<button class="primary" id="check" ${can ? "" : "disabled"}>Проверить</button>`
          html += `<button class="ghost" id="skip">Не знаю</button>`
        } else html += nextButton()
        html += `</div>`

        app.innerHTML = html
        bindQuestion()
      }

      const nextButton = () =>
        `<button class="primary" id="next">${session.i + 1 < session.questions.length ? "Дальше" : "Итоги"}</button>`

      function bindQuestion() {
        const s = session
        const q = s.questions[s.i]
        app.querySelector("#quit").onclick = () => {
          if (
            s.results.filter(Boolean).length &&
            !confirm("Выйти? Результат этого прохождения не сохранится.")
          )
            return
          renderList()
        }
        app.querySelectorAll("[data-opt]").forEach(
          (b) =>
            (b.onclick = () => {
              const i = Number(b.dataset.opt)
              const multi = q.options.filter((o) => o.correct).length > 1
              if (multi) s.picked.has(i) ? s.picked.delete(i) : s.picked.add(i)
              else s.picked = new Set([i])
              renderQuestion()
              const again = app.querySelector(`[data-opt="${i}"]`)
              if (again) again.focus()
            }),
        )
        app
          .querySelectorAll("[data-up]")
          .forEach((b) => (b.onclick = () => move(Number(b.dataset.up), -1)))
        app
          .querySelectorAll("[data-down]")
          .forEach((b) => (b.onclick = () => move(Number(b.dataset.down), 1)))
        const on = (sel, fn) => {
          const el = app.querySelector(sel)
          if (el) el.onclick = fn
        }
        on("#check", check)
        on("#skip", () => {
          s.picked = new Set()
          check(true)
        })
        on("#reveal", () => {
          s.revealed = true
          renderQuestion()
          focusFirst("[data-self]")
        })
        app.querySelectorAll("[data-self]").forEach(
          (b) =>
            (b.onclick = () => {
              s.results[s.i] = { correct: b.dataset.self === "1", picked: null }
              s.checked = true
              next()
            }),
        )
        on("#next", next)
      }

      function focusFirst(sel) {
        const el = app.querySelector(sel)
        if (el) el.focus({ preventScroll: true })
      }

      function move(pos, dir) {
        const o = session.order
        const to = pos + dir
        ;[o[pos], o[to]] = [o[to], o[pos]]
        renderQuestion()
        const btn =
          app.querySelector(dir < 0 ? `[data-up="${to}"]` : `[data-down="${to}"]`) ||
          app.querySelector(`[data-${dir < 0 ? "down" : "up"}="${to}"]`)
        if (btn) btn.focus()
      }

      function check(skipped) {
        const s = session
        const q = s.questions[s.i]
        let correct
        if (q.kind === "order")
          correct = skipped === true ? false : s.order.every((v, i) => v === i)
        else correct = q.options.every((o, i) => o.correct === s.picked.has(i)) && s.picked.size > 0
        s.results[s.i] = {
          correct,
          picked: q.kind === "order" ? [...s.order] : [...s.picked],
          skipped: skipped === true,
        }
        s.checked = true
        renderQuestion()
        focusFirst("#next")
      }

      function next() {
        const s = session
        if (s.i + 1 < s.questions.length) {
          s.i++
          resetQuestionState()
          renderQuestion()
          scrollToTop()
          focusFirst(".opt, #reveal, [data-down]")
        } else finish()
      }

      // ─── Экран: итоги ──────────────────────────────────────────────────
      function finish() {
        const s = session
        const total = s.questions.length
        const score = s.results.filter((r) => r && r.correct).length
        const duration = Date.now() - s.started

        // Статистика по колодам: последний результат, лучший процент и
        // карточки с ошибками — для «Только ошибки».
        for (const id of s.deckIds) {
          const idx = s.questions.map((q, i) => i).filter((i) => s.questions[i].deckId === id)
          if (!idx.length) continue
          const st = store.stats[id] || { attempts: 0, best: null, wrong: [] }
          const wrong = new Set(st.wrong)
          let deckScore = 0
          for (const i of idx) {
            const k = cardKey(s.questions[i].card)
            if (s.results[i] && s.results[i].correct) {
              deckScore++
              wrong.delete(k)
            } else wrong.add(k)
          }
          st.attempts++
          st.last = { score: deckScore, total: idx.length, at: Date.now() }
          // Лучший — по обычным прохождениям, не по «ошибкам».
          if (!s.mistakesMode) st.best = Math.max(st.best || 0, deckScore / idx.length)
          st.wrong = [...wrong]
          store.stats[id] = st
        }
        saveStore()

        const pct = Math.round((score / total) * 100)
        const mood =
          pct === 100
            ? "Без ошибок!"
            : pct >= 80
              ? "Хорошо"
              : pct >= 50
                ? "Есть что повторить"
                : "Стоит пройти ещё раз"
        let html = `<div class="top"><button class="ghost" id="back">← Тесты</button></div>
          <div class="card">
            <div class="muted small">${esc(s.title)}</div>
            <div class="score">${score} из ${total}</div>
            <p>${pct}% · ${mood} · ${fmtTime(duration)}</p>
            <div class="row">
              ${score < total ? `<button class="primary" id="redo-wrong">Пройти ошибки ещё раз</button>` : ""}
              <button ${score === total ? 'class="primary"' : ""} id="again">Пройти заново</button>
            </div>
          </div>`
        const mistakes = s.questions
          .map((q, i) => ({ q, r: s.results[i], i }))
          .filter((x) => !x.r || !x.r.correct)
        if (mistakes.length) {
          html += `<h2>Ошибки</h2><div class="card">`
          for (const { q, r, i } of mistakes) {
            const c = q.card
            html += `<div class="mistake"><div class="q">${i + 1}. ${esc(c.question)}</div>`
            if (q.kind === "choice") {
              const yours =
                r && r.picked && r.picked.length
                  ? r.picked.map((k) => q.options[k].text).join("; ")
                  : "нет ответа"
              html += `<div class="yours">Ваш ответ: ${esc(yours)}</div>`
              html += `<div class="correct">Верно: ${esc(
                q.options
                  .filter((o) => o.correct)
                  .map((o) => o.text)
                  .join("; "),
              )}</div>`
            } else if (q.kind === "order") {
              html += `<div class="correct">Верный порядок: ${esc(c.steps.join(" → "))}</div>`
            } else html += `<div class="correct">${esc(c.answer)}</div>`
            if (c.explanation) html += `<div class="explain small">${esc(c.explanation)}</div>`
            html += `</div>`
          }
          html += `</div>`
        }
        app.innerHTML = html
        scrollToTop()
        app.querySelector("#back").onclick = () => renderList()
        app.querySelector("#again").onclick = () =>
          startSession(s.deckIds, { title: s.title.replace(/ — ошибки$/, "") })
        const rw = app.querySelector("#redo-wrong")
        if (rw)
          rw.onclick = () => {
            const keys = new Set(mistakes.map((m) => m.q.key))
            startSession(s.deckIds, {
              onlyKeys: keys,
              title: s.title.replace(/ — ошибки$/, "") + " — ошибки",
            })
          }
        focusFirst("#redo-wrong, #again")
      }

      // ─── Клавиатура: 1–8 / А–З — вариант, Enter — проверить/дальше ──────
      document.addEventListener("keydown", (e) => {
        if (!session || e.target.matches("input, textarea") || e.ctrlKey || e.metaKey || e.altKey)
          return
        const q = session.questions[session.i]
        if (!q) return
        if (q.kind === "choice" && !session.checked) {
          let i = "12345678".indexOf(e.key)
          if (i < 0) i = LETTERS.indexOf(e.key.toUpperCase())
          if (i >= 0 && i < q.options.length) {
            e.preventDefault()
            app.querySelector(`[data-opt="${i}"]`).click()
            return
          }
        }
        if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) {
          const btn = app.querySelector("#next, #check:not([disabled]), #reveal")
          if (btn) {
            e.preventDefault()
            btn.click()
          }
        }
      })

      // ─── Старт ─────────────────────────────────────────────────────────
      fetch("decks.json")
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status)
          return r.json()
        })
        .then((data) => {
          builtIn = data.decks
          renderList()
        })
        .catch((err) => {
          builtIn = []
          renderList()
          app.insertAdjacentHTML(
            "afterbegin",
            `<p class="problems">Не удалось загрузить встроенные тесты (${esc(err.message)}). Свои колоды по-прежнему можно добавить.</p>`,
          )
        })
    </script>
  </body>
</html>
