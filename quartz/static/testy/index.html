<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тренажёр тестов</title>
    <style>
      /* Дизайн «Atlas 2» — те же токены (--k-*) и шрифт, что в quartz/styles/custom.scss.
         Внутри страницы сайта токены перезаписываются живыми значениями со страницы
         (syncTokens в скрипте), так что тренажёр следует за темой сайта. */
      @font-face { font-family: "Onest"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-cyrillic-ext.woff2") format("woff2"); unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
      @font-face { font-family: "Onest"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Onest"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Onest"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Onest"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-symbols.woff2") format("woff2"); unicode-range: U+2150-218F, U+2190, U+2192, U+2194-2199, U+21AF, U+21E6-21F0, U+21F3, U+2218-2219, U+2299, U+22C4-22C6, U+2300-243F, U+2440-244A, U+2460-24FF, U+25A0-27BF, U+2800-28FF; }
      @font-face { font-family: "Onest"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../fonts/onest-math.woff2") format("woff2"); unicode-range: U+0391-03A1, U+03A3-03A9, U+03B1-03C9, U+2070-209F, U+2190-21FF, U+2200-22FF, U+27C0-27FF; }

      :root {
        --k-font: "Onest", "PT Sans", Arial, sans-serif;
        color-scheme: light;
        --k-bg: oklch(.995 .0015 260);
        --k-panel: oklch(.975 .004 260);
        --k-elev: oklch(1 0 0);
        --k-text: oklch(.22 .02 262);
        --k-muted: oklch(.43 .018 262);
        --k-faint: oklch(.55 .015 262);
        --k-div: oklch(.22 .02 262 / .1);
        --k-div2: oklch(.22 .02 262 / .2);
        --k-ink: oklch(.22 .02 262);
        --k-blue: oklch(.47 .15 260);
        --k-nav-bg: oklch(.94 .03 260);
        --k-nav-ink: oklch(.4 .14 260);
        --k-fl: .968; --k-fc: .028;
        --k-ll: .58;  --k-lc: .16;
        --k-il: .47;  --k-ic: .15;
        --k-nb-fill: oklch(.955 .04 26);
        --k-nb-line: oklch(.56 .2 26);
        --k-nb-ink: oklch(.47 .17 26);
        --k-mark: oklch(.93 .09 95);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --k-bg: oklch(.185 .012 262);
        --k-panel: oklch(.168 .012 262);
        --k-elev: oklch(.235 .014 262);
        --k-text: oklch(.93 .006 262);
        --k-muted: oklch(.77 .01 262);
        --k-faint: oklch(.64 .012 262);
        --k-div: oklch(.93 .006 262 / .1);
        --k-div2: oklch(.93 .006 262 / .2);
        --k-ink: oklch(.93 .006 262 / .85);
        --k-blue: oklch(.77 .11 258);
        --k-nav-bg: oklch(.77 .11 258 / .14);
        --k-nav-ink: oklch(.86 .08 258);
        --k-fl: .24;  --k-fc: .035;
        --k-ll: .66;  --k-lc: .14;
        --k-il: .8;   --k-ic: .11;
        --k-nb-fill: oklch(.28 .07 26);
        --k-nb-line: oklch(.64 .18 26);
        --k-nb-ink: oklch(.85 .1 26);
        --k-mark: oklch(.38 .07 90);
      }
      :root {
        /* «верно» — зелёный оттенок самопроверки сайта, «неверно» — цвета NB */
        --ok-fill: oklch(var(--k-fl) var(--k-fc) 150);
        --ok-line: oklch(var(--k-ll) var(--k-lc) 150);
        --ok-ink: oklch(var(--k-il) var(--k-ic) 150);
        --blue-fill: oklch(var(--k-fl) var(--k-fc) 260);
        --blue-line: oklch(var(--k-ll) var(--k-lc) 260);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; background: var(--k-bg); color: var(--k-text);
        font-family: var(--k-font); font-size: 16.5px; line-height: 1.6;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      html:has(body.embedded), body.embedded { background: transparent; }
      ::selection { background: var(--k-nav-bg); }
      main { max-width: 760px; margin: 0 auto; padding: 24px 18px 48px; }
      body.embedded main { padding: 4px 0 16px; }
      body.embedded .intro { display: none; }
      h1, h2, h3 { font-family: var(--k-font); line-height: 1.15; margin: 0 0 8px; letter-spacing: -.015em; text-wrap: balance; }
      h1 { font-size: 34px; font-weight: 700; letter-spacing: -.028em; }
      h2 { font-size: 24px; font-weight: 700; margin-top: 28px; padding-top: 14px; border-top: 2px solid var(--k-ink); }
      h3 { font-size: 18px; font-weight: 600; }
      p { margin: 0 0 12px; }
      b, strong { font-weight: 600; }
      .muted { color: var(--k-muted); }
      .small { font-size: 14px; }

      button, .btn {
        font-family: var(--k-font); font-weight: 600; font-size: 14.5px; line-height: 1.2;
        border-radius: 6px; border: 0; box-shadow: inset 0 0 0 1px var(--k-div2);
        background: var(--k-panel); color: var(--k-text);
        padding: 10px 14px; cursor: pointer; min-height: 44px; touch-action: manipulation;
        transition: box-shadow .15s, background-color .15s;
      }
      button:hover { box-shadow: inset 0 0 0 1px var(--k-blue); }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-within {
        outline: 2px solid var(--k-blue); outline-offset: 2px;
      }
      button.primary { background: var(--k-ink); color: var(--k-bg); box-shadow: none; }
      button.primary:hover { background: var(--k-blue); color: var(--k-bg); box-shadow: none; }
      button.ghost { background: transparent; box-shadow: none; color: var(--k-blue); padding-inline: 6px; }
      button.ghost:hover { text-decoration: underline; text-underline-offset: 3px; }
      button:disabled { opacity: .45; cursor: default; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .spacer { flex: 1; }

      .card {
        background: var(--k-panel); border: 0; border-radius: 6px;
        box-shadow: inset 0 0 0 1px var(--k-div); padding: 16px; margin-bottom: 12px;
      }
      .deck { cursor: pointer; transition: box-shadow .15s; }
      .deck:hover { box-shadow: inset 0 0 0 1px var(--k-div2); }
      .deck h3 { margin-bottom: 2px; }
      .deck-open { all: unset; cursor: pointer; border-radius: 2px; }
      .deck-open:hover { color: var(--k-blue); }
      .deck-open:focus-visible { outline: 2px solid var(--k-blue); outline-offset: 2px; }
      .deck-open::after { content: " →"; color: var(--k-faint); font-size: .8em; }
      .deck.selected { background: var(--k-nav-bg); box-shadow: inset 0 0 0 1.5px var(--k-blue); }
      .deck-head { display: flex; gap: 12px; align-items: flex-start; }
      .deck-head > div { flex: 1; min-width: 0; }
      .pick {
        flex: none; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--k-muted);
        cursor: pointer; padding: 6px 8px; margin: -6px -8px 0 0; border-radius: 5px; min-height: 40px;
      }
      .pick input { width: 20px; height: 20px; accent-color: var(--k-blue); margin: 0; }
      .picker {
        background: var(--blue-fill); border: 0; border-top: 2px solid var(--blue-line); border-radius: 0;
        padding: 14px 16px; margin-bottom: 16px;
      }
      .picker p { margin: 0 0 10px; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
      .chip {
        font-size: 13px; font-weight: 500; padding: 2px 9px; border-radius: 5px;
        background: var(--k-bg); box-shadow: inset 0 0 0 1px var(--k-div2); color: var(--k-muted);
      }
      .chip.ok { background: var(--ok-fill); box-shadow: none; color: var(--ok-ink); }
      .chip.bad { background: var(--k-nb-fill); box-shadow: none; color: var(--k-nb-ink); }
      .toggles { display: flex; gap: 16px; flex-wrap: wrap; margin: 4px 0 16px; font-size: 15px; }
      .toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; border-radius: 5px; }
      .toggles select {
        font: inherit; min-height: 36px; padding: 4px 8px; border-radius: 6px;
        border: 1px solid var(--k-div2); background: var(--k-elev); color: var(--k-text);
      }
      .toggles input { width: 18px; height: 18px; accent-color: var(--k-blue); }

      /* Вопрос */
      .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .counter { font-weight: 600; font-size: 14px; color: var(--k-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .bar { height: 3px; background: var(--k-div); border-radius: 0; overflow: hidden; margin-bottom: 20px; }
      .bar > i { display: block; height: 100%; background: var(--k-ink); transition: width .2s; }
      .question { font-weight: 700; font-size: 23px; line-height: 1.25; letter-spacing: -.012em; margin-bottom: 6px; text-wrap: pretty; }
      .hint { font-size: 14px; color: var(--k-faint); margin-bottom: 14px; }
      .options { display: grid; gap: 8px; margin-bottom: 16px; }
      .opt {
        display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
        font-weight: 400; font-size: 16px; line-height: 1.45; padding: 12px 14px;
        background: var(--k-elev); box-shadow: inset 0 0 0 1px var(--k-div2);
      }
      .opt .key {
        flex: none; width: 24px; height: 24px; border-radius: 4px; margin-top: 1px;
        box-shadow: inset 0 0 0 1px var(--k-div2); display: grid; place-items: center;
        font-weight: 600; font-size: 13px; color: var(--k-muted); font-variant-numeric: tabular-nums;
      }
      .opt.multi .key { border-radius: 50%; }
      .opt[aria-pressed="true"] { background: var(--k-nav-bg); box-shadow: inset 0 0 0 1.5px var(--k-blue); }
      .opt[aria-pressed="true"] .key { background: var(--k-blue); box-shadow: none; color: var(--k-bg); }
      .opt.right { background: var(--ok-fill); box-shadow: inset 0 0 0 1.5px var(--ok-line); }
      .opt.right .key { background: var(--ok-line); box-shadow: none; color: #fff; }
      .opt.wrong { background: var(--k-nb-fill); box-shadow: inset 0 0 0 1.5px var(--k-nb-line); }
      .opt.wrong .key { background: var(--k-nb-line); box-shadow: none; color: #fff; }
      .opt.missed { box-shadow: inset 0 0 0 1.5px var(--ok-line); background: var(--k-elev); outline: 1.5px dashed var(--ok-line); outline-offset: -1.5px; }
      .opt:disabled { opacity: 1; cursor: default; }
      .steps { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
      .step {
        display: flex; align-items: center; gap: 8px; background: var(--k-elev);
        box-shadow: inset 0 0 0 1px var(--k-div2); border-radius: 6px; padding: 6px 6px 6px 12px;
      }
      .step .n { font-weight: 600; font-size: 13px; color: var(--k-faint); width: 18px; font-variant-numeric: tabular-nums; }
      .step .t { flex: 1; }
      .step button { min-height: 40px; min-width: 40px; padding: 6px; }
      .step.right { background: var(--ok-fill); box-shadow: inset 0 0 0 1.5px var(--ok-line); }
      .step.wrong { background: var(--k-nb-fill); box-shadow: inset 0 0 0 1.5px var(--k-nb-line); }
      .answer {
        border: 0; border-top: 2px solid var(--ok-line); border-radius: 0;
        padding: 10px 14px 12px; margin: 0 0 16px; background: var(--ok-fill); white-space: pre-line;
      }
      .verdict { font-weight: 700; margin-bottom: 8px; }
      .verdict.ok { color: var(--ok-ink); }
      .verdict.bad { color: var(--k-nb-ink); }
      .explain { color: var(--k-muted); margin-bottom: 14px; }
      .latin { font-style: italic; color: var(--k-muted); }

      /* Итоги */
      .score { font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -.03em; margin: 8px 0; font-variant-numeric: tabular-nums; }
      .mistake { border-top: 1px solid var(--k-div); padding: 12px 0; }
      .mistake:first-child { border-top: 0; }
      .mistake .q { font-weight: 600; margin-bottom: 4px; }
      .mistake .yours { color: var(--k-nb-ink); }
      .mistake .correct { color: var(--ok-ink); }

      /* Просмотр колоды */
      .browse-tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 12px 0 6px; }
      .browse-tools .field { flex: 1 1 240px; }
      .qa { border-top: 1px solid var(--k-div); padding: 14px 0; }
      .qa:first-child { border-top: 0; padding-top: 0; }
      .qa .q { font-weight: 600; margin-bottom: 6px; }
      .qa .num { color: var(--ok-ink); font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 4px; }
      .qa .chip { font-weight: 500; margin-left: 6px; vertical-align: 1px; }
      .qa-opts { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 3px; }
      .qa-opts li { display: flex; gap: 8px; color: var(--k-muted); }
      .qa-opts li::before { content: "–"; flex: none; width: 1em; text-align: center; color: var(--k-faint); }
      .qa-opts li.ok { color: var(--ok-ink); font-weight: 600; }
      .qa-opts li.ok::before { content: "✓"; color: var(--ok-ink); }
      .qa ol { margin: 0 0 6px; padding-left: 1.4em; }
      .qa .answer { margin-bottom: 6px; }
      .qa mark { background: var(--k-mark); color: inherit; border-radius: 2px; }
      textarea, .field {
        width: 100%; font-size: 15px; padding: 10px; border-radius: 6px;
        border: 1px solid var(--k-div2); background: var(--k-elev); color: var(--k-text);
      }
      textarea { min-height: 140px; font-family: "IBM Plex Mono", ui-monospace, monospace; line-height: 1.4; }
      .field { font-family: var(--k-font); flex: 1; min-width: 180px; min-height: 44px; }
      details { border-top: 2px dotted oklch(var(--k-ll) var(--k-lc) 85); padding-top: 12px; margin-top: 20px; }
      details details { border-top: 0; padding-top: 0; margin-top: 8px; }
      details summary { cursor: pointer; font-weight: 600; font-size: 17px; min-height: 32px; color: oklch(var(--k-il) var(--k-ic) 85); }
      details details summary { font-size: 14px; color: var(--k-blue); }
      pre.example {
        background: var(--k-panel); border: 0; box-shadow: inset 0 0 0 1px var(--k-div); border-radius: 6px;
        padding: 10px; overflow-x: auto; font-size: 13.5px;
      }
      .problems { color: var(--k-nb-ink); font-size: 14.5px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @media (max-width: 480px) {
        main { padding: 16px 14px 40px; }
        .question { font-size: 20px; }
        .row > button { flex: 1 1 auto; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"><p class="muted">Загрузка тестов…</p></main>

    <script>
      "use strict"

      // ─── Тема: как у сайта ──────────────────────────────────────────────
      // В iframe читаем атрибут saved-theme у страницы сайта и следим за ним;
      // отдельно — тот же ключ localStorage «theme», что пишет Quartz.
      const embedded = (() => {
        try {
          return window.self !== window.top && !!window.frameElement
        } catch {
          return false
        }
      })()
      if (embedded) document.body.classList.add("embedded")

      // Токены оформления сайта (quartz/styles/custom.scss). Внутри страницы
      // сайта берём их живые значения — тренажёр не разойдётся с темой, даже
      // если её поменяют.
      const TOKENS = [
        "--k-font",
        "--k-bg",
        "--k-panel",
        "--k-elev",
        "--k-text",
        "--k-muted",
        "--k-faint",
        "--k-div",
        "--k-div2",
        "--k-ink",
        "--k-blue",
        "--k-nav-bg",
        "--k-nav-ink",
        "--k-fl",
        "--k-fc",
        "--k-ll",
        "--k-lc",
        "--k-il",
        "--k-ic",
        "--k-nb-fill",
        "--k-nb-line",
        "--k-nb-ink",
        "--k-mark",
      ]
      function syncTokens() {
        const root = document.documentElement
        let cs = null
        try {
          if (embedded) cs = window.parent.getComputedStyle(window.parent.document.documentElement)
        } catch {}
        for (const name of TOKENS) {
          const v = cs ? cs.getPropertyValue(name).trim() : ""
          if (v) root.style.setProperty(name, v)
          else root.style.removeProperty(name)
        }
      }

      function applyTheme() {
        let theme = null
        try {
          if (embedded) theme = window.parent.document.documentElement.getAttribute("saved-theme")
        } catch {}
        if (!theme) {
          try {
            theme = localStorage.getItem("theme")
          } catch {}
        }
        if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = theme
        syncTokens()
      }
      applyTheme()
      try {
        if (embedded)
          new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {
            attributes: true,
            attributeFilter: ["saved-theme"],
          })
      } catch {}
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme)

      // Высота iframe — по содержимому, чтобы не было второй прокрутки.
      function fitFrame() {
        if (!embedded) return
        try {
          window.frameElement.style.height =
            Math.ceil(document.getElementById("app").getBoundingClientRect().height) + "px"
        } catch {}
      }
      if (embedded) new ResizeObserver(fitFrame).observe(document.getElementById("app"))

      // Вернуться к карточке темы после просмотра её вопросов.
      function scrollToDeck(id) {
        const card = [...app.querySelectorAll(".deck")].find((c) => c.dataset.deck === id)
        if (!card) return
        requestAnimationFrame(() => {
          if (embedded) {
            try {
              const top = window.frameElement.getBoundingClientRect().top + card.offsetTop
              window.parent.scrollBy({ top: top - 16 })
            } catch {}
          } else card.scrollIntoView({ block: "start" })
          const btn = card.querySelector(".deck-open")
          if (btn) btn.focus({ preventScroll: true })
        })
      }

      function scrollToTop() {
        if (embedded) {
          try {
            const r = window.frameElement.getBoundingClientRect()
            if (r.top < 0)
              window.frameElement.scrollIntoView({ block: "start", behavior: "smooth" })
          } catch {}
        } else window.scrollTo({ top: 0, behavior: "smooth" })
      }

      // ─── Хранилище: результаты и свои колоды — только в этом браузере ────
      const STORE_KEY = "konspekty-testy-v1"
      function loadStore() {
        try {
          const s = JSON.parse(localStorage.getItem(STORE_KEY) || "{}")
          return { stats: s.stats || {}, imported: s.imported || [], prefs: s.prefs || {} }
        } catch {
          return { stats: {}, imported: [], prefs: {} }
        }
      }
      let store = loadStore()
      function saveStore() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(store))
        } catch {}
      }

      // Ключ карточки — по тексту вопроса и вариантов: переживает правку порядка в колоде,
      // а одинаковые формулировки с разными вариантами не сливаются.
      function cardKey(card) {
        const s = [
          card.type,
          card.question,
          card.answer || "",
          ...(card.options || []).map((o) => (o.correct ? "+" : "-") + o.text),
          ...(card.steps || []),
        ].join("|")
        let h = 5381
        for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0
        return (h >>> 0).toString(36)
      }

      // ─── Разбор текста в карточки: тот же формат, что импорт/экспорт StudyStasMed
      // (lib/importParser.ts). Вопрос — первая строка блока; «+ верный / - неверный»
      // или «а) … б) …» и «Ответ: а, в»; «Порядок: …» и шаги «1. …».
      const MAX_ITEMS = 8
      const QUESTION_NUMBER = /^\s*(?:вопрос\s*)?\d{1,4}\s*(?:[.)]\s+|\t\s*)(?=\S)/i
      const ORDER_HEAD =
        /^\s*(?:порядок|последовательность|расставьте(?:\s+по\s+порядку)?)\s*[:.\-—]?\s*/i
      const MARK_OPTION = /^\s*([+\-*•])\s*(.+)$/
      const LETTER_OPTION = /^\s*([а-жa-h])\s*(?:[).]|\t)\s*(.+)$/i
      const NUMBER_ITEM = /^\s*(\d{1,2})\s*(?:[.)]|\t)\s*(.+)$/
      const ANSWER_KEY = /^\s*(?:правильн[а-яё]*\s+)?ответ[а-яё]*\s*[:.\-—–]\s*(.+)$/i
      const Q_PREFIX = /^\s*(?:в|q|вопрос)\s*[:.]\s*/i
      const A_PREFIX = /^\s*(?:о|a|ответ)\s*[:.]\s+/i
      const COMMENT = /^\s*#/
      const LETTERS_RU = "абвгдежз"
      const LETTERS_EN = "abcdefgh"
      const clean = (s) => s.replace(/\s+/g, " ").trim()

      function optionIndex(token) {
        const t = token.toLowerCase()
        if (/^\d+$/.test(t)) return Number(t) - 1
        const ru = LETTERS_RU.indexOf(t)
        if (ru >= 0) return ru
        const en = LETTERS_EN.indexOf(t)
        return en >= 0 ? en : null
      }
      function parseKey(key) {
        const tokens = key.match(/\d+|[а-жa-h](?![а-яa-z])/gi) || []
        const joined = key.replace(/[\s,;и&]+|and/gi, "")
        const letters = /^[а-жa-h]+$/i.test(joined) ? joined.split("") : tokens
        return [...new Set(letters.map(optionIndex).filter((i) => i !== null && i >= 0))]
      }
      const hasBody = (block) =>
        block
          .slice(1)
          .some(
            (l) =>
              MARK_OPTION.test(l.text) ||
              LETTER_OPTION.test(l.text) ||
              ANSWER_KEY.test(l.text) ||
              l.list === "nested",
          )
      function splitBlocks(lines) {
        const blocks = []
        let current = []
        let inOrder = false
        const flush = () => {
          if (current.length) blocks.push(current)
          current = []
          inOrder = false
        }
        for (const line of lines) {
          if (COMMENT.test(line.text)) continue
          if (!line.text.trim()) {
            flush()
            continue
          }
          const startsQuestion =
            (QUESTION_NUMBER.test(line.text) && !inOrder) ||
            (line.list === "top" && current.length > 0 && !inOrder)
          if (startsQuestion && current.length > 0 && hasBody(current)) flush()
          if (current.length === 0 && ORDER_HEAD.test(line.text)) inOrder = true
          current.push(line)
        }
        flush()
        return blocks
      }
      function parseBlock(block) {
        const [head, ...rest] = block
        if (ORDER_HEAD.test(head.text)) {
          const title = clean(head.text.replace(ORDER_HEAD, ""))
          const steps = rest
            .map((l) => clean(l.text.replace(NUMBER_ITEM, "$2").replace(MARK_OPTION, "$2")))
            .filter(Boolean)
          if (steps.length < 2) return "в «Порядке» нужно хотя бы два шага"
          if (steps.length > MAX_ITEMS) return `в «Порядке» больше ${MAX_ITEMS} шагов`
          return { type: "order", question: title || "Расставьте по порядку", steps }
        }
        const question = clean(head.text.replace(QUESTION_NUMBER, "").replace(Q_PREFIX, ""))
        if (!question) return "пустой вопрос"
        const options = []
        const answerLines = []
        let key = null
        let latin
        for (const line of rest) {
          const keyMatch = line.text.match(ANSWER_KEY)
          const mark = line.text.match(MARK_OPTION)
          const letter = line.text.match(LETTER_OPTION)
          if (keyMatch && options.length > 0) {
            key = parseKey(keyMatch[1])
          } else if (mark) {
            const sign = mark[1]
            let text = clean(mark[2])
            const starred = text.endsWith("*")
            if (starred) text = clean(text.slice(0, -1))
            options.push({
              text,
              correct:
                sign === "+" || sign === "*" || starred || line.bold === true
                  ? true
                  : sign === "-"
                    ? false
                    : null,
            })
          } else if (letter) {
            let text = clean(letter[2])
            const starred = text.endsWith("*") || text.startsWith("*")
            text = clean(text.replace(/^\*|\*$/g, ""))
            options.push({ text, correct: starred || line.bold === true ? true : null })
          } else if (line.list === "nested" || (line.list && options.length > 0)) {
            let text = clean(line.text)
            const starred = text.endsWith("*")
            if (starred) text = clean(text.slice(0, -1))
            options.push({ text, correct: starred || line.bold === true ? true : null })
          } else if (keyMatch) {
            answerLines.push(clean(keyMatch[1]))
          } else {
            const t = clean(line.text.replace(A_PREFIX, ""))
            // Экспорт StudyStasMed пишет латынь строкой «Лат.: …».
            const lat = t.match(/^Лат\.:\s*(.+)$/)
            if (lat) latin = lat[1]
            else answerLines.push(t)
          }
        }
        if (options.length > 0) {
          if (key) key.forEach((i) => options[i] && (options[i].correct = true))
          const marked = options.map((o) => ({ text: o.text, correct: o.correct === true }))
          if (marked.length < 2) return "у вопроса с вариантами нужен хотя бы второй вариант"
          if (marked.length > MAX_ITEMS) return `больше ${MAX_ITEMS} вариантов`
          if (!marked.some((o) => o.correct))
            return "не отмечен верный вариант (+, жирный шрифт или строка «Ответ: …»)"
          return { type: "multi", question, options: marked }
        }
        const answer = answerLines.filter(Boolean).join("\n")
        if (!answer)
          return latin ? { type: "single", question, answer: latin } : "нет ответа под вопросом"
        return latin
          ? { type: "single", question, answer, latin }
          : { type: "single", question, answer }
      }
      function parseLines(lines) {
        const cards = []
        const problems = []
        splitBlocks(lines).forEach((block, i) => {
          const parsed = parseBlock(block)
          if (typeof parsed === "string")
            problems.push({
              block: i + 1,
              preview: clean(block[0].text).slice(0, 80),
              reason: parsed,
            })
          else cards.push(parsed)
        })
        return { cards, problems }
      }
      function parseText(text) {
        return parseLines(
          text
            .replace(/\r\n?/g, "\n")
            .split("\n")
            .map((t) => ({ text: t })),
        )
      }

      // Word (.docx): достаём word/document.xml из zip и берём абзацы.
      async function readDocxXml(buffer) {
        const view = new DataView(buffer)
        const bytes = new Uint8Array(buffer)
        let eocd = -1
        for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
          if (view.getUint32(i, true) === 0x06054b50) {
            eocd = i
            break
          }
        }
        if (eocd < 0) throw new Error("это не файл Word")
        const count = view.getUint16(eocd + 10, true)
        let p = view.getUint32(eocd + 16, true)
        for (let n = 0; n < count; n++) {
          const method = view.getUint16(p + 10, true)
          const size = view.getUint32(p + 20, true)
          const nameLen = view.getUint16(p + 28, true)
          const extraLen = view.getUint16(p + 30, true)
          const commentLen = view.getUint16(p + 32, true)
          const local = view.getUint32(p + 42, true)
          const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen))
          if (name === "word/document.xml") {
            const start =
              local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true)
            const data = bytes.subarray(start, start + size)
            if (method === 0) return new TextDecoder().decode(data)
            const stream = new Blob([data])
              .stream()
              .pipeThrough(new DecompressionStream("deflate-raw"))
            return await new Response(stream).text()
          }
          p += 46 + nameLen + extraLen + commentLen
        }
        throw new Error("в файле нет текста документа")
      }
      const decodeXml = (s) =>
        s
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'")
          .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
          .replace(/&amp;/g, "&")
      function docxParagraphs(xml) {
        const out = []
        const paragraphs = xml.match(/<w:p[ >][\s\S]*?<\/w:p>|<w:p\/>/g) || []
        for (const p of paragraphs) {
          const runs = p.match(/<w:r[ >][\s\S]*?<\/w:r>/g) || []
          let text = ""
          let allBold = runs.length > 0
          let anyText = false
          for (const r of runs) {
            const pieces = r.match(/<w:t(?:\s[^>]*)?>[\s\S]*?<\/w:t>|<w:tab\/>|<w:br\/>/g) || []
            const runText = pieces
              .map((x) =>
                x === "<w:tab/>"
                  ? "\t"
                  : x === "<w:br/>"
                    ? "\n"
                    : decodeXml(x.replace(/<[^>]+>/g, "")),
              )
              .join("")
            if (runText.trim()) {
              anyText = true
              if (!/<w:b\/>|<w:b\s+w:val="(?:1|true)"\s*\/>/.test(r)) allBold = false
            }
            text += runText
          }
          const numbered = /<w:numPr>/.test(p)
          const level = Number((p.match(/<w:ilvl\s+w:val="(\d+)"/) || [])[1] || "0")
          text.split("\n").forEach((part, i) =>
            out.push({
              text: part,
              list: numbered && i === 0 ? (level > 0 ? "nested" : "top") : undefined,
              bold: anyText && allBold,
            }),
          )
        }
        return out
      }
      // Заголовок экспорта: «# Название» и «# Предмет: …».
      function headerOf(lines) {
        const comments = lines
          .filter((l) => COMMENT.test(l.text))
          .map((l) => l.text.replace(/^\s*#\s*/, ""))
        const subject = (comments.find((c) => /^Предмет:/.test(c)) || "").match(
          /^Предмет:\s*([^.]+)/,
        )
        return {
          title: comments.find((c) => c && !/^Предмет:/.test(c)) || "",
          subject: subject ? subject[1].trim() : "",
        }
      }

      // ─── Колоды ────────────────────────────────────────────────────────
      let builtIn = []
      const allDecks = () => [...builtIn, ...store.imported]
      const deckById = (id) => allDecks().find((d) => d.id === id)

      // ─── Утилиты ───────────────────────────────────────────────────────
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        )
      function shuffle(items) {
        const out = [...items]
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[out[i], out[j]] = [out[j], out[i]]
        }
        return out
      }
      const plural = (n, one, few, many) => {
        const m10 = n % 10,
          m100 = n % 100
        if (m10 === 1 && m100 !== 11) return one
        if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few
        return many
      }
      const LETTERS = "АБВГДЕЖЗ"
      const fmtTime = (ms) => {
        const s = Math.round(ms / 1000)
        return s < 60 ? `${s} с` : `${Math.floor(s / 60)} мин ${String(s % 60).padStart(2, "0")} с`
      }
      const fmtDate = (t) =>
        new Date(t).toLocaleDateString("ru-RU", { day: "numeric", month: "long" })

      // ─── Сборка теста ──────────────────────────────────────────────────
      // Карточка «вопрос — ответ» становится вопросом с выбором: неверные
      // варианты — ответы других карточек той же колоды (как квиз в StudyStasMed).
      // Если таких карточек меньше четырёх — самопроверка «показать ответ».
      // shuffleOptions — варианты вразнобой; выключено — в порядке исходного теста.
      // У собранных из «вопрос — ответ» порядок всегда случайный: иначе верный
      // стоял бы первым.
      function buildQuestions(entries, { shuffleOrder, shuffleOptions = true }) {
        const singles = entries.filter((e) => e.card.type === "single" && e.card.answer.trim())
        const list = shuffleOrder ? shuffle(entries) : entries
        return list.map(({ card, deckId }) => {
          const q = { card, deckId, key: deckId + ":" + cardKey(card) }
          if (card.type === "single") {
            const others = singles.filter((o) => o.card !== card && o.card.answer !== card.answer)
            if (others.length >= 3) {
              const same = shuffle(others.filter((o) => o.deckId === deckId))
              const elsewhere = shuffle(others.filter((o) => o.deckId !== deckId))
              const wrong = [...same, ...elsewhere].slice(0, 3).map((o) => o.card.answer)
              q.kind = "choice"
              q.options = shuffle([
                { text: card.answer, correct: true },
                ...wrong.map((text) => ({ text, correct: false })),
              ])
            } else q.kind = "self"
          } else if (card.type === "multi") {
            q.kind = "choice"
            q.options = shuffleOptions ? shuffle(card.options) : [...card.options]
          } else {
            q.kind = "order"
            let order = shuffle(card.steps.map((_, i) => i))
            // Перемешанный порядок не должен совпасть с верным.
            if (order.every((v, i) => v === i) && order.length > 1)
              order = [...order.slice(1), order[0]]
            q.order = order
          }
          return q
        })
      }

      // ─── Состояние экрана ──────────────────────────────────────────────
      let session = null // { title, deckIds, questions, i, answers, started, picked, checked }
      const app = document.getElementById("app")

      function prefs() {
        return {
          shuffle: store.prefs.shuffle !== false,
          shuffleOptions: store.prefs.shuffleOptions !== false,
          limit: store.prefs.limit ?? 20,
        }
      }

      function startSession(deckIds, { onlyKeys = null, title } = {}) {
        const entries = []
        for (const id of deckIds) {
          const d = deckById(id)
          if (!d) continue
          for (const card of d.cards) entries.push({ card, deckId: id })
        }
        let filtered = entries
        if (onlyKeys)
          filtered = entries.filter((e) => onlyKeys.has(e.deckId + ":" + cardKey(e.card)))
        if (!filtered.length) return
        let questions = buildQuestions(filtered, {
          shuffleOrder: prefs().shuffle,
          shuffleOptions: prefs().shuffleOptions,
        })
        // Неверные варианты берём из всей колоды, даже если проходим только ошибки.
        if (onlyKeys) {
          const full = buildQuestions(entries, {
            shuffleOrder: false,
            shuffleOptions: prefs().shuffleOptions,
          })
          const byKey = new Map(full.map((q) => [q.key, q]))
          questions.forEach((q, i) => {
            const f = byKey.get(q.key)
            if (f && q.kind === "self" && f.kind === "choice") questions[i] = { ...f }
          })
        }
        if (prefs().limit) questions = questions.slice(0, prefs().limit)
        session = {
          title: title || scopeTitle(deckIds),
          deckIds,
          mistakesMode: !!onlyKeys,
          questions,
          i: 0,
          results: [],
          started: Date.now(),
        }
        resetQuestionState()
        lockPresses()
        renderQuestion()
        scrollToTop()
      }

      function resetQuestionState() {
        const q = session.questions[session.i]
        session.picked = new Set()
        session.checked = false
        session.revealed = false
        session.order = q && q.kind === "order" ? [...q.order] : null
      }

      // ─── Экран: список тестов ──────────────────────────────────────────
      // Ошибки колоды — только по вопросам, которые в ней ещё есть.
      function wrongKeys(id) {
        const d = deckById(id)
        const st = store.stats[id]
        if (!d || !st || !st.wrong || !st.wrong.length) return []
        const have = new Set(d.cards.map(cardKey))
        return st.wrong.filter((k) => have.has(k))
      }
      function mistakesSession(ids, title) {
        const keys = new Set(ids.flatMap((id) => wrongKeys(id).map((k) => id + ":" + k)))
        if (keys.size) startSession(ids, { onlyKeys: keys, title: title + " — ошибки" })
      }
      // Выбранные темы — запоминаются в этом браузере.
      function selectedIds() {
        const ids = new Set(allDecks().map((d) => d.id))
        return (store.prefs.selected || []).filter((id) => ids.has(id))
      }
      function scopeTitle(ids) {
        if (ids.length === 1) return deckById(ids[0]).title
        if (ids.length === allDecks().length) return "Все темы"
        return `Выбранные темы (${ids.length})`
      }
      function pickerHtml() {
        const decks = allDecks()
        const sel = selectedIds()
        const scope = sel.length ? sel : decks.map((d) => d.id)
        const questions = scope.reduce((n, id) => n + deckById(id).cards.length, 0)
        const wrong = scope.reduce((n, id) => n + wrongKeys(id).length, 0)
        const qWord = plural(questions, "вопрос", "вопроса", "вопросов")
        const text = sel.length
          ? `Выбрано: <b>${sel.length}</b> ${plural(sel.length, "тема", "темы", "тем")} из ${decks.length}, ${questions} ${qWord}${wrong ? `, ошибок к повтору: ${wrong}` : ""}.`
          : `Отметьте темы галочками, чтобы пройти несколько сразу. Без выбора — все темы${wrong ? `, ошибок к повтору: ${wrong}` : ""}.`
        return `<p class="small">${text}</p>
          <div class="row">
            <button class="primary" id="run-scope">${sel.length ? "Пройти выбранные" : "Пройти все темы"}</button>
            <button id="run-mistakes" ${wrong ? "" : "disabled"}>Только ошибки${wrong ? ` (${wrong})` : ""}</button>
            <span class="spacer"></span>
            ${
              sel.length
                ? `<button class="ghost" id="pick-none">Снять выбор</button>`
                : `<button class="ghost" id="pick-all">Выбрать все</button>`
            }
          </div>`
      }
      function bindPicker() {
        const box = app.querySelector("#picker")
        if (!box) return
        box.innerHTML = pickerHtml()
        const scope = () => {
          const sel = selectedIds()
          return sel.length ? sel : allDecks().map((d) => d.id)
        }
        box.querySelector("#run-scope").onclick = () => {
          const ids = scope()
          startSession(ids, { title: scopeTitle(ids) })
        }
        box.querySelector("#run-mistakes").onclick = () => {
          const ids = scope()
          mistakesSession(ids, scopeTitle(ids))
        }
        const setAll = (on) => {
          store.prefs.selected = on ? allDecks().map((d) => d.id) : []
          saveStore()
          app.querySelectorAll("[data-pick]").forEach((cb) => {
            cb.checked = on
            cb.closest(".deck").classList.toggle("selected", on)
          })
          bindPicker()
        }
        const all = box.querySelector("#pick-all")
        if (all) all.onclick = () => setAll(true)
        const none = box.querySelector("#pick-none")
        if (none) none.onclick = () => setAll(false)
      }

      function renderList(message, focusDeck) {
        session = null
        const decks = allDecks()
        const total = decks.reduce((n, d) => n + d.cards.length, 0)
        const p = prefs()
        let html = ""
        if (!embedded) html += `<h1>Тренажёр тестов</h1>`
        html += `<p class="muted intro">${decks.length} ${plural(decks.length, "тест", "теста", "тестов")}, ${total} ${plural(total, "вопрос", "вопроса", "вопросов")}. Результаты сохраняются только в этом браузере.</p>`
        if (message) html += `<p class="chip ok" style="display:inline-block">${esc(message)}</p>`
        html += `<div class="toggles">
          <label><input type="checkbox" id="opt-shuffle" ${p.shuffle ? "checked" : ""}> Перемешивать вопросы</label>
          <label><input type="checkbox" id="opt-shuffle-options" ${p.shuffleOptions ? "checked" : ""}> Перемешивать варианты ответа</label>
          <label>Вопросов за раз:
            <select id="opt-limit">
              ${[10, 20, 50, 0].map((n) => `<option value="${n}" ${p.limit === n ? "selected" : ""}>${n || "все"}</option>`).join("")}
            </select>
          </label>
        </div>`
        if (decks.length > 1) html += `<div class="picker" id="picker"></div>`
        for (const d of decks) {
          const st = store.stats[d.id]
          const wrong = wrongKeys(d.id).length
          const picked = selectedIds().includes(d.id)
          const counts = { single: 0, multi: 0, order: 0 }
          d.cards.forEach((c) => counts[c.type]++)
          html += `<section class="card deck${picked ? " selected" : ""}" data-deck="${esc(d.id)}">
            <div class="deck-head">
              <div>
                <h3><button class="deck-open" data-open="${esc(d.id)}" title="Все вопросы и ответы">${esc(d.title)}</button></h3>
                <div class="muted small">${esc(d.subject || "")}${d.author ? " · " + esc(d.author) : ""}</div>
              </div>
              <label class="pick"><input type="checkbox" data-pick="${esc(d.id)}" ${picked ? "checked" : ""} aria-label="Выбрать тему «${esc(d.title)}»"> Выбрать</label>
            </div>
            ${d.description ? `<p class="small" style="margin:6px 0 0">${esc(d.description)}</p>` : ""}
            <div class="chips">
              <span class="chip">${d.cards.length} ${plural(d.cards.length, "вопрос", "вопроса", "вопросов")}</span>
              ${counts.order ? `<span class="chip">${counts.order} на порядок</span>` : ""}
              ${st ? `<span class="chip ${st.last.score === st.last.total ? "ok" : ""}">последний: ${st.last.score} из ${st.last.total}, ${fmtDate(st.last.at)}</span>` : ""}
              ${st && st.best != null ? `<span class="chip">лучший: ${Math.round(st.best * 100)}%</span>` : ""}
              ${wrong ? `<span class="chip bad">ошибок к повтору: ${wrong}</span>` : ""}
              ${d.imported ? `<span class="chip">своя колода</span>` : ""}
            </div>
            <div class="row">
              <button class="primary" data-start="${esc(d.id)}">Пройти тест</button>
              ${wrong ? `<button data-mistakes="${esc(d.id)}">Только ошибки</button>` : ""}
              <span class="spacer"></span>
              ${d.imported ? `<button class="ghost" data-remove="${esc(d.id)}">Удалить</button>` : ""}
            </div>
          </section>`
        }

        html += `<section class="card">
          <details id="import">
            <summary>Добавить свою колоду</summary>
            <p class="small" style="margin-top:8px">Выгрузите колоду из приложения StudyStasMed (колода → «Выгрузить» → текст или Word) и выберите файл — или вставьте текст теста. Колода сохранится в этом браузере.</p>
            <div class="row" style="margin-bottom:10px">
              <label class="btn" style="display:inline-flex;align-items:center">
                Выбрать файл .txt или .docx
                <input type="file" id="file" accept=".txt,.docx,text/plain" class="sr-only">
              </label>
            </div>
            <label for="paste" class="small muted">Или вставьте текст:</label>
            <textarea id="paste" placeholder="Каковы характеристики пассивного транспорта?\n+ Осуществляется по градиенту концентраций\n- Требует затраты энергии АТФ"></textarea>
            <div class="row" style="margin-top:8px">
              <input id="paste-title" class="field" placeholder="Название колоды">
              <button id="paste-go">Добавить</button>
            </div>
            <div id="import-msg" class="problems" style="margin-top:8px"></div>
            <details style="margin-top:10px">
              <summary class="small">Формат</summary>
              <pre class="example">Вопрос с ответом текстом
Ответ — следующей строкой

Вопрос с вариантами?
+ верный вариант
- неверный вариант

Или так?
а) первый
б) второй
в) третий
Ответ: б, в

Порядок: заголовок
1. первый шаг
2. второй шаг</pre>
            </details>
          </details>
        </section>`
        app.innerHTML = html

        app.querySelector("#opt-limit").onchange = (e) => {
          store.prefs.limit = Number(e.target.value)
          saveStore()
        }
        app.querySelector("#opt-shuffle-options").onchange = (e) => {
          store.prefs.shuffleOptions = e.target.checked
          saveStore()
        }
        app.querySelector("#opt-shuffle").onchange = (e) => {
          store.prefs.shuffle = e.target.checked
          saveStore()
        }
        app
          .querySelectorAll("[data-start]")
          .forEach((b) => (b.onclick = () => startSession([b.dataset.start])))
        // Нажатие на тему (название или свободное место карточки) — все вопросы с ответами.
        app.querySelectorAll(".deck").forEach(
          (card) =>
            (card.onclick = (e) => {
              const ctl = e.target.closest("button, label, input, select, a")
              if (ctl && !ctl.matches(".deck-open")) return
              if (getSelection().toString()) return
              renderBrowse(card.dataset.deck)
            }),
        )
        app.querySelectorAll("[data-mistakes]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.mistakes
              mistakesSession([id], deckById(id).title)
            }),
        )
        app.querySelectorAll("[data-remove]").forEach(
          (b) =>
            (b.onclick = () => {
              const d = deckById(b.dataset.remove)
              if (!confirm(`Удалить колоду «${d.title}» из этого браузера?`)) return
              store.imported = store.imported.filter((x) => x.id !== d.id)
              store.prefs.selected = (store.prefs.selected || []).filter((x) => x !== d.id)
              delete store.stats[d.id]
              saveStore()
              renderList()
            }),
        )
        app.querySelectorAll("[data-pick]").forEach(
          (cb) =>
            (cb.onchange = () => {
              const id = cb.dataset.pick
              const sel = new Set(selectedIds())
              cb.checked ? sel.add(id) : sel.delete(id)
              store.prefs.selected = allDecks()
                .map((d) => d.id)
                .filter((x) => sel.has(x))
              saveStore()
              cb.closest(".deck").classList.toggle("selected", cb.checked)
              bindPicker()
            }),
        )
        bindPicker()
        if (focusDeck) scrollToDeck(focusDeck)

        app.querySelector("#file").onchange = async (e) => {
          const file = e.target.files[0]
          if (!file) return
          try {
            const lines = /\.docx$/i.test(file.name)
              ? docxParagraphs(await readDocxXml(await file.arrayBuffer()))
              : (await file.text())
                  .replace(/\r\n?/g, "\n")
                  .split("\n")
                  .map((t) => ({ text: t }))
            const head = headerOf(lines)
            addImported(
              parseLines(lines),
              head.title || file.name.replace(/\.(txt|docx)$/i, ""),
              head.subject,
            )
          } catch (err) {
            app.querySelector("#import-msg").textContent =
              "Не удалось прочитать файл: " + err.message
          }
        }
        app.querySelector("#paste-go").onclick = () => {
          const text = app.querySelector("#paste").value
          const lines = text
            .replace(/\r\n?/g, "\n")
            .split("\n")
            .map((t) => ({ text: t }))
          const head = headerOf(lines)
          const title = app.querySelector("#paste-title").value.trim() || head.title || "Моя колода"
          addImported(parseLines(lines), title, head.subject)
        }
      }

      function addImported(result, title, subject) {
        const msg = app.querySelector("#import-msg")
        if (!result.cards.length) {
          msg.innerHTML =
            "Не нашлось ни одного вопроса." +
            (result.problems.length
              ? "<br>" +
                result.problems
                  .slice(0, 5)
                  .map((p) => `Блок ${p.block} («${esc(p.preview)}»): ${esc(p.reason)}`)
                  .join("<br>")
              : "")
          return
        }
        const deck = {
          id: "own-" + Date.now().toString(36),
          title,
          subject: subject || "",
          author: "",
          description: "",
          imported: true,
          cards: result.cards,
        }
        store.imported.push(deck)
        saveStore()
        const skipped = result.problems.length
          ? `, пропущено ${result.problems.length}: ` +
            result.problems
              .slice(0, 3)
              .map((p) => `«${p.preview}» — ${p.reason}`)
              .join("; ")
          : ""
        renderList(
          `Добавлено: «${title}», ${result.cards.length} ${plural(result.cards.length, "вопрос", "вопроса", "вопросов")}${skipped}`,
        )
      }

      // ─── Экран: все вопросы колоды с ответами ──────────────────────────
      const norm = (t) => String(t).toLowerCase().replace(/ё/g, "е")
      const cardText = (c) =>
        norm(
          [
            c.question,
            c.answer || "",
            c.latin || "",
            c.explanation || "",
            ...(c.options || []).map((o) => o.text),
            ...(c.steps || []),
          ].join("\n"),
        )
      // Экранированный текст с подсветкой совпадений (без учёта регистра и ё/е).
      function marked(text, query) {
        const t = String(text)
        if (!query) return esc(t)
        const hay = norm(t)
        let out = ""
        let from = 0
        for (let at = hay.indexOf(query); at >= 0; at = hay.indexOf(query, at + query.length)) {
          out += esc(t.slice(from, at)) + "<mark>" + esc(t.slice(at, at + query.length)) + "</mark>"
          from = at + query.length
        }
        return out + esc(t.slice(from))
      }

      function renderBrowse(id) {
        const d = deckById(id)
        if (!d) return renderList()
        session = null
        const wrong = new Set(wrongKeys(id))
        const view = { query: "", onlyWrong: false }
        app.innerHTML = `<div class="top"><button class="ghost" id="back">← Тесты</button></div>
          <h2 style="margin-top:0">${esc(d.title)}</h2>
          <div class="muted small">${d.cards.length} ${plural(d.cards.length, "вопрос", "вопроса", "вопросов")} с ответами${wrong.size ? ` · ошибок к повтору: ${wrong.size}` : ""}</div>
          <div class="row" style="margin-top:12px">
            <button class="primary" id="b-start">Пройти тест</button>
            ${wrong.size ? `<button id="b-mistakes">Только ошибки</button>` : ""}
          </div>
          <div class="browse-tools">
            <input type="search" id="b-search" class="field" placeholder="Поиск по вопросам и ответам" aria-label="Поиск по вопросам и ответам">
            ${wrong.size ? `<label class="toggles" style="margin:0"><input type="checkbox" id="b-wrong"> Только мои ошибки</label>` : ""}
          </div>
          <div class="muted small" id="b-count" aria-live="polite"></div>
          <div class="card" id="b-list" style="margin-top:8px"></div>`
        const list = app.querySelector("#b-list")
        const count = app.querySelector("#b-count")
        const texts = d.cards.map(cardText)

        function draw() {
          const q = norm(view.query.trim())
          let html = ""
          let shown = 0
          d.cards.forEach((c, i) => {
            const isWrong = wrong.has(cardKey(c))
            if (view.onlyWrong && !isWrong) return
            if (q && !texts[i].includes(q)) return
            shown++
            html += `<div class="qa"><div class="q"><span class="num">${i + 1}.</span>${marked(c.question, q)}${isWrong ? `<span class="chip bad">ошибка</span>` : ""}</div>`
            if (c.type === "multi") {
              html += `<ul class="qa-opts">${c.options
                .map(
                  (o) =>
                    `<li class="${o.correct ? "ok" : ""}">${o.correct ? '<span class="sr-only">Верно: </span>' : ""}${marked(o.text, q)}</li>`,
                )
                .join("")}</ul>`
            } else if (c.type === "order") {
              html += `<ol>${c.steps.map((t) => `<li>${marked(t, q)}</li>`).join("")}</ol>`
            } else {
              html += `<div class="answer">${marked(c.answer, q)}</div>`
            }
            if (c.latin) html += `<div class="latin">${marked(c.latin, q)}</div>`
            if (c.explanation)
              html += `<div class="explain small">${marked(c.explanation, q)}</div>`
            html += `</div>`
          })
          list.innerHTML = html || `<p class="muted" style="margin:0">Ничего не найдено.</p>`
          count.textContent =
            shown === d.cards.length ? "" : `Показано ${shown} из ${d.cards.length}`
        }
        draw()
        scrollToTop()

        app.querySelector("#back").onclick = () => renderList(null, id)
        app.querySelector("#b-start").onclick = () => startSession([id])
        const bm = app.querySelector("#b-mistakes")
        if (bm) bm.onclick = () => mistakesSession([id], d.title)
        app.querySelector("#b-search").oninput = (e) => {
          view.query = e.target.value
          draw()
        }
        const bw = app.querySelector("#b-wrong")
        if (bw)
          bw.onchange = (e) => {
            view.onlyWrong = e.target.checked
            draw()
          }
        focusFirst("#back")
      }

      // ─── Экран: вопрос ─────────────────────────────────────────────────
      function renderQuestion() {
        const s = session
        const q = s.questions[s.i]
        const card = q.card
        const n = s.questions.length
        let html = `<div class="top">
          <button class="ghost" id="quit" aria-label="Выйти к списку тестов">← Тесты</button>
          <span class="spacer"></span>
          <span class="counter">${s.i + 1} / ${n}</span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${s.i}"><i style="width:${(s.i / n) * 100}%"></i></div>
        <div class="muted small" style="margin-bottom:4px">${esc(s.title)}</div>
        <div class="question">${esc(card.question)}</div>`

        if (q.kind === "choice") {
          const correctCount = q.options.filter((o) => o.correct).length
          const multi = correctCount > 1
          html += `<div class="hint">${multi ? `Выберите все верные ответы (их ${correctCount})` : "Выберите один ответ"}</div><div class="options" role="group">`
          q.options.forEach((o, i) => {
            let cls = "opt" + (multi ? " multi" : "")
            const picked = s.picked.has(i)
            if (s.checked) {
              if (o.correct && picked) cls += " right"
              else if (!o.correct && picked) cls += " wrong"
              else if (o.correct) cls += " missed right"
            }
            html += `<button class="${cls}" data-opt="${i}" aria-pressed="${picked && !s.checked}" ${s.checked ? "disabled" : ""}>
              <span class="key">${LETTERS[i]}</span><span>${esc(o.text)}</span></button>`
          })
          html += `</div>`
        } else if (q.kind === "order") {
          html += `<div class="hint">Расставьте по порядку кнопками ↑ ↓</div><ol class="steps">`
          s.order.forEach((stepIdx, pos) => {
            const cls = s.checked ? (stepIdx === pos ? " right" : " wrong") : ""
            html += `<li class="step${cls}"><span class="n">${pos + 1}</span><span class="t">${esc(card.steps[stepIdx])}</span>
              ${
                s.checked
                  ? ""
                  : `<button data-up="${pos}" ${pos === 0 ? "disabled" : ""} aria-label="Выше">↑</button><button data-down="${pos}" ${pos === s.order.length - 1 ? "disabled" : ""} aria-label="Ниже">↓</button>`
              }</li>`
          })
          html += `</ol>`
        } else if (q.kind === "self") {
          html += `<div class="hint">Вспомните ответ, затем проверьте себя</div>`
        }

        // Итог по вопросу
        if (s.checked || s.revealed) {
          if (q.kind !== "self") {
            const ok = s.results[s.i].correct
            html += `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Верно" : "Неверно"}</div>`
            if (!ok && q.kind === "order")
              html += `<div class="answer">${card.steps.map((t, i) => `${i + 1}. ${esc(t)}`).join("\n")}</div>`
          } else {
            html += `<div class="answer">${esc(card.answer)}</div>`
          }
          if (card.latin) html += `<p class="latin">${esc(card.latin)}</p>`
          if (card.explanation) html += `<p class="explain">${esc(card.explanation)}</p>`
        }

        html += `<div class="row">`
        if (q.kind === "self") {
          if (!s.revealed) html += `<button class="primary" id="reveal">Показать ответ</button>`
          else if (!s.checked)
            html += `<button class="primary" data-self="1">Знал</button><button data-self="0">Не знал</button>`
          else html += nextButton()
        } else if (!s.checked) {
          const can = q.kind === "order" || s.picked.size > 0
          html += `<button class="primary" id="check" ${can ? "" : "disabled"}>Проверить</button>`
          html += `<button class="ghost" id="skip">Не знаю</button>`
        } else html += nextButton()
        html += `</div>`

        app.innerHTML = html
        bindQuestion()
      }

      const nextButton = () =>
        `<button class="primary" id="next">${session.i + 1 < session.questions.length ? "Дальше" : "Итоги"}</button>`

      // Защита от двойного нажатия: после смены вопроса или проверки на месте
      // «Дальше» оказывается «Не знаю» (и наоборот), и второй тап засчитывал
      // ответ сам — с подсветкой правильных. Короткое время нажатия игнорируем.
      const PRESS_LOCK_MS = 450
      let lockUntil = 0
      const lockPresses = () => (lockUntil = performance.now() + PRESS_LOCK_MS)
      const guard =
        (fn) =>
        (...args) => {
          if (performance.now() < lockUntil) return
          fn(...args)
        }

      function bindQuestion() {
        const s = session
        const q = s.questions[s.i]
        app.querySelector("#quit").onclick = () => {
          if (
            s.results.filter(Boolean).length &&
            !confirm("Выйти? Результат этого прохождения не сохранится.")
          )
            return
          renderList()
        }
        app.querySelectorAll("[data-opt]").forEach(
          (b) =>
            (b.onclick = guard(() => {
              const i = Number(b.dataset.opt)
              const multi = q.options.filter((o) => o.correct).length > 1
              if (multi) s.picked.has(i) ? s.picked.delete(i) : s.picked.add(i)
              else s.picked = new Set([i])
              renderQuestion()
              const again = app.querySelector(`[data-opt="${i}"]`)
              if (again) again.focus()
            })),
        )
        app
          .querySelectorAll("[data-up]")
          .forEach((b) => (b.onclick = () => move(Number(b.dataset.up), -1)))
        app
          .querySelectorAll("[data-down]")
          .forEach((b) => (b.onclick = () => move(Number(b.dataset.down), 1)))
        const on = (sel, fn) => {
          const el = app.querySelector(sel)
          if (el) el.onclick = guard(fn)
        }
        on("#check", () => check())
        on("#skip", () => {
          s.picked = new Set()
          check(true)
        })
        on("#reveal", () => {
          s.revealed = true
          lockPresses()
          renderQuestion()
          focusFirst("[data-self]")
        })
        app.querySelectorAll("[data-self]").forEach(
          (b) =>
            (b.onclick = guard(() => {
              s.results[s.i] = { correct: b.dataset.self === "1", picked: null }
              s.checked = true
              next()
            })),
        )
        on("#next", () => next())
      }

      function focusFirst(sel) {
        const el = app.querySelector(sel)
        if (el) el.focus({ preventScroll: true })
      }

      function move(pos, dir) {
        const o = session.order
        const to = pos + dir
        ;[o[pos], o[to]] = [o[to], o[pos]]
        renderQuestion()
        const btn =
          app.querySelector(dir < 0 ? `[data-up="${to}"]` : `[data-down="${to}"]`) ||
          app.querySelector(`[data-${dir < 0 ? "down" : "up"}="${to}"]`)
        if (btn) btn.focus()
      }

      function check(skipped) {
        const s = session
        const q = s.questions[s.i]
        let correct
        if (q.kind === "order")
          correct = skipped === true ? false : s.order.every((v, i) => v === i)
        else correct = q.options.every((o, i) => o.correct === s.picked.has(i)) && s.picked.size > 0
        s.results[s.i] = {
          correct,
          picked: q.kind === "order" ? [...s.order] : [...s.picked],
          skipped: skipped === true,
        }
        s.checked = true
        lockPresses()
        renderQuestion()
        focusFirst("#next")
      }

      function next() {
        const s = session
        if (s.i + 1 < s.questions.length) {
          s.i++
          resetQuestionState()
          lockPresses()
          renderQuestion()
          scrollToTop()
          focusFirst(".opt, #reveal, [data-down]")
        } else finish()
      }

      // ─── Экран: итоги ──────────────────────────────────────────────────
      function finish() {
        const s = session
        const total = s.questions.length
        const score = s.results.filter((r) => r && r.correct).length
        const duration = Date.now() - s.started

        // Статистика по колодам: последний результат, лучший процент и
        // карточки с ошибками — для «Только ошибки».
        for (const id of s.deckIds) {
          const idx = s.questions.map((q, i) => i).filter((i) => s.questions[i].deckId === id)
          if (!idx.length) continue
          const st = store.stats[id] || { attempts: 0, best: null, wrong: [] }
          const wrong = new Set(st.wrong)
          let deckScore = 0
          for (const i of idx) {
            const k = cardKey(s.questions[i].card)
            if (s.results[i] && s.results[i].correct) {
              deckScore++
              wrong.delete(k)
            } else wrong.add(k)
          }
          st.attempts++
          st.last = { score: deckScore, total: idx.length, at: Date.now() }
          // Лучший — по обычным прохождениям, не по «ошибкам».
          if (!s.mistakesMode) st.best = Math.max(st.best || 0, deckScore / idx.length)
          st.wrong = [...wrong]
          store.stats[id] = st
        }
        saveStore()

        const pct = Math.round((score / total) * 100)
        const mood =
          pct === 100
            ? "Без ошибок!"
            : pct >= 80
              ? "Хорошо"
              : pct >= 50
                ? "Есть что повторить"
                : "Стоит пройти ещё раз"
        let html = `<div class="top"><button class="ghost" id="back">← Тесты</button></div>
          <div class="card">
            <div class="muted small">${esc(s.title)}</div>
            <div class="score">${score} из ${total}</div>
            <p>${pct}% · ${mood} · ${fmtTime(duration)}</p>
            <div class="row">
              ${score < total ? `<button class="primary" id="redo-wrong">Пройти ошибки ещё раз</button>` : ""}
              <button ${score === total ? 'class="primary"' : ""} id="again">Пройти заново</button>
            </div>
          </div>`
        const mistakes = s.questions
          .map((q, i) => ({ q, r: s.results[i], i }))
          .filter((x) => !x.r || !x.r.correct)
        if (mistakes.length) {
          html += `<h2>Ошибки</h2><div class="card">`
          for (const { q, r, i } of mistakes) {
            const c = q.card
            html += `<div class="mistake"><div class="q">${i + 1}. ${esc(c.question)}</div>`
            if (q.kind === "choice") {
              const yours =
                r && r.picked && r.picked.length
                  ? r.picked.map((k) => q.options[k].text).join("; ")
                  : "нет ответа"
              html += `<div class="yours">Ваш ответ: ${esc(yours)}</div>`
              html += `<div class="correct">Верно: ${esc(
                q.options
                  .filter((o) => o.correct)
                  .map((o) => o.text)
                  .join("; "),
              )}</div>`
            } else if (q.kind === "order") {
              html += `<div class="correct">Верный порядок: ${esc(c.steps.join(" → "))}</div>`
            } else html += `<div class="correct">${esc(c.answer)}</div>`
            if (c.explanation) html += `<div class="explain small">${esc(c.explanation)}</div>`
            html += `</div>`
          }
          html += `</div>`
        }
        app.innerHTML = html
        lockPresses()
        scrollToTop()
        app.querySelector("#back").onclick = guard(() => renderList())
        app.querySelector("#again").onclick = guard(() =>
          startSession(s.deckIds, { title: s.title.replace(/ — ошибки$/, "") }),
        )
        const rw = app.querySelector("#redo-wrong")
        if (rw)
          rw.onclick = guard(() => {
            const keys = new Set(mistakes.map((m) => m.q.key))
            startSession(s.deckIds, {
              onlyKeys: keys,
              title: s.title.replace(/ — ошибки$/, "") + " — ошибки",
            })
          })
        focusFirst("#redo-wrong, #again")
      }

      // ─── Клавиатура: 1–8 / А–З — вариант, Enter — проверить/дальше ──────
      document.addEventListener("keydown", (e) => {
        if (!session || e.target.matches("input, textarea") || e.ctrlKey || e.metaKey || e.altKey)
          return
        const q = session.questions[session.i]
        if (!q) return
        if (q.kind === "choice" && !session.checked) {
          let i = "12345678".indexOf(e.key)
          if (i < 0) i = LETTERS.indexOf(e.key.toUpperCase())
          if (i >= 0 && i < q.options.length) {
            e.preventDefault()
            app.querySelector(`[data-opt="${i}"]`).click()
            return
          }
        }
        // Enter на выбранном варианте тоже проверяет ответ: после выбора фокус
        // остаётся на варианте, и иначе Enter просто выбирал бы его снова.
        const onOption = e.target instanceof Element && e.target.matches(".opt")
        if (e.key === "Enter" && (onOption || !(e.target instanceof HTMLButtonElement))) {
          const btn = app.querySelector("#next, #check:not([disabled]), #reveal")
          if (btn) {
            e.preventDefault()
            btn.click()
          }
        }
      })

      // ─── Старт ─────────────────────────────────────────────────────────
      fetch("decks.json")
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status)
          return r.json()
        })
        .then((data) => {
          builtIn = data.decks
          renderList()
        })
        .catch((err) => {
          builtIn = []
          renderList()
          app.insertAdjacentHTML(
            "afterbegin",
            `<p class="problems">Не удалось загрузить встроенные тесты (${esc(err.message)}). Свои колоды по-прежнему можно добавить.</p>`,
          )
        })
    </script>
  </body>
</html>
