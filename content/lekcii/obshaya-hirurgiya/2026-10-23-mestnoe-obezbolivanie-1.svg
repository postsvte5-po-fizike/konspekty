<text x="142" y="168.0" font-size="17" font-weight="800" fill="#6d5a43" class="halo">L1</text>
<text x="142" y="306.0" font-size="17" font-weight="800" fill="#6d5a43" class="halo">L2</text>
<text x="142" y="444.0" font-size="17" font-weight="800" fill="#6d5a43" class="halo">L3</text>
<text x="142" y="582.0" font-size="17" font-weight="800" fill="#6d5a43" class="halo">L4</text>
<text x="142" y="720.0" font-size="17" font-weight="800" fill="#6d5a43" class="halo">L5</text>
<path d="M40 91 L 310.0 217.0" stroke="#222" stroke-width="1.1"/><circle cx="310.0" cy="217.0" r="2.8" fill="#222" stroke="#fff" stroke-width="1"/>
<text x="44" y="96" font-size="13.5" font-weight="700" fill="#8a6a1a" text-anchor="start" class="halo">конус спинного мозга</text>
<text x="44" y="112" font-size="12.5" fill="#555" text-anchor="start" class="halo">оканчивается на уровне L1–L2</text>
<path d="M40 529 L 304.0 564.0" stroke="#222" stroke-width="1.1"/><circle cx="304.0" cy="564.0" r="2.8" fill="#222" stroke="#fff" stroke-width="1"/>
<text x="44" y="534" font-size="13.5" font-weight="700" fill="#8a6a1a" text-anchor="start" class="halo">конский хвост в ликворе</text>
<text x="44" y="550" font-size="12.5" fill="#555" text-anchor="start" class="halo">корешки отходят от иглы</text>
<path d="M40 727 L 180.0 782.0" stroke="#222" stroke-width="1.1"/><circle cx="180.0" cy="782.0" r="2.8" fill="#222" stroke="#fff" stroke-width="1"/>
<text x="44" y="732" font-size="13.5" font-weight="700" fill="#5a7a8a" text-anchor="start" class="halo">межпозвонковый диск</text>
<path d="M708 496 V 517" stroke="#1f1f1f" stroke-width="1.2"/>
<circle cx="708" cy="530" r="12" fill="#1f1f1f" stroke="#fff" stroke-width="2"/><text x="708" y="535" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<path d="M634 499 V 478" stroke="#1f1f1f" stroke-width="1.2"/>
<circle cx="634" cy="465" r="12" fill="#1f1f1f" stroke="#fff" stroke-width="2"/><text x="634" y="470" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<path d="M532 504 V 525" stroke="#1f1f1f" stroke-width="1.2"/>
<circle cx="532" cy="538" r="12" fill="#1f1f1f" stroke="#fff" stroke-width="2"/><text x="532" y="543" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<path d="M378 510 V 489" stroke="#1f1f1f" stroke-width="1.2"/>
<circle cx="378" cy="476" r="12" fill="#1f1f1f" stroke="#fff" stroke-width="2"/><text x="378" y="481" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<path d="M362 511 V 532" stroke="#1f1f1f" stroke-width="1.2"/>
<circle cx="362" cy="545" r="12" fill="#1f1f1f" stroke="#fff" stroke-width="2"/><text x="362" y="550" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<path d="M324.0 513 V 492" stroke="#1f1f1f" stroke-width="1.2"/>
<circle cx="324.0" cy="479" r="12" fill="#1f1f1f" stroke="#fff" stroke-width="2"/><text x="324.0" y="484" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="726" y="281.0" font-size="14" font-weight="800" fill="#1f4fa0" text-anchor="start">эпидуральная игла</text><text x="726" y="297.0" font-size="12.5" fill="#555">Туохи, L2–L3: изогнутый</text><text x="726" y="313.0" font-size="12.5" fill="#555">кончик — в эпидуральном</text><text x="726" y="329.0" font-size="12.5" fill="#555">пространстве</text>
<text x="726" y="557.0" font-size="14" font-weight="800" fill="#b3261e">спинальная игла</text><text x="726" y="573.0" font-size="12.5" fill="#555">тонкая, L3–L4:</text><text x="726" y="589.0" font-size="12.5" fill="#555">прокалывает дуру;</text><text x="726" y="605.0" font-size="12.5" fill="#555">из иглы — ликвор</text>
<path d="M40 265 L 284.0 130.0" stroke="#222" stroke-width="1.1"/><circle cx="284.0" cy="130.0" r="2.8" fill="#222" stroke="#fff" stroke-width="1"/>
<text x="44" y="270" font-size="13.5" font-weight="700" fill="#2f6db5" text-anchor="start" class="halo">дуральный мешок</text>
<text x="44" y="286" font-size="12.5" fill="#555" text-anchor="start" class="halo">(твёрдая оболочка) — до S2</text>
<text x="40" y="970" font-size="14.5" font-weight="700" fill="#222">Слои по ходу иглы (сзади наперёд):</text>
<text x="40" y="994" font-size="13.5" fill="#222"><tspan font-weight="800">1</tspan> — кожа и подкожная клетчатка</text>
<text x="40" y="1015" font-size="13.5" fill="#222"><tspan font-weight="800">2</tspan> — надостистая связка</text>
<text x="40" y="1036" font-size="13.5" fill="#222"><tspan font-weight="800">3</tspan> — межостистая связка</text>
<text x="480" y="994" font-size="13.5" fill="#222"><tspan font-weight="800">4</tspan> — жёлтая связка — «провал», потеря сопротивления</text>
<text x="480" y="1015" font-size="13.5" fill="#222"><tspan font-weight="800">5</tspan> — эпидуральное пространство: жир, венозное сплетение</text>
<text x="480" y="1036" font-size="13.5" fill="#222"><tspan font-weight="800">6</tspan> — твёрдая и паутинная оболочки → ликвор</text>
<text x="40" y="1070" font-size="13" fill="#555">Пункцию делают ниже L2, чтобы не ранить спинной мозг: в мешке ниже конуса — только корешки конского хвоста.</text>
<text x="40" y="1088" font-size="13" fill="#555">Субарахноидальное пространство (6) — для спинномозговой анестезии; эпидуральное (5) — для эпидуральной.</text>
<text x="480" y="1114" font-size="11.5" fill="#999" text-anchor="middle">Пропорции позвонков — по Gray’s Anatomy, fig. 301 (общественное достояние). Сверить: атлас Неттера — поясничный отдел.</text>
</svg>