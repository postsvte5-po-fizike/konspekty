<path d="M600 532 L 600 584 M 650 534 L 650 582 M 700 528 L 700 586" stroke="#b8b8b8" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M150 568 L 330 572 L 330 654 L 150 658 Z" fill="#efeae0" stroke="#7a7a7a" stroke-width="2" filter="url(#pencil)"/>
<text x="240.0" y="618.0" font-size="16" fill="#777" text-anchor="middle" font-weight="bold" font-style="normal">L5</text>
<path d="M560 586 C 640 580, 720 596, 760 620 C 730 646, 640 650, 560 646 Z" fill="#efeae0" stroke="#7a7a7a" stroke-width="2" filter="url(#pencil)"/>
