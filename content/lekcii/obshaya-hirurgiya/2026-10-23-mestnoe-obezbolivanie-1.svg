<text x="240.0" y="502.0" font-size="16" fill="#777" text-anchor="middle" font-weight="bold" font-style="normal">L4</text>
<path d="M152 544 L 328 544 L 328 566 L 152 566 Z" fill="#dfe8ef" stroke="#9aa" stroke-width="1.2"/>
<path d="M560 470 C 640 464, 720 480, 760 504 C 730 530, 640 534, 560 530 Z" fill="#efeae0" stroke="#7a7a7a" stroke-width="2" filter="url(#pencil)"/>
