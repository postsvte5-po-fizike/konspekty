<text x="480" y="34" font-size="22" font-weight="700" fill="#1f1f1f" text-anchor="middle">Куда попадает игла при спинномозговой и эпидуральной анестезии</text>
<text x="480" y="58" font-size="14.5" fill="#666" text-anchor="middle">срединный сагиттальный разрез; спина больного — справа, голова — вверху; схема, не в масштабе</text>
