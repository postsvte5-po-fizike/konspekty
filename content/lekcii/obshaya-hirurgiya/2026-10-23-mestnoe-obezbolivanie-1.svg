 <path d="M0 0 L10 5 L0 10 z" fill="#2f8a4a"/>
</marker>
</defs>
<rect width="960" height="830" fill="#ffffff"/>
<text x="480.0" y="30.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold" font-style="normal">Поясничный отдел: куда попадает игла при спинномозговой и эпидуральной анестезии</text>
<text x="480.0" y="52.0" font-size="13.5" fill="#555" text-anchor="middle" font-weight="normal" font-style="italic">сагиттальный разрез, спина больного — справа; схема, не в масштабе</text>
