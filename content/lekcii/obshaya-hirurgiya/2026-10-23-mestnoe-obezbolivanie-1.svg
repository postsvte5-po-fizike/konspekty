<text x="441.0" y="240.0" font-size="12" fill="#8a7a4a" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">конус</text>
<text x="441.0" y="254.0" font-size="11.5" fill="#8a7a4a" text-anchor="middle" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">спинного мозга</text>
<text x="441.0" y="268.0" font-size="11.5" fill="#8a7a4a" text-anchor="middle" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(L1–L2)</text>
<text x="441.0" y="544.0" font-size="12" fill="#8a7a4a" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">конский хвост</text>
<text x="441.0" y="560.0" font-size="11.5" fill="#4a6fa5" text-anchor="middle" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">в ликворе</text>
<path d="M800 94 C 812 254, 806 484, 816 694" stroke="#a07a6a" stroke-width="3" fill="none"/>
<path d="M800 94 C 790 254, 784 484, 792 694" stroke="#e8c8a8" stroke-width="18" fill="none" opacity="0.6"/>
<line x1="900" y1="437.0" x2="470" y2="443.0" stroke="#2c4f9e" stroke-width="2.4"/>
<rect x="890" y="427.0" width="34" height="20" rx="3" fill="#2c4f9e" opacity="0.8"/>
<text x="880.0" y="421.0" font-size="12.5" fill="#2c4f9e" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">спинальная игла (тонкая)</text>
<circle cx="470" cy="443.0" r="4" fill="#2c4f9e"/>
<line x1="900" y1="319.0" x2="540" y2="327.0" stroke="#b0262d" stroke-width="4.2"/>
<path d="M540 327.0 q -6 2 -4 8" fill="none" stroke="#b0262d" stroke-width="3"/>
<rect x="890" y="307.0" width="38" height="22" rx="3" fill="#b0262d" opacity="0.8"/>
<path d="M538 333.0 C 534 367.0, 538 407.0, 536 447.0" fill="none" stroke="#c46a12" stroke-width="2" stroke-dasharray="5 3"/>
<text x="880.0" y="303.0" font-size="12.5" fill="#b0262d" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">эпидуральная игла (Туохи)</text>
<text x="240.0" y="90.0" font-size="12" fill="#777" text-anchor="middle" font-weight="bold" font-style="normal">тела позвонков и диски</text>
<text x="441.0" y="90.0" font-size="12" fill="#4a6fa5" text-anchor="middle" font-weight="bold" font-style="normal">дуральный мешок</text>
<text x="806.0" y="90.0" font-size="12" fill="#a07a6a" text-anchor="middle" font-weight="bold" font-style="normal">кожа</text>
<circle cx="806.0" cy="285.0" r="11" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="806.0" y="289.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<circle cx="676.0" cy="295.0" r="11" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="676.0" y="299.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<circle cx="562.0" cy="287.0" r="11" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="562.0" y="291.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<circle cx="537.0" cy="333.0" r="11" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="537.0" y="337.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<circle cx="512.0" cy="367.0" r="11" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="512.0" y="371.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<circle cx="486.0" cy="305.0" r="11" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="486.0" y="309.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<text x="40.0" y="730.0" font-size="12.8" text-anchor="start"><tspan fill="#222" font-weight="bold">Путь иглы: </tspan><tspan fill="#333" font-weight="normal">1 кожа и подкожная клетчатка → 2 надостистая и межостистая связки → 3 жёлтая связка (за ней —</tspan></text>
<text x="40.0" y="752.0" font-size="12.8" text-anchor="start"><tspan fill="#222" font-weight="normal"></tspan><tspan fill="#333" font-weight="normal">«потеря сопротивления») → 4 </tspan><tspan fill="#c46a12" font-weight="bold">эпидуральное пространство</tspan><tspan fill="#333" font-weight="normal"> → 5 твёрдая и паутинная оболочки → 6 </tspan><tspan fill="#2c4f9e" font-weight="bold">субарахноидальное (ликвор)</tspan></text>
<text x="40.0" y="774.0" font-size="12.8" text-anchor="start"><tspan fill="#2c4f9e" font-weight="bold">Спинномозговая: </tspan><tspan fill="#333" font-weight="normal">малая доза анестетика в ликвор ниже конца спинного мозга (L2–L3 и ниже); блок быстрый и глубокий</tspan></text>
<text x="40.0" y="796.0" font-size="12.8" text-anchor="start"><tspan fill="#b0262d" font-weight="bold">Эпидуральная: </tspan><tspan fill="#333" font-weight="normal">большой объём кнаружи от твёрдой оболочки; блок медленнее; через катетер — продлённое обезболивание</tspan></text>
<text x="40.0" y="818.0" font-size="12.8" text-anchor="start"><tspan fill="#222" font-weight="bold">Общее осложнение — гипотензия: </tspan><tspan fill="#333" font-weight="normal">блок симпатических волокон → сосуды расширены; лечат инфузией и вазопрессорами</tspan></text>
</svg>
