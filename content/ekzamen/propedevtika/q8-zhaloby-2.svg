<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 753 376" font-family="Arial, Helvetica, sans-serif">
<rect width="753" height="376" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs>
<text x="377" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">Боль в груди: плевра, стенка или сердце</text>
<line x1="376.6" y1="88.0" x2="376.6" y2="132.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="376.6" y1="170.0" x2="309.6" y2="214.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="376.6" y1="170.0" x2="443.6" y2="214.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="309.6" y1="252.0" x2="117.8" y2="296.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="309.6" y1="252.0" x2="371.5" y2="296.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="443.6" y1="252.0" x2="630.3" y2="296.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<rect x="274.7" y="52.0" width="204.0" height="36.0" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="376.6" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">Боль в грудной клетке</text>
<rect x="250.1" y="134.0" width="253.1" height="36.0" rx="9" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="376.6" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3a00">Зависит от дыхания и кашля?</text>
<rect x="254.6" y="216.0" width="110.0" height="36.0" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="309.6" y="239.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#154d22">Да</text>
<rect x="388.6" y="216.0" width="110.0" height="36.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="443.6" y="239.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">Нет</text>
<rect x="24.0" y="298.0" width="187.6" height="54.0" rx="9" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="117.8" y="321.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#321b7a">Одна точка, хруст →</text>
<text x="117.8" y="339.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#321b7a">перелом рёбра</text>
<rect x="235.6" y="298.0" width="271.7" height="54.0" rx="9" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/>
<text x="371.5" y="321.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d6b">Колющая «в боку», легче</text>
<text x="371.5" y="339.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#0b3d6b">лёжа на больном боку → плеврит</text>
<rect x="531.3" y="298.0" width="198.0" height="54.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="630.3" y="321.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">Давящая за грудиной,</text>
<text x="630.3" y="339.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#7a1010">при нагрузке → сердце</text>
</svg>