<text x="451.1" y="441.0" font-size="12.5" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3–4 см</text>
<text x="568.2" y="441.0" font-size="12.5" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8–9 см</text>
<text x="525.3" y="468.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">поперечник 11–13 см</text>
<text x="480.0" y="142.0" font-size="12.5" fill="#7b3fa0" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5–6 см</text>
<circle cx="422.1" cy="290.6" r="12" fill="#b0262d" stroke="#fff" stroke-width="1.5"/><text x="422.1" y="295.2" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<circle cx="628.5" cy="367.0" r="12" fill="#b0262d" stroke="#fff" stroke-width="1.5"/><text x="628.5" y="371.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<circle cx="541.0" cy="230.5" r="12" fill="#b0262d" stroke="#fff" stroke-width="1.5"/><text x="541.0" y="235.1" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<circle cx="521.4" cy="287.0" r="12" fill="#6d1016" stroke="#fff" stroke-width="1.5"/><text x="521.4" y="291.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<circle cx="603.8" cy="356.4" r="12" fill="#6d1016" stroke="#fff" stroke-width="1.5"/><text x="603.8" y="361.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<circle cx="556.9" cy="272.0" r="12" fill="#6d1016" stroke="#fff" stroke-width="1.5"/><text x="556.9" y="276.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<circle cx="434.2" cy="206.6" r="12" fill="#7b3fa0" stroke="#fff" stroke-width="1.5"/><text x="434.2" y="211.2" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">7</text>
<circle cx="525.8" cy="206.6" r="12" fill="#7b3fa0" stroke="#fff" stroke-width="1.5"/><text x="525.8" y="211.2" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">8</text>
<text x="314.8" y="237.6" font-size="11.5" fill="#777" text-anchor="start" font-weight="normal" font-style="italic">II м/р</text>
<text x="314.8" y="316.2" font-size="11.5" fill="#777" text-anchor="start" font-weight="normal" font-style="italic">IV м/р</text>
<text x="719.2" y="429.2" font-size="11.5" fill="#777" text-anchor="start" font-weight="normal" font-style="italic">V м/р</text>
<rect x="40" y="604" width="22" height="13" fill="#f3c6c9" stroke="#b0262d" stroke-width="1.6"/>
<text x="70.0" y="615.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">относительная тупость — истинные границы сердца (притупленный звук; перкуссия средней силы)</text>
<rect x="40" y="626" width="22" height="13" fill="url(#hatchAbs)" stroke="#b0262d" stroke-width="1.2"/>
<text x="70.0" y="637.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">абсолютная тупость — часть сердца, не прикрытая лёгкими (тупой звук; тихая перкуссия)</text>
<rect x="40" y="648" width="22" height="13" fill="url(#hatchVes)" stroke="#7b3fa0" stroke-width="1.2"/>
<text x="70.0" y="659.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">сосудистый пучок — аорта, верхняя полая вена, лёгочный ствол (тихая перкуссия во II м/р)</text>
<text x="40.0" y="688.0" font-size="13.2" text-anchor="start"><tspan fill="#b0262d" font-weight="bold">1</tspan><tspan fill="#222" font-weight="normal"> правая граница относительной тупости — IV межреберье, на 1 см кнаружи от правого края грудины (правое предсердие)</tspan></text>
<text x="40.0" y="710.0" font-size="13.2" text-anchor="start"><tspan fill="#b0262d" font-weight="bold">2</tspan><tspan fill="#222" font-weight="normal"> левая граница — V межреберье, на 1–2 см кнутри от левой срединно-ключичной линии, совпадает с верхушечным толчком (ЛЖ)</tspan></text>
<text x="40.0" y="732.0" font-size="13.2" text-anchor="start"><tspan fill="#b0262d" font-weight="bold">3</tspan><tspan fill="#222" font-weight="normal"> верхняя граница — III ребро, по линии на 1 см левее левого края грудины (ушко левого предсердия)</tspan></text>
<text x="40.0" y="754.0" font-size="13.2" text-anchor="start"><tspan fill="#6d1016" font-weight="bold">4</tspan><tspan fill="#222" font-weight="normal"> правая граница абсолютной тупости — левый край грудины</tspan></text>
<text x="40.0" y="776.0" font-size="13.2" text-anchor="start"><tspan fill="#6d1016" font-weight="bold">5</tspan><tspan fill="#222" font-weight="normal"> левая граница абсолютной тупости — на 1–2 см кнутри от левой границы относительной</tspan></text>
<text x="40.0" y="798.0" font-size="13.2" text-anchor="start"><tspan fill="#6d1016" font-weight="bold">6</tspan><tspan fill="#222" font-weight="normal"> верхняя граница абсолютной тупости — IV ребро</tspan></text>
<text x="40.0" y="820.0" font-size="13.2" text-anchor="start"><tspan fill="#7b3fa0" font-weight="bold">7–8</tspan><tspan fill="#222" font-weight="normal"> сосудистый пучок — II межреберье справа и слева, по краям грудины; поперечник 5–6 см</tspan></text>
<text x="40.0" y="850.0" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" font-style="italic">Стрелки — направление перкуссии: от ясного лёгочного звука к тупому; отметку ставят по краю пальца, обращённому к ясному звуку.</text>
<text x="40.0" y="870.0" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" font-style="italic">Нижнюю границу сердца перкуторно не определяют (пунктир): тупость сердца сливается с тупостью печени.</text>
</svg>
