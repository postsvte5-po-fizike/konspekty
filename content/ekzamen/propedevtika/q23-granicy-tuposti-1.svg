<text x="306.8" y="578.0" font-size="12.5" fill="#2c4f9e" text-anchor="middle" font-weight="normal" font-style="normal">правая срединно-ключичная</text>
<text x="653.2" y="578.0" font-size="12.5" fill="#2c4f9e" text-anchor="middle" font-weight="normal" font-style="normal">левая срединно-ключичная</text>
<text x="480.0" y="486.0" font-size="12" fill="#777" text-anchor="middle" font-weight="normal" font-style="italic">передняя срединная</text>
<line x1="541.0" y1="150" x2="541.0" y2="216.5" stroke="#555" stroke-width="1.2" stroke-dasharray="2 4"/>
<line x1="312.8" y1="290.6" x2="407.1" y2="290.6" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<line x1="715.2" y1="373.0" x2="643.5" y2="368.0" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
