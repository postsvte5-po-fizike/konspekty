<rect x="301.6" y="52.0" width="204.0" height="36.0" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="403.6" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">Увеличенный лимфоузел</text>
<rect x="24.0" y="134.0" width="171.2" height="54.0" rx="9" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<text x="109.6" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2305">Болезненный, кожа</text>
<text x="109.6" y="175.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#6e2305">над ним красная</text>
<rect x="219.2" y="134.0" width="228.6" height="54.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="333.5" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">Плотный, безболезненный,</text>
<text x="333.5" y="175.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#7a1010">спаян, неровный</text>
<rect x="471.8" y="134.0" width="113.9" height="54.0" rx="9" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="528.7" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#321b7a">Со свищами</text>
<text x="528.7" y="175.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#321b7a">и рубцами</text>
<rect x="609.7" y="134.0" width="173.4" height="54.0" rx="9" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/>
<text x="696.4" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d6b">Много групп,</text>
<text x="696.4" y="175.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#0b3d6b">спаяны между собой</text>
<rect x="67.9" y="243.0" width="113.9" height="36.0" rx="9" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<text x="124.9" y="266.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2305">Воспаление</text>
<rect x="205.8" y="234.0" width="206.2" height="54.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="308.9" y="257.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">Метастаз</text>
<text x="308.9" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#7a1010">(Вирхов — рак желудка)</text>
<rect x="436.0" y="243.0" width="113.9" height="36.0" rx="9" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="493.0" y="266.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#321b7a">Туберкулёз</text>
