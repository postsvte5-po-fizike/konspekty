<text x="656.5" y="257.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d6b">Лимфолейкоз,</text>
<text x="656.5" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#0b3d6b">лимфогранулематоз</text>
