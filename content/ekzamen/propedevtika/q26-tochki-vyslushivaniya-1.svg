<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" font-family="Georgia, 'Times New Roman', serif">
<title>Проекции клапанов и точки выслушивания сердца</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="soft" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="9" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="hatchAbs" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
 <rect width="7" height="7" fill="#e7a3a6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#b0262d" stroke-width="2.2"/>
</pattern>
<pattern id="hatchVes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
 <rect width="7" height="7" fill="#e6d9f0"/><line x1="0" y1="0" x2="0" y2="7" stroke="#7b3fa0" stroke-width="1.6"/>
</pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
</marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M0 0 L10 5 L0 10 z" fill="#2c4f9e"/>
</marker>

</defs>
<rect width="960" height="840" fill="#ffffff"/>
<text x="480.0" y="30.0" font-size="21" fill="#222" text-anchor="middle" font-weight="bold" font-style="normal">Проекции клапанов и точки выслушивания сердца</text>
<text x="480.0" y="52.0" font-size="13.5" fill="#555" text-anchor="middle" font-weight="normal" font-style="italic">буквы — где клапан лежит на самом деле; цифры — где его лучше слышно (и порядок выслушивания)</text>
