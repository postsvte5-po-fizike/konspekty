</g>
<polygon points="530.0,110.0 526.0,150.0 529.0,185.0 524.5,230.0 521.8,280.0 519.0,330.0 516.7,372.0 495.0,386.0 489.0,432.0 480.0,440.0 480.0,440.0 471.0,432.0 465.0,386.0 443.3,372.0 441.0,330.0 438.2,280.0 435.5,230.0 431.0,185.0 434.0,150.0 430.0,110.0" fill="#efefef" stroke="#7a7a7a" stroke-width="2" stroke-linejoin="round" filter="url(#pencil)"/>
<line x1="432.0" y1="185" x2="528.0" y2="185" stroke="#7a7a7a" stroke-width="1.6" filter="url(#pencil)"/>
<line x1="465.0" y1="384" x2="495.0" y2="384" stroke="#7a7a7a" stroke-width="1.4" filter="url(#pencil)"/>
<text x="301.3" y="157.3" font-size="12" fill="#777" text-anchor="end" font-weight="normal" font-style="italic">I</text>
<text x="232.8" y="237.2" font-size="12" fill="#777" text-anchor="end" font-weight="normal" font-style="italic">II</text>
<text x="218.8" y="291.9" font-size="12" fill="#777" text-anchor="end" font-weight="normal" font-style="italic">III</text>
<text x="214.0" y="341.5" font-size="12" fill="#777" text-anchor="end" font-weight="normal" font-style="italic">IV</text>
<text x="216.7" y="389.8" font-size="12" fill="#777" text-anchor="end" font-weight="normal" font-style="italic">V</text>
<text x="236.4" y="441.2" font-size="12" fill="#777" text-anchor="end" font-weight="normal" font-style="italic">VI</text>
<text x="273.2" y="484.6" font-size="12" fill="#777" text-anchor="end" font-weight="normal" font-style="italic">VII</text>
<path d="M525.8 206.6 C 529.8 218.6, 533.0 224.5, 541.0 230.5 C 593.0 236.5, 636.5 289.0, 628.5 367.0 C 630.5 379.0, 624.5 389.1, 624.5 395.1 L 443.0 336.0 C 420.1 318.0, 420.1 306.6, 422.1 290.6 C 424.1 274.6, 427.9 261.0, 429.9 249.0 C 432.9 237.0, 433.2 216.6, 434.2 206.6 Z" fill="#f6d3d5" fill-opacity="0.45" stroke="#b0262d" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#soft)"/>
<text x="662.5" y="333.0" font-size="12" fill="#b0262d" text-anchor="start" font-weight="normal" font-style="italic" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">контур сердца</text>
<line x1="546.8" y1="241.2" x2="623.1" y2="354.6" stroke="#c0262d" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<line x1="469.7" y1="226.9" x2="435.2" y2="213.5" stroke="#7b3fa0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<line x1="482.0" y1="276.0" x2="480.3" y2="377.0" stroke="#2f8a4a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<line x1="490.2" y1="233.3" x2="522.6" y2="246.7" stroke="#c46a12" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<ellipse cx="540.6" cy="233.7" rx="10" ry="6.5" fill="#ffffff" stroke="#c0262d" stroke-width="2"/>
<ellipse cx="480.0" cy="230.0" rx="10" ry="6.5" fill="#ffffff" stroke="#7b3fa0" stroke-width="2"/>
<ellipse cx="539.9" cy="208.5" rx="10" ry="6.5" fill="#ffffff" stroke="#2c4f9e" stroke-width="2"/>
<ellipse cx="482.1" cy="267.0" rx="10" ry="6.5" fill="#ffffff" stroke="#2f8a4a" stroke-width="2"/>
<text x="556.6" y="238.7" font-size="15" fill="#c0262d" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">А</text>
<text x="465.0" y="221.0" font-size="15" fill="#7b3fa0" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Б</text>
<text x="545.9" y="196.5" font-size="15" fill="#2c4f9e" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">В</text>
<text x="465.1" y="273.0" font-size="15" fill="#2f8a4a" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Г</text>
<circle cx="631.5" cy="367.0" r="13" fill="#c0262d" stroke="#fff" stroke-width="1.5"/><text x="631.5" y="371.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<circle cx="421.1" cy="208.4" r="13" fill="#7b3fa0" stroke="#fff" stroke-width="1.5"/><text x="421.1" y="213.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<circle cx="555.9" cy="212.4" r="13" fill="#2c4f9e" stroke="#fff" stroke-width="1.5"/><text x="555.9" y="217.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<circle cx="480.0" cy="392.0" r="13" fill="#2f8a4a" stroke="#fff" stroke-width="1.5"/><text x="480.0" y="396.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<circle cx="536.5" cy="252.2" r="13" fill="#c46a12" stroke="#fff" stroke-width="1.5"/><text x="536.5" y="256.8" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<g stroke-width="1.4" stroke-dasharray="7 5" fill="none"><line x1="653.2" y1="102" x2="653.2" y2="560" stroke="#2c4f9e"/></g>
<text x="653.2" y="578.0" font-size="12.5" fill="#2c4f9e" text-anchor="middle" font-weight="normal" font-style="normal">левая срединно-ключичная</text>
<text x="314.8" y="237.6" font-size="11.5" fill="#777" text-anchor="start" font-weight="normal" font-style="italic">II м/р</text>
<text x="719.2" y="429.2" font-size="11.5" fill="#777" text-anchor="start" font-weight="normal" font-style="italic">V м/р</text>
<text x="40.0" y="618.0" font-size="14" text-anchor="start"><tspan fill="#c0262d" font-weight="bold">1</tspan><tspan fill="#222" font-weight="normal"> верхушка (верхушечный толчок, V м/р) — </tspan><tspan fill="#c0262d" font-weight="bold">митральный клапан (А)</tspan></text>
<text x="40.0" y="642.0" font-size="14" text-anchor="start"><tspan fill="#7b3fa0" font-weight="bold">2</tspan><tspan fill="#222" font-weight="normal"> II межреберье справа у края грудины — </tspan><tspan fill="#7b3fa0" font-weight="bold">клапан аорты (Б)</tspan></text>
<text x="40.0" y="666.0" font-size="14" text-anchor="start"><tspan fill="#2c4f9e" font-weight="bold">3</tspan><tspan fill="#222" font-weight="normal"> II межреберье слева у края грудины — </tspan><tspan fill="#2c4f9e" font-weight="bold">клапан лёгочного ствола (В)</tspan><tspan fill="#222" font-weight="normal">: здесь он и лежит</tspan></text>
<text x="40.0" y="690.0" font-size="14" text-anchor="start"><tspan fill="#2f8a4a" font-weight="bold">4</tspan><tspan fill="#222" font-weight="normal"> основание мечевидного отростка — </tspan><tspan fill="#2f8a4a" font-weight="bold">трёхстворчатый клапан (Г)</tspan></text>
<text x="40.0" y="714.0" font-size="14" text-anchor="start"><tspan fill="#c46a12" font-weight="bold">5</tspan><tspan fill="#222" font-weight="normal"> точка Боткина — Эрба: слева от грудины у прикрепления III–IV рёбер — </tspan><tspan fill="#c46a12" font-weight="bold">снова аорта (Б)</tspan></text>
<text x="40.0" y="748.0" font-size="12.8" fill="#555" text-anchor="start" font-weight="normal" font-style="italic">Клапаны лежат тесно (А–Г почти рядом), поэтому слушают не над ними, а там, куда звук проводится по току крови</text>
<text x="40.0" y="768.0" font-size="12.8" fill="#555" text-anchor="start" font-weight="normal" font-style="italic">и где камера ближе всего к стенке. Порядок 1 → 5 — по убывающей частоте поражения клапанов.</text>
<text x="40.0" y="794.0" font-size="12.8" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">Проекции: А — слева от грудины у III ребра; Б — середина грудины на уровне хрящей III рёбер;</text>
<text x="40.0" y="814.0" font-size="12.8" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">В — II м/р слева от грудины; Г — на грудине посередине между хрящом III ребра слева и V ребра справа.</text>
</svg>
