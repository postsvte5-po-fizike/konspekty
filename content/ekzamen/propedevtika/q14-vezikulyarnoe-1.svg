<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1071 394" font-family="Arial, Helvetica, sans-serif">
<rect width="1071" height="394" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs>
<text x="536" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">Изменения везикулярного дыхания</text>
<line x1="535.7" y1="88.0" x2="535.7" y2="132.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="535.7" y1="170.0" x2="397.1" y2="214.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="535.7" y1="170.0" x2="602.7" y2="214.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="397.1" y1="252.0" x2="143.5" y2="305.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="397.1" y1="252.0" x2="388.9" y2="305.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="602.7" y1="252.0" x2="654.9" y2="296.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="602.7" y1="252.0" x2="933.1" y2="305.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<rect x="400.9" y="52.0" width="269.5" height="36.0" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="535.7" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">Везикулярное дыхание изменено</text>
<rect x="409.1" y="134.0" width="253.1" height="36.0" rx="9" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="535.7" y="157.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3a00">Симметрично с обеих сторон?</text>
<rect x="342.1" y="216.0" width="110.0" height="36.0" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="397.1" y="239.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#154d22">Да</text>
<rect x="476.1" y="216.0" width="253.1" height="36.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="602.7" y="239.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">Нет, очагово / одна сторона</text>
<rect x="24.0" y="307.0" width="238.9" height="54.0" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="143.5" y="330.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#154d22">Физиологическое</text>
<text x="143.5" y="348.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#154d22">толщина стенки, пуэрильное</text>
<rect x="286.9" y="307.0" width="204.0" height="54.0" rx="9" fill="#e6fcf5" stroke="#0c8599" stroke-width="2"/>
<text x="388.9" y="330.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#084c56">или диффузный процесс</text>
<text x="388.9" y="348.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#084c56">эмфизема, бронхит</text>
<rect x="514.9" y="298.0" width="279.9" height="72.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="654.9" y="321.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">Ослаблено / нет:</text>
<text x="654.9" y="339.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#7a1010">выпот, пневмоторакс, ателектаз,</text>
<text x="654.9" y="357.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#7a1010">начало пневмонии</text>
<rect x="818.8" y="307.0" width="228.6" height="54.0" rx="9" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<text x="933.1" y="330.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2305">Саккадированное локально</text>
<text x="933.1" y="348.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#6e2305">туберкулёз верхушки</text>
</svg>