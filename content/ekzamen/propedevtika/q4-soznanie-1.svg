<text x="279.5" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3a00">Ступор</text>
<text x="279.5" y="93.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#6b3a00">оглушение, отвечает</text>
<text x="279.5" y="111.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#6b3a00">с опозданием</text>
<rect x="394.3" y="52.0" width="238.9" height="72.0" rx="9" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<text x="513.7" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2305">Сопор</text>
<text x="513.7" y="93.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#6e2305">спячка, будится ненадолго,</text>
<text x="513.7" y="111.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#6e2305">рефлексы есть</text>
