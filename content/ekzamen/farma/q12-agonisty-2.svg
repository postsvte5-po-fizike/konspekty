<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 312" font-family="Arial, Helvetica, sans-serif">
<rect width="715" height="312" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs>
<text x="358" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">Как классифицировать лиганд</text>
