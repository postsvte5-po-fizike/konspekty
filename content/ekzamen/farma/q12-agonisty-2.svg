<line x1="357.7" y1="188.0" x2="94.3" y2="232.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="357.7" y1="188.0" x2="271.3" y2="232.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="357.7" y1="188.0" x2="432.9" y2="232.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="357.7" y1="188.0" x2="601.6" y2="232.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<rect x="227.0" y="52.0" width="261.3" height="54.0" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="357.7" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">Лиганд связался с рецептором</text>
<text x="357.7" y="93.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#212529">(аффинитет есть у всех)</text>
<rect x="251.6" y="152.0" width="212.2" height="36.0" rx="9" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="357.7" y="175.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3a00">Внутренняя активность?</text>
<rect x="24.0" y="234.0" width="140.7" height="54.0" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="94.3" y="257.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#154d22">α = 1</text>
<text x="94.3" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#154d22">полный агонист</text>
<rect x="188.7" y="234.0" width="165.2" height="54.0" rx="9" fill="#e6fcf5" stroke="#0c8599" stroke-width="2"/>
<text x="271.3" y="257.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#084c56">0 &lt; α &lt; 1</text>
<text x="271.3" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#084c56">частичный агонист</text>
<rect x="377.9" y="234.0" width="110.0" height="54.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="432.9" y="257.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">α = 0</text>
<text x="432.9" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#7a1010">антагонист</text>
<rect x="511.9" y="234.0" width="179.4" height="54.0" rx="9" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="601.6" y="257.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#321b7a">разная на подтипах</text>
<text x="601.6" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#321b7a">агонист-антагонист</text>
</svg>