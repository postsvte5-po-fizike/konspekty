<path d="M410 520 C 440 500, 520 500, 550 520 C 556 548, 520 566, 480 556 C 440 566, 402 548, 410 520 Z" fill="#f6e0d6" stroke="#9a6a5a" stroke-width="1.5" filter="url(#soft)"/>
<path d="M430 530 Q 455 516, 480 532 T 530 530" fill="none" stroke="#9a6a5a" stroke-width="1.2"/>
<ellipse cx="368" cy="540" rx="10" ry="22" fill="#fbf0c8" stroke="#b09a3a" stroke-width="1.3"/>
<path d="M442 640 C 440 606, 520 606, 518 640 C 510 660, 450 660, 442 640 Z" fill="#fdf3c4" stroke="#a08a2a" stroke-width="1.5"/>
<path d="M472 660 L 472 676 L 488 676 L 488 660" fill="none" stroke="#a08a2a" stroke-width="2.4"/>
<path d="M454 690 C 450 676, 510 676, 506 690 C 498 712, 462 712, 454 690 Z" fill="#f4d3e0" stroke="#a04a6a" stroke-width="1.4"/>
<path d="M604 330 C 630 400, 636 470, 630 540" fill="none" stroke="#b0262d" stroke-width="3" stroke-linecap="round"/>
<path d="M356 330 C 330 400, 324 470, 330 540" fill="none" stroke="#b0262d" stroke-width="3" stroke-linecap="round"/>
<line x1="462.0" y1="140.0" x2="308.0" y2="146.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="462.0" cy="140.0" r="2.6" fill="#555"/>
<text x="40.0" y="150.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Глаз (α₁)</text>
<text x="40.0" y="166.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">радиальная мышца → мидриаз;</text>
<text x="40.0" y="182.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ВГД ↓ (секреция влаги ↓ — α₂)</text>
<line x1="477.0" y1="160.0" x2="308.0" y2="228.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="477.0" cy="160.0" r="2.6" fill="#555"/>
<text x="40.0" y="232.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Слизистая носа (α₁, α₂)</text>
<text x="40.0" y="248.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">сосуды сужены → отёк, секреция ↓</text>
<line x1="420.0" y1="320.0" x2="308.0" y2="312.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="420.0" cy="320.0" r="2.6" fill="#555"/>
<text x="40.0" y="316.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Бронхи (β₂)</text>
<text x="40.0" y="332.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">гладкие мышцы расслаблены;</text>
<text x="40.0" y="348.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">тучные клетки — выброс медиаторов ↓</text>
<line x1="410.0" y1="418.0" x2="308.0" y2="410.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="410.0" cy="418.0" r="2.6" fill="#555"/>
<text x="40.0" y="414.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Печень (β₂, α₁)</text>
<text x="40.0" y="430.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">гликогенолиз, глюконеогенез →</text>
<text x="40.0" y="446.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">гипергликемия</text>
<line x1="368.0" y1="540.0" x2="308.0" y2="494.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="368.0" cy="540.0" r="2.6" fill="#555"/>
<text x="40.0" y="498.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Жир (β₃, β₁)</text>
<text x="40.0" y="514.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">липолиз → свободные жирные</text>
<text x="40.0" y="530.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">кислоты ↑; термогенез</text>
<line x1="330.0" y1="470.0" x2="308.0" y2="580.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="330.0" cy="470.0" r="2.6" fill="#555"/>
<text x="40.0" y="584.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Сосуды скелетных мышц (β₂)</text>
<text x="40.0" y="600.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">расширение → ОПСС и ДАД ↓;</text>
<text x="40.0" y="616.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">мышцы: тремор; K⁺ уходит в клетки</text>
<line x1="454.0" y1="648.0" x2="308.0" y2="672.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="454.0" cy="648.0" r="2.6" fill="#555"/>
<text x="40.0" y="676.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Мочевой пузырь</text>
<text x="40.0" y="692.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">детрузор расслаблен (β₂, β₃);</text>
<text x="40.0" y="708.0" font-size="12.2" fill="#444" text-anchor="start" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">сфинктер сокращён (α₁) → задержка мочи</text>
<line x1="514.0" y1="180.0" x2="658.0" y2="146.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="514.0" cy="180.0" r="2.6" fill="#555"/>
<text x="920.0" y="150.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Слюнные железы (α₁, β)</text>
<text x="920.0" y="166.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">густая вязкая слюна;</text>
<text x="920.0" y="182.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">клонидин (α₂ в ЦНС) — сухость во рту</text>
<line x1="510.0" y1="336.0" x2="658.0" y2="232.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="510.0" cy="336.0" r="2.6" fill="#555"/>
<text x="920.0" y="236.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Сердце (β₁, β₂)</text>
<text x="920.0" y="252.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ЧСС ↑, сила ↑, АВ-проведение ↑,</text>
<text x="920.0" y="268.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">автоматизм ↑ → аритмии; O₂ ↑</text>
<line x1="630.0" y1="400.0" x2="658.0" y2="318.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="630.0" cy="400.0" r="2.6" fill="#555"/>
<text x="920.0" y="322.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Сосуды кожи, слизистых, почек,</text>
<text x="920.0" y="338.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">органов брюшной полости (α₁)</text>
<text x="920.0" y="354.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">сужение → ОПСС ↑, АД ↑</text>
<line x1="540.0" y1="462.0" x2="658.0" y2="404.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="540.0" cy="462.0" r="2.6" fill="#555"/>
<text x="920.0" y="408.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Поджелудочная железа</text>
<text x="920.0" y="424.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">секреция инсулина ↓ (α₂)</text>
<line x1="584.0" y1="494.0" x2="658.0" y2="470.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="584.0" cy="494.0" r="2.6" fill="#555"/>
<text x="920.0" y="474.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Почки (β₁)</text>
<text x="920.0" y="490.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">секреция ренина ↑; дофамин (D₁) —</text>
<text x="920.0" y="506.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">почечные сосуды расширены</text>
<line x1="540.0" y1="540.0" x2="658.0" y2="544.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="540.0" cy="540.0" r="2.6" fill="#555"/>
<text x="920.0" y="548.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ЖКТ (α₂, β₂; сфинктеры — α₁)</text>
<text x="920.0" y="564.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">тонус и моторика ↓, сфинктеры</text>
<text x="920.0" y="580.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">сокращены</text>
<line x1="502.0" y1="694.0" x2="658.0" y2="626.0" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="502.0" cy="694.0" r="2.6" fill="#555"/>
<text x="920.0" y="630.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Матка (β₂ — расслабление,</text>
<text x="920.0" y="646.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">α₁ — сокращение)</text>
<text x="920.0" y="662.0" font-size="12.2" fill="#444" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">β₂-агонисты — токолиз</text>
<rect x="40" y="782" width="880" height="150" rx="8" fill="#f7f7f7" stroke="#ddd"/>
<text x="56.0" y="804.0" font-size="12.6" text-anchor="start"><tspan fill="#222" font-weight="bold">ЦНС: </tspan><tspan fill="#333" font-weight="normal">α₂ (ствол мозга) — симпатический тонус ↓, седация, анальгезия (клонидин); адреналин — беспокойство, тремор (слабо, плохо проходит ГЭБ)</tspan></text>
<text x="56.0" y="826.0" font-size="12.6" text-anchor="start"><tspan fill="#222" font-weight="bold">Тромбоциты: </tspan><tspan fill="#333" font-weight="normal">α₂ — агрегация ↑; β₂ — агрегация ↓ (цАМФ ↑)</tspan></text>
<text x="56.0" y="848.0" font-size="12.6" text-anchor="start"><tspan fill="#222" font-weight="bold">Обмен: </tspan><tspan fill="#333" font-weight="normal">гликогенолиз и липолиз (цАМФ → ПКА) → глюкоза, лактат, свободные жирные кислоты ↑; K⁺ уходит в клетки (β₂)</tspan></text>
<text x="56.0" y="870.0" font-size="12.6" text-anchor="start"><tspan fill="#222" font-weight="bold">Кожа: </tspan><tspan fill="#333" font-weight="normal">α₁ — сужение сосудов (бледность), сокращение мышц, поднимающих волос («гусиная кожа»)</tspan></text>
<text x="56.0" y="892.0" font-size="12.6" text-anchor="start"><tspan fill="#222" font-weight="bold">Селезёнка: </tspan><tspan fill="#333" font-weight="normal">α — сокращение капсулы, выброс эритроцитов в кровь</tspan></text>
<text x="56.0" y="914.0" font-size="12.6" text-anchor="start"><tspan fill="#b0262d" font-weight="bold">Правило: </tspan><tspan fill="#333" font-weight="normal">α₁ — сокращает гладкие мышцы (Ca²⁺ ↑), β₂ — расслабляет (цАМФ ↑), β₁ — подстёгивает сердце, α₂ — тормозит выброс</tspan></text>
</svg>
