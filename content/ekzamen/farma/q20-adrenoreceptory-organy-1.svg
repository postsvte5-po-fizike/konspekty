<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" font-family="Georgia, 'Times New Roman', serif">
<title>Адренорецепторы в организме</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="soft" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="9" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
</marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M0 0 L10 5 L0 10 z" fill="#b0262d"/>
</marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M0 0 L10 5 L0 10 z" fill="#2c4f9e"/>
</marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M0 0 L10 5 L0 10 z" fill="#2f8a4a"/>
</marker>
</defs>
<rect width="960" height="980" fill="#ffffff"/>
<text x="480.0" y="30.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold" font-style="normal">Адренорецепторы в организме: какой рецептор — какой эффект</text>
<text x="480.0" y="52.0" font-size="13.5" fill="#555" text-anchor="middle" font-weight="normal" font-style="italic">стимуляция адреномиметиком; в скобках — главный рецептор; схема, не в масштабе</text>
<path d="M480 92 C 522 92, 532 128, 526 160 C 522 180, 510 192, 506 204 L 510 222 C 572 232, 598 250, 602 300 L 608 520 C 610 600, 596 650, 576 700 L 550 760 L 410 760 L 384 700 C 364 650, 350 600, 352 520 L 358 300 C 362 250, 388 232, 450 222 L 454 204 C 450 192, 438 180, 434 160 C 428 128, 438 92, 480 92 Z" fill="#fbfaf7" stroke="#777" stroke-width="2" filter="url(#pencil)"/>
<ellipse cx="462" cy="140" rx="11" ry="6.5" fill="#fff" stroke="#555" stroke-width="1.4"/><circle cx="462" cy="140" r="4" fill="#4a6fa5"/>
<ellipse cx="498" cy="140" rx="11" ry="6.5" fill="#fff" stroke="#555" stroke-width="1.4"/><circle cx="498" cy="140" r="4" fill="#4a6fa5"/>
