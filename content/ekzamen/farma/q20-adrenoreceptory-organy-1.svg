<path d="M498 250 C 550 252, 576 300, 572 370 C 550 382, 514 372, 502 330 Z" fill="#eaf1f7" stroke="#4a6fa5" stroke-width="1.5" filter="url(#soft)"/>
<path d="M480 230 L 480 262 M 480 262 L 450 292 M 480 262 L 510 292" stroke="#4a6fa5" stroke-width="5" stroke-linecap="round" fill="none"/>
<path d="M486 318 C 502 296, 532 304, 526 334 C 522 356, 502 370, 488 384 C 474 368, 454 352, 456 332 C 458 306, 476 302, 486 318 Z" fill="#f2c4c6" stroke="#b0262d" stroke-width="1.8" filter="url(#soft)"/>
