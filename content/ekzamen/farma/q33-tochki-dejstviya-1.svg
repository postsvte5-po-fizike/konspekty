<circle cx="862" cy="396" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="862.0" y="401.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<line x1="40" y1="622" x2="960" y2="622" stroke="#ddd"/>
<circle cx="56" cy="640" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="56.0" y="645.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="78.0" y="645.0" font-size="13.5" font-weight="700" fill="#222" text-anchor="start">VMAT везикул — резерпин:</text>
<text x="78.0" y="663.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">НА не попадает в везикулы, разрушается МАО → запасы НА ↓ (и серотонина, дофамина в ЦНС)</text>
<circle cx="56" cy="678" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="56.0" y="683.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="78.0" y="683.0" font-size="13.5" font-weight="700" fill="#222" text-anchor="start">Захват I и везикулы — гуанетидин (октадин):</text>
<text x="78.0" y="701.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">входит через NET, вытесняет НА из везикул, нарушает выброс; в мозг не проникает</text>
<circle cx="56" cy="716" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="56.0" y="721.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="78.0" y="721.0" font-size="13.5" font-weight="700" fill="#222" text-anchor="start">Пресинаптические α₂ — фентоламин и др. неселективные α-блокаторы:</text>
<text x="78.0" y="739.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">тормоз выброса снят → НА ↑ → тахикардия</text>
<circle cx="56" cy="754" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="56.0" y="759.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="78.0" y="759.0" font-size="13.5" font-weight="700" fill="#222" text-anchor="start">Пресинаптические β₂ — неселективные β-блокаторы:</text>
<text x="78.0" y="777.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">выброс НА ↓ (один из механизмов снижения давления)</text>
<circle cx="56" cy="792" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="56.0" y="797.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="78.0" y="797.0" font-size="13.5" font-weight="700" fill="#222" text-anchor="start">Постсинаптические α₁ — празозин, доксазозин, тамсулозин (α₁A), фентоламин:</text>
<text x="78.0" y="815.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">сосуды расширяются, тонус простаты ↓</text>
<circle cx="56" cy="830" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="56.0" y="835.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="78.0" y="835.0" font-size="13.5" font-weight="700" fill="#222" text-anchor="start">Постсинаптические β₁ — метопролол, бисопролол, атенолол, небиволол; пропранолол:</text>
<text x="78.0" y="853.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">ЧСС, сила, проводимость ↓; ренин ↓</text>
<circle cx="56" cy="868" r="12.5" fill="#5b3fa0" stroke="#fff" stroke-width="2"/>
<text x="56.0" y="873.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="78.0" y="873.0" font-size="13.5" font-weight="700" fill="#222" text-anchor="start">Внесинаптические β₂ — пропранолол, тимолол (неселективные):</text>
