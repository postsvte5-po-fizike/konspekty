<path d="M904 318 L 900 404" stroke="#7b2cbf" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ak)"/>
<text x="866.0" y="450.0" font-size="11.5" font-weight="500" fill="#777" text-anchor="middle" font-style="italic">внесинаптические</text>
<text x="445.0" y="450.0" font-size="11.5" font-weight="500" fill="#777" text-anchor="middle" font-style="italic">постсинаптические</text>
<text x="150.0" y="480.0" font-size="12.5" font-weight="700" fill="#b23a2e" text-anchor="start">α₁ → Gq → фосфолипаза C → ИФ₃</text>
<text x="150.0" y="498.0" font-size="12.5" font-weight="500" fill="#b23a2e" text-anchor="start">→ Ca²⁺ ↑ → сокращение</text>
<text x="150.0" y="516.0" font-size="12.5" font-weight="500" fill="#b23a2e" text-anchor="start">гладкой мышцы сосуда</text>
<text x="470.0" y="480.0" font-size="12.5" font-weight="700" fill="#2a6db0" text-anchor="start">β₁ → Gs → аденилатциклаза → цАМФ ↑</text>
<text x="470.0" y="498.0" font-size="12.5" font-weight="500" fill="#2a6db0" text-anchor="start">→ ПКА → Ca²⁺ ↑: ЧСС, сила, проводимость ↑;</text>
<text x="470.0" y="516.0" font-size="12.5" font-weight="500" fill="#2a6db0" text-anchor="start">в ЮГА — выброс ренина ↑</text>
<text x="760.0" y="480.0" font-size="12.5" font-weight="700" fill="#17807f" text-anchor="start">β₂ → Gs → цАМФ ↑ →</text>
<text x="760.0" y="498.0" font-size="12.5" font-weight="500" fill="#17807f" text-anchor="start">расслабление бронхов, сосудов</text>
<text x="760.0" y="516.0" font-size="12.5" font-weight="500" fill="#17807f" text-anchor="start">мышц; гликогенолиз</text>
