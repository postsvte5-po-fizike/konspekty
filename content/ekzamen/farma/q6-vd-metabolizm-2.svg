<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 230" font-family="Arial, Helvetica, sans-serif">
<rect width="846" height="230" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs>
<text x="423" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">Кажущийся объём распределения</text>
<line x1="151.7" y1="106.0" x2="422.8" y2="150.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="418.7" y1="106.0" x2="422.8" y2="150.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<line x1="689.8" y1="106.0" x2="422.8" y2="150.0" stroke="#343a40" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24.0" y="52.0" width="255.3" height="54.0" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="2"/>
<text x="151.7" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1010">Малый Vd ≈ 3–5 л</text>
<text x="151.7" y="93.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#7a1010">в сосудах: гепарин, варфарин</text>
<rect x="303.3" y="52.0" width="230.8" height="54.0" rx="9" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="418.7" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3a00">Vd ≈ 12–40 л</text>
<text x="418.7" y="93.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#6b3a00">внеклеточная / общая вода</text>
<rect x="558.1" y="52.0" width="263.5" height="54.0" rx="9" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/>
<text x="689.8" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d6b">Большой Vd — сотни литров</text>
<text x="689.8" y="93.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#0b3d6b">в тканях: дигоксин, амиодарон</text>
<rect x="275.8" y="152.0" width="294.1" height="54.0" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="422.8" y="175.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">Vd = D / C₀ — не реальный объём,</text>
<text x="422.8" y="193.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#212529">а «куда ушло» ЛВ</text>
</svg>