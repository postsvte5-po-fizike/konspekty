<text x="600" y="274" font-size="13" font-weight="700" fill="#222" text-anchor="middle">эпителиоидная клетка</text>
<text x="600" y="291" font-size="12" fill="#555" text-anchor="middle">похожа на эпителий; ядро светлое,</text>
<text x="600" y="306" font-size="12" fill="#555" text-anchor="middle">вытянутое; фагоцитоз слабый</text>
