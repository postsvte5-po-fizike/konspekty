<text x="360" y="291" font-size="12" fill="#555" text-anchor="middle">фагоцитоз; фагосомы</text>
<text x="360" y="306" font-size="12" fill="#555" text-anchor="middle">с микробами (зелёные)</text>
<ellipse cx="600.0" cy="212.0" rx="62.0" ry="27.0" transform="rotate(-8.0 600.0 212.0)" fill="#f0bccb" stroke="#d48ea5" stroke-width="1.2"/>
