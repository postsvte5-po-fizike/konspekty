<text x="250" y="533" font-size="15" font-weight="700" fill="#222" text-anchor="middle">Клетка Пирогова — Лангханса</text>
<text x="250" y="553" font-size="13" fill="#444" text-anchor="middle">ядра преимущественно по периферии — подковой</text>
<text x="250" y="571" font-size="13" fill="#444" text-anchor="middle">типична для туберкулёза (иммунная гранулёма)</text>
<text x="710" y="533" font-size="15" font-weight="700" fill="#222" text-anchor="middle">Клетка инородных тел</text>
<text x="710" y="553" font-size="13" fill="#444" text-anchor="middle">ядра равномерно по всей цитоплазме</text>
<text x="710" y="571" font-size="13" fill="#444" text-anchor="middle">вокруг шовного материала, талька, кристаллов</text>
<text x="480.0" y="628" font-size="11.5" fill="#999" text-anchor="middle">Своя схема, не в масштабе.</text>
</svg>
