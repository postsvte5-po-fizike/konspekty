<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
<title>Морфогенез гранулёмы: от моноцита к гигантской клетке</title>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap'); text { font-family: Onest, 'PT Sans', 'Helvetica Neue', Arial, sans-serif; } .halo { paint-order: stroke; stroke: #fff; stroke-width: 4.5px; stroke-linejoin: round; }</style><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
<rect width="960" height="640" fill="#fff"/>
<text x="480.0" y="32" font-size="22" font-weight="700" fill="#1f1f1f" text-anchor="middle">Морфогенез гранулёмы: четыре стадии</text>
<text x="480.0" y="55" font-size="14" fill="#666" text-anchor="middle">клетки моноцитарно-макрофагального ряда созревают и трансформируются в очаге; схема, не в масштабе</text>
<rect x="6" y="78" width="228" height="236" rx="14" fill="#e8eef9"/>
<text x="120" y="104" font-size="15" font-weight="700" fill="#222" text-anchor="middle">1. Накопление</text>
<text x="120" y="123" font-size="12" fill="#555" text-anchor="middle">юных моноцитарных</text>
<text x="120" y="139" font-size="12" font-weight="600" fill="#555" text-anchor="middle">фагоцитов в очаге</text>
<rect x="246" y="78" width="228" height="236" rx="14" fill="#eaf4ec"/>
<text x="360" y="104" font-size="15" font-weight="700" fill="#222" text-anchor="middle">2. Созревание</text>
<text x="360" y="123" font-size="12" fill="#555" text-anchor="middle">в макрофаги:</text>
<text x="360" y="139" font-size="12" font-weight="600" fill="#555" text-anchor="middle">макрофагальная гранулёма</text>
<rect x="486" y="78" width="228" height="236" rx="14" fill="#fbeef2"/>
<text x="600" y="104" font-size="15" font-weight="700" fill="#222" text-anchor="middle">3. Трансформация</text>
<text x="600" y="123" font-size="12" fill="#555" text-anchor="middle">в эпителиоидные клетки:</text>
<text x="600" y="139" font-size="12" font-weight="600" fill="#555" text-anchor="middle">эпителиоидноклеточная гранулёма</text>
<rect x="726" y="78" width="228" height="236" rx="14" fill="#f6efe2"/>
<text x="840" y="104" font-size="15" font-weight="700" fill="#222" text-anchor="middle">4. Гигантские клетки</text>
<text x="840" y="123" font-size="12" fill="#555" text-anchor="middle">из эпителиоидных клеток:</text>
<text x="840" y="139" font-size="12" font-weight="600" fill="#555" text-anchor="middle">гигантоклеточная гранулёма</text>
<circle cx="120.0" cy="212.0" r="34.0" fill="#d7d3ea" stroke="#a59cc9" stroke-width="1.2"/>
<path d="M100 206 C 98 186, 134 182, 140 202 C 144 214, 130 218, 122 210 C 114 204, 110 216, 112 226 C 102 230, 98 218, 100 206 Z" fill="#5d469a"/>
<text x="120" y="274" font-size="13" font-weight="700" fill="#222" text-anchor="middle">моноцит</text>
<text x="120" y="291" font-size="12" fill="#555" text-anchor="middle">приходит из крови;</text>
<text x="120" y="306" font-size="12" fill="#555" text-anchor="middle">ядро бобовидное</text>
