<text x="700.0" y="324.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<circle cx="890" cy="338" r="10" fill="#5d4a8c"/>
<text x="890.0" y="342.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">7</text>
<text x="30.0" y="460.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">1 — нейтрофил выходит из осевого тока; 2 — краевое расположение у стенки; 3 — краевое стояние: прилипание к эндотелию;</text>
<text x="30.0" y="481.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">4 — межэндотелиальная эмиграция: псевдоподии проникают между эндотелиоцитами; 5 — прохождение базальной мембраны</text>
<text x="30.0" y="502.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">(тиксотропия: гель мембраны переходит в золь); 6 — движение к очагу по хемотаксическим медиаторам; 7 — фагоцитоз.</text>
<text x="30.0" y="523.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Лейкодиапедез — выход лейкоцитов, эритродиапедез — выход эритроцитов. Эмиграция идёт главным образом в посткапиллярах и венулах.</text>
<text x="30.0" y="560.0" font-size="12" fill="#666" text-anchor="start" font-weight="normal" font-style="normal">Схема, не в масштабе, для перерисовки. Сверить: Струков А.И., Серов В.В., 2015, гл. 5, рис. 5-4.</text>
</svg>
