<text x="330.0" y="212.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<circle cx="420" cy="218" r="10" fill="#5d4a8c"/>
<text x="420.0" y="222.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<circle cx="548" cy="230" r="10" fill="#5d4a8c"/>
<text x="548.0" y="234.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<circle cx="652" cy="290" r="10" fill="#5d4a8c"/>
<text x="652.0" y="294.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
