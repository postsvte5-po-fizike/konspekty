<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" font-family="Georgia, 'Times New Roman', serif">
<title>Поперечный срез правого колена на уровне суставной щели: опасные структуры при шве мениска</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="cart" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
 <rect width="7" height="7" fill="#f3f6fa"/><line x1="0" y1="0" x2="0" y2="7" stroke="#c5ccd6" stroke-width="0.7"/></pattern>
<pattern id="men" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
 <rect width="5" height="5" fill="#eef0f2"/><line x1="0" y1="0" x2="0" y2="5" stroke="#9aa1aa" stroke-width="0.6"/></pattern>
<pattern id="mus" width="6" height="6" patternUnits="userSpaceOnUse">
 <rect width="6" height="6" fill="#f7e6e3"/><line x1="0" y1="3" x2="6" y2="3" stroke="#e0b9b2" stroke-width="0.7"/></pattern>
</defs>
<rect width="1000" height="850" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#333">Срез правого колена на уровне суставной щели: где опасно при шве мениска</text>
<text x="24" y="56" font-size="14" fill="#666">вид сверху (дистальный отрезок); спереди — вверху, медиально — слева</text>

<g filter="url(#pencil)">
 <!-- кожа -->
 <path d="M200 330 C 190 170, 360 95, 500 98 C 650 95, 815 170, 805 330 C 800 470, 720 600, 500 610 C 290 600, 205 470, 200 330 Z" fill="#fffaf3" stroke="#9a8f80" stroke-width="2"/>
 <!-- плато с менисками -->
 <path d="M262 300 C 255 205, 380 150, 485 168 L 515 168 C 625 150, 745 205, 738 300 C 732 380, 660 432, 560 430 L 440 430 C 340 432, 268 380, 262 300 Z" fill="url(#cart)" stroke="#6d6d6d" stroke-width="2"/>
 <path d="M462 195 C 360 180, 285 230, 285 300 C 285 375, 360 415, 465 405 L 468 375 C 385 383, 320 350, 320 300 C 320 248, 380 222, 465 228 Z" fill="url(#men)" stroke="#555" stroke-width="1.6"/>
 <path d="M540 236 C 575 190, 700 190, 715 290 C 728 372, 640 412, 552 382 L 565 352 C 625 372, 685 345, 683 295 C 680 238, 620 222, 575 262 Z" fill="url(#men)" stroke="#555" stroke-width="1.6"/>
 <!-- связка надколенника -->
 <rect x="465" y="104" width="70" height="34" rx="8" fill="#ece6d8" stroke="#8d8d8d"/>
 <!-- МКС и ЛКС -->
 <path d="M258 250 C 248 290, 250 330, 262 370" fill="none" stroke="#8d7a55" stroke-width="9" stroke-linecap="round"/>
 <ellipse cx="770" cy="345" rx="11" ry="16" fill="#ece6d8" stroke="#8d7a55" stroke-width="2"/>
 <!-- сухожилие подколенной мышцы -->
 <ellipse cx="708" cy="410" rx="12" ry="9" fill="#ece6d8" stroke="#8d7a55" stroke-width="1.5"/>
 <!-- задняя капсула -->
 <path d="M300 405 C 360 440, 440 448, 500 446 C 560 448, 650 440, 712 425" fill="none" stroke="#7b4fa0" stroke-width="2.4"/>
 <!-- головки икроножной мышцы -->
 <ellipse cx="395" cy="497" rx="62" ry="38" fill="url(#mus)" stroke="#a0665d" stroke-width="1.6"/>
 <ellipse cx="630" cy="492" rx="52" ry="34" fill="url(#mus)" stroke="#a0665d" stroke-width="1.6"/>
 <!-- полуперепончатая и гусиная лапка -->
 <circle cx="318" cy="455" r="17" fill="#ece6d8" stroke="#8d7a55" stroke-width="1.5"/>
 <circle cx="270" cy="430" r="10" fill="#ece6d8" stroke="#8d7a55" stroke-width="1.3"/>
 <circle cx="262" cy="458" r="9" fill="#ece6d8" stroke="#8d7a55" stroke-width="1.3"/>
 <circle cx="288" cy="485" r="9" fill="#ece6d8" stroke="#8d7a55" stroke-width="1.3"/>
 <!-- двуглавая мышца -->
 <ellipse cx="752" cy="455" rx="20" ry="16" fill="#ece6d8" stroke="#8d7a55" stroke-width="1.6"/>
 <!-- сосудисто-нервный пучок: НЕВА -->
 <circle cx="492" cy="462" r="12" fill="#e74c3c" stroke="#9b1c11" stroke-width="1.5"/>
 <circle cx="512" cy="488" r="13" fill="#5b8bd6" stroke="#244f99" stroke-width="1.5"/>
 <circle cx="534" cy="516" r="10" fill="#f4d03f" stroke="#a5870c" stroke-width="1.5"/>
 <!-- общий малоберцовый нерв -->
 <circle cx="726" cy="474" r="9" fill="#f4d03f" stroke="#a5870c" stroke-width="1.5"/>
 <!-- n. saphenus и v. saphena magna -->
 <circle cx="236" cy="440" r="7" fill="#f4d03f" stroke="#a5870c" stroke-width="1.3"/>
 <circle cx="228" cy="466" r="8" fill="#5b8bd6" stroke="#244f99" stroke-width="1.3"/>
 <!-- ретракторы-«ложки» для шва изнутри наружу -->
 <path d="M300 418 C 330 440, 360 452, 410 455" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
 <path d="M720 432 C 700 446, 670 455, 625 456" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
 <!-- разрезы -->
 <path d="M224 372 L 214 410" stroke="#2e7d32" stroke-width="3" stroke-dasharray="6 4"/>
 <path d="M790 392 L 798 430" stroke="#2e7d32" stroke-width="3" stroke-dasharray="6 4"/>
</g>
<!-- зона риска за задним рогом -->
<path d="M455 432 C 470 470, 545 470, 560 432" fill="#e74c3c" opacity=".14"/>

<!-- порталы -->
<g font-size="13" fill="#333">
 <circle cx="448" cy="128" r="6" fill="#333"/><text x="440" y="90" text-anchor="end">переднемедиальный портал</text>
 <line x1="446" y1="122" x2="430" y2="96" stroke="#555"/>
 <circle cx="552" cy="128" r="6" fill="#333"/><text x="560" y="90">переднелатеральный портал</text>
 <line x1="554" y1="122" x2="570" y2="96" stroke="#555"/>
</g>

<!-- номера -->
<g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
 <line x1="492" y1="462" x2="440" y2="650" stroke="#555"/><circle cx="436" cy="662" r="12" fill="#c0392b"/><text x="436" y="667">1</text>
 <line x1="512" y1="488" x2="490" y2="650" stroke="#555"/><circle cx="488" cy="662" r="12" fill="#2f5f98"/><text x="488" y="667">2</text>
 <line x1="534" y1="516" x2="540" y2="650" stroke="#555"/><circle cx="540" cy="662" r="12" fill="#a5870c"/><text x="540" y="667">3</text>
 <line x1="726" y1="474" x2="820" y2="560" stroke="#555"/><circle cx="830" cy="570" r="12" fill="#a5870c"/><text x="830" y="575">4</text>
 <line x1="236" y1="440" x2="160" y2="500" stroke="#555"/><circle cx="150" cy="508" r="12" fill="#a5870c"/><text x="150" y="513">5</text>
 <line x1="228" y1="466" x2="165" y2="560" stroke="#555"/><circle cx="156" cy="570" r="12" fill="#2f5f98"/><text x="156" y="575">6</text>
 <line x1="752" y1="455" x2="860" y2="450" stroke="#555"/><circle cx="872" cy="450" r="12" fill="#333"/><text x="872" y="455">7</text>
 <line x1="318" y1="455" x2="250" y2="610" stroke="#555"/><circle cx="246" cy="622" r="12" fill="#333"/><text x="246" y="627">8</text>
 <line x1="395" y1="510" x2="370" y2="610" stroke="#555"/><circle cx="366" cy="622" r="12" fill="#333"/><text x="366" y="627">9</text>
 <line x1="250" y1="300" x2="150" y2="300" stroke="#555"/><circle cx="138" cy="300" r="12" fill="#333"/><text x="138" y="305">10</text>
 <line x1="770" y1="345" x2="870" y2="330" stroke="#555"/><circle cx="882" cy="328" r="12" fill="#333"/><text x="882" y="333">11</text>
 <line x1="708" y1="410" x2="870" y2="395" stroke="#555"/><circle cx="882" cy="392" r="12" fill="#333"/><text x="882" y="397">12</text>
 <line x1="350" y1="445" x2="150" y2="440" stroke="#555"/><circle cx="138" cy="440" r="12" fill="#2e7d32"/><text x="138" y="445">13</text>
</g>

<g font-size="13" fill="#222">
<text x="24" y="708" xml:space="preserve">1 — a. poplitea: глубже и медиальнее всех, у капсулы</text>
<text x="24" y="726" xml:space="preserve">2 — v. poplitea</text>
<text x="24" y="744" xml:space="preserve">3 — n. tibialis («НЕВА»: нерв, вена, артерия —</text>
<text x="24" y="762" xml:space="preserve">     сзади наперёд и снаружи внутрь)</text>
<text x="24" y="780" xml:space="preserve">4 — n. fibularis communis у медиального края</text>
<text x="24" y="798" xml:space="preserve">     сухожилия двуглавой мышцы (7)</text>
<text x="24" y="816" xml:space="preserve">5 — n. saphenus; 6 — v. saphena magna</text>
<text x="520" y="708" xml:space="preserve">7 — сухожилие двуглавой мышцы бедра</text>
<text x="520" y="726" xml:space="preserve">8 — полуперепончатая мышца; рядом — гусиная лапка</text>
<text x="520" y="744" xml:space="preserve">9 — медиальная головка икроножной мышцы</text>
<text x="520" y="762" xml:space="preserve">10 — МКС (lig. collaterale tibiale); 11 — ЛКС</text>
<text x="520" y="780" xml:space="preserve">12 — сухожилие подколенной мышцы</text>
<text x="520" y="798" xml:space="preserve">13 — «ложка»-ретрактор между капсулой и икроножной</text>
<text x="520" y="816" xml:space="preserve">     (шов изнутри наружу); пунктир — разрезы</text>
</g>
<text x="24" y="842" font-size="12" fill="#666">Розовым — зона риска для игл за задним рогом. Схема, не в масштабе. Сверить: Николаев, с. 142–143, рис. 3.22; атлас Неттера — срез колена.</text>
</svg>
