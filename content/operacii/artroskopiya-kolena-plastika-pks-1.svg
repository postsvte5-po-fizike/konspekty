<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Правое колено спереди: кости, связки, гусиная лапка, подкожный нерв; порталы и разрез для забора сухожилий (схема)</title>
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dcc8"/><stop offset="0.45" stop-color="#f8f2e8"/><stop offset="1" stop-color="#e2d3bd"/>
    </linearGradient>
    <linearGradient id="muscle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8665a"/><stop offset="0.5" stop-color="#de8e80"/><stop offset="1" stop-color="#c8665a"/>
    </linearGradient>
    <linearGradient id="tendon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8e2d2"/><stop offset="0.5" stop-color="#fbf8f0"/><stop offset="1" stop-color="#e8e2d2"/>
    </linearGradient>
    <g id="portal"><circle r="12" fill="#0b7285" stroke="#ffffff" stroke-width="2.5"/></g>
  </defs>
  <rect width="1000" height="780" fill="#ffffff"/>

  <text x="300" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1e23">Правое колено, вид спереди (разгибание)</text>
  <text x="300" y="46" text-anchor="middle" font-size="12" fill="#6c717a">порталы ставят при сгибании ~90°; на схеме — их проекция</text>
  <text x="70" y="70" font-size="12" fill="#6c717a">← латерально</text>
  <text x="530" y="70" text-anchor="end" font-size="12" fill="#6c717a">медиально →</text>

  <!-- ===== КОСТИ ===== -->
  <!-- бедренная кость: диафиз → мыщелки -->
  <path d="M238 60 L238 228 C236 262 214 288 186 306 C160 322 146 346 150 372 C154 394 180 404 214 403
           C246 402 272 394 288 386 C296 383 304 383 312 386 C330 395 362 406 404 406
           C440 406 462 392 460 366 C458 338 440 316 414 300 C384 282 364 258 362 226 L362 60 Z"
        fill="url(#bone)" stroke="#8a7a64" stroke-width="2"/>
  <!-- надмыщелки -->
  <path d="M152 352 C146 336 150 322 160 314" fill="none" stroke="#8a7a64" stroke-width="1.5"/>
  <path d="M452 340 C462 330 462 318 456 310" fill="none" stroke="#8a7a64" stroke-width="1.5"/>
  <text x="44" y="324" font-size="10.5" fill="#7a6a54">epicondylus lat.</text><line x1="128" y1="321" x2="150" y2="336" stroke="#7a6a54" stroke-width="0.8"/>
  <text x="392" y="286" font-size="10.5" fill="#7a6a54">epicondylus med.</text>
  <!-- tuberculum adductorium -->
  <circle cx="440" cy="296" r="5" fill="#e2d3bd" stroke="#8a7a64"/>

  <!-- большеберцовая кость -->
  <path d="M146 414 C146 408 170 408 196 408 L408 408 C440 408 466 410 466 418
           C468 446 452 468 428 480 C408 492 398 520 396 566 L394 760 L246 760 L242 566
           C240 520 228 494 206 480 C178 464 144 444 146 414 Z"
        fill="url(#bone)" stroke="#8a7a64" stroke-width="2"/>
  <!-- бугорок Жерди и бугристость -->
  <path d="M196 452 C204 444 220 446 222 458 C222 468 208 472 198 466" fill="#efe4d2" stroke="#8a7a64" stroke-width="1.3"/>
  <text x="150" y="498" font-size="10.5" fill="#7a6a54">tuberculum Gerdy</text>
  <ellipse cx="302" cy="490" rx="30" ry="16" fill="#efe4d2" stroke="#8a7a64" stroke-width="1.5"/>

  <!-- малоберцовая кость -->
  <path d="M110 446 C108 430 126 422 142 428 C156 434 160 452 150 466 L146 476 C144 560 142 660 142 760 L120 760 C120 660 120 560 118 476 C110 468 110 456 110 446 Z"
        fill="url(#bone)" stroke="#8a7a64" stroke-width="2"/>
  <text x="40" y="470" font-size="10.5" fill="#7a6a54">caput fibulae</text>

  <!-- суставная щель -->
  <line x1="132" y1="406" x2="480" y2="406" stroke="#c92a2a" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="128" y="420" text-anchor="end" font-size="11" fill="#c92a2a">суставная</text><text x="128" y="433" text-anchor="end" font-size="11" fill="#c92a2a">щель</text>

  <!-- ===== МЯГКИЕ ТКАНИ ===== -->
  <!-- tractus iliotibialis -->
  <path d="M168 60 C170 160 176 260 186 340 C192 392 198 430 204 456 L222 456 C216 420 210 380 206 330 C200 250 196 150 196 60 Z"
        fill="#eef0f2" stroke="#9aa3ad" stroke-width="1.2" opacity="0.95"/>
  <text x="150" y="150" font-size="10.5" fill="#5f6b77" transform="rotate(-87 150 150)">tractus iliotibialis</text>

  <!-- m. vastus lateralis -->
  <path d="M200 60 C196 120 204 180 228 222 C244 246 260 256 272 258 L274 60 Z" fill="url(#muscle)" opacity="0.85" stroke="#a5493e"/>
  <!-- m. vastus medialis (косая часть ниже) -->
  <path d="M326 60 L326 252 C344 260 372 266 398 260 C430 250 444 220 440 180 C436 130 420 90 404 60 Z" fill="url(#muscle)" opacity="0.85" stroke="#a5493e"/>
  <text x="240" y="165" font-size="10" fill="#ffffff" transform="rotate(-82 240 165)">m. vastus lateralis</text>
  <text x="392" y="140" font-size="10" fill="#ffffff" transform="rotate(80 392 140)">m. vastus medialis</text>

  <!-- сухожилие четырёхглавой -->
  <path d="M272 60 L328 60 L332 214 L268 214 Z" fill="url(#tendon)" stroke="#b5ac96" stroke-width="1.2"/>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#6b624f" transform="rotate(-90 300 140)">tendo m. quadricipitis</text>

  <!-- поднадколенниковое жировое тело (Гоффа) — под связкой -->
  <path d="M236 372 C246 350 270 346 300 350 C330 346 356 350 366 372 C370 392 352 404 300 404 C250 404 232 392 236 372 Z"
        fill="#ffe9a8" stroke="#d9b24c" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.9"/>

  <!-- retinacula patellae -->
  <path d="M238 296 C214 318 196 352 194 398" fill="none" stroke="#c9bfa8" stroke-width="5" opacity="0.8"/>
  <path d="M362 296 C386 318 406 352 410 398" fill="none" stroke="#c9bfa8" stroke-width="5" opacity="0.8"/>

  <!-- надколенник -->
  <path d="M300 214 C338 214 360 238 358 270 C356 302 332 328 300 340 C268 328 244 302 242 270 C240 238 262 214 300 214 Z"
        fill="#ebe0cd" stroke="#6f6152" stroke-width="2.5"/>
  <path d="M300 228 C328 230 344 248 342 272 C340 294 322 314 300 324" fill="none" stroke="#d4c5ad" stroke-width="2"/>
  <text x="300" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d342a">patella</text>

  <!-- связка надколенника -->
  <path d="M280 340 C284 380 284 430 280 482 L324 482 C320 430 320 380 324 340 Z" fill="url(#tendon)" stroke="#b5ac96" stroke-width="1.4"/>
  <text x="302" y="420" text-anchor="middle" font-size="10" fill="#6b624f" transform="rotate(-90 302 420)">lig. patellae</text>

  <!-- коллатеральные связки -->
  <path d="M446 320 C452 360 456 420 450 540 L428 540 C432 440 430 370 426 324 Z" fill="#f3efe4" stroke="#a89f88" stroke-width="1.2" opacity="0.92"/>
  <text x="424" y="470" text-anchor="end" font-size="10" fill="#6b624f">lig. coll. tibiale →</text>
  <path d="M158 330 C150 370 140 410 134 432" fill="none" stroke="#a89f88" stroke-width="7" stroke-linecap="round"/>
  <path d="M158 330 C150 370 140 410 134 432" fill="none" stroke="#f3efe4" stroke-width="4" stroke-linecap="round"/>
  <text x="46" y="380" font-size="10.5" fill="#6b624f">lig. collaterale</text>
  <text x="46" y="393" font-size="10.5" fill="#6b624f">fibulare</text>

  <!-- гусиная лапка: sartorius, gracilis, semitendinosus -->
  <path d="M500 220 C496 320 482 420 450 480 C430 512 390 528 352 530" fill="none" stroke="#d58f80" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  <path d="M500 220 C496 320 482 420 450 480 C430 512 390 528 352 530" fill="none" stroke="#e9c7b8" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M520 260 C516 360 500 440 470 492 C448 524 400 538 356 540" fill="none" stroke="#efe9db" stroke-width="7" stroke-linecap="round"/>
  <path d="M520 260 C516 360 500 440 470 492 C448 524 400 538 356 540" fill="none" stroke="#b5ac96" stroke-width="1" stroke-linecap="round"/>
  <path d="M538 290 C532 380 516 452 488 502 C462 538 406 550 360 550" fill="none" stroke="#efe9db" stroke-width="7" stroke-linecap="round"/>
  <path d="M538 290 C532 380 516 452 488 502 C462 538 406 550 360 550" fill="none" stroke="#b5ac96" stroke-width="1" stroke-linecap="round"/>
  <text x="506" y="214" font-size="10" fill="#a5493e">m. sartorius</text>
  <text x="528" y="254" font-size="10" fill="#6b624f">m. gracilis</text>
  <text x="546" y="286" font-size="10" fill="#6b624f">m. semitendinosus</text>
  <text x="402" y="575" font-size="10.5" fill="#6b624f">pes anserinus</text>

  <!-- n. saphenus и r. infrapatellaris -->
  <path d="M488 120 C494 200 492 300 486 380 C482 470 478 600 474 760" fill="none" stroke="#d4a500" stroke-width="3.5"/>
  <path d="M488 352 C460 372 420 392 380 404 C350 414 320 424 296 430 C266 438 234 446 206 448" fill="none" stroke="#d4a500" stroke-width="2.6"/>
  <path d="M482 470 C450 500 420 520 392 530" fill="none" stroke="#d4a500" stroke-width="1.6" opacity="0.8"/>
  <text x="494" y="120" font-size="12" fill="#8a6d00">n. saphenus</text>
  <text x="372" y="446" font-size="11" fill="#8a6d00">r. infrapatellaris</text>

  <!-- разрез для забора сухожилий -->
  <path d="M340 494 L384 528" stroke="#c92a2a" stroke-width="5" stroke-linecap="round"/>

  <!-- порталы -->
  <use href="#portal" x="266" y="368"/><text x="266" y="373" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <use href="#portal" x="336" y="370"/><text x="336" y="375" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
  <use href="#portal" x="386" y="394"/><text x="386" y="399" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
  <circle cx="256" cy="206" r="12" fill="#868e96" stroke="#fff" stroke-width="2.5"/><text x="256" y="211" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
  <circle cx="362" cy="511" r="12" fill="#c92a2a" stroke="#fff" stroke-width="2.5"/><text x="362" y="516" text-anchor="middle" fill="#fff" font-weight="bold">5</text>

  <!-- ===== ЛЕГЕНДА ===== -->
  <g transform="translate(652 70)">
  <rect x="0" y="0" width="334" height="404" rx="10" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="16" y="28" font-size="15" font-weight="bold" fill="#1b1e23">Порталы и разрез</text>
  <circle cx="28" cy="54" r="10" fill="#0b7285"/><text x="28" y="58" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text>
  <text x="46" y="51" fill="#1b1e23">Переднелатеральный — оптика</text>
  <text x="46" y="67" font-size="11" fill="#6c717a">латеральнее lig. patellae, ниже полюса</text>
  <circle cx="28" cy="96" r="10" fill="#0b7285"/><text x="28" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text>
  <text x="46" y="93" fill="#1b1e23">Переднемедиальный — рабочий</text>
  <text x="46" y="109" font-size="11" fill="#6c717a">медиальнее lig. patellae</text>
  <circle cx="28" cy="138" r="10" fill="#0b7285"/><text x="28" y="142" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text>
  <text x="46" y="135" fill="#1b1e23">Добавочный медиальный</text>
  <text x="46" y="151" font-size="11" fill="#6c717a">над передним рогом мед. мениска,</text>
  <text x="46" y="165" font-size="11" fill="#6c717a">по игле — для бедренного канала</text>
  <circle cx="28" cy="192" r="10" fill="#868e96"/><text x="28" y="196" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">4</text>
  <text x="46" y="189" fill="#1b1e23">Верхнелатеральный (отток)</text>
  <text x="46" y="205" font-size="11" fill="#6c717a">по выбору; зона пункции (Николаев, рис. 3.63)</text>
  <circle cx="28" cy="234" r="10" fill="#c92a2a"/><text x="28" y="238" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">5</text>
  <text x="46" y="231" fill="#1b1e23">Разрез для забора сухожилий</text>
  <text x="46" y="247" font-size="11" fill="#6c717a">над гусиной лапкой, медиальнее бугристости</text>
  <rect x="16" y="268" width="24" height="12" fill="#ffe9a8" stroke="#d9b24c" stroke-dasharray="3 2"/>
  <text x="48" y="279" fill="#1b1e23">жировое тело Гоффа (за связкой)</text>
  <rect x="16" y="292" width="24" height="12" fill="#de8e80"/>
  <text x="48" y="303" fill="#1b1e23">мышцы</text>
  <rect x="16" y="316" width="24" height="12" fill="#f3efe4" stroke="#a89f88"/>
  <text x="48" y="327" fill="#1b1e23">сухожилия и связки</text>
  <line x1="16" y1="346" x2="40" y2="346" stroke="#d4a500" stroke-width="3.5"/>
  <text x="48" y="350" fill="#1b1e23">нервы</text>
  <text x="16" y="382" font-size="11" fill="#6c717a">Точное место порталов выбирает хирург.</text>
  </g>
  <g transform="translate(652 492)">
  <rect x="0" y="0" width="334" height="140" rx="10" fill="#fff5f5" stroke="#c92a2a"/>
  <text x="16" y="26" font-size="14" font-weight="bold" fill="#c92a2a">Опасная зона спереди</text>
  <text x="16" y="50" fill="#1b1e23">r. infrapatellaris n. sapheni идёт</text>
  <text x="16" y="68" fill="#1b1e23">от медиального края колена косо</text>
  <text x="16" y="86" fill="#1b1e23">вниз и латерально под надколенником.</text>
  <text x="16" y="104" fill="#1b1e23">Риск: разрез 5, стриппер, порталы 2–3.</text>
  <text x="16" y="126" font-size="11" fill="#6c717a">→ онемение кожи ниже и латеральнее разреза</text>
  </g>
</svg>
