<text x="30" y="636" font-size="12.5" fill="#222">5 — бедренный нерв — в мышечной лакуне</text>
<text x="30" y="655" font-size="12.5" fill="#222">6 — латеральный кожный нерв бедра</text>
<text x="30" y="674" font-size="12.5" fill="#222">7 — бедренная артерия (латерально)</text>
<text x="30" y="693" font-size="12.5" fill="#222">8 — бедренная вена</text>
<text x="30" y="712" font-size="12.5" fill="#222">9 — бедренное кольцо — путь бедренной грыжи</text>
<text x="470" y="560" font-size="12.5" fill="#222">10 — лимфоузел Пирогова — Розенмюллера</text>
<text x="470" y="579" font-size="12.5" fill="#222">11 — лакунарная (джимбернатова) связка</text>
<text x="470" y="598" font-size="12.5" fill="#222">12 — гребенчатая (куперова) связка</text>
<text x="470" y="617" font-size="12.5" fill="#222">13 — гребенчатая мышца</text>
<text x="470" y="636" font-size="12.5" fill="#222">14 — тазовая кость (подвздошно-лобковое возвышение)</text>
<text x="470" y="655" font-size="12.5" fill="#222">15 — бедренная ветвь бедренно-полового нерва</text>
<text x="470" y="674" font-size="12.5" fill="#222">16 — влагалище бедренных сосудов (3 отдела)</text>
<text x="470" y="693" font-size="12.5" fill="#222">17 — семенной канатик (у женщин — круглая связка) — над связкой</text>
