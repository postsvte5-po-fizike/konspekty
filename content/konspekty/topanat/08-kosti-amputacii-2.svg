<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Georgia, 'Times New Roman', serif">
<title>Трёхмоментная конусно-круговая ампутация бедра по Пирогову</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="bone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
 <rect width="6" height="6" fill="#f4f1ea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9d9d9d" stroke-width="0.8"/></pattern>
<pattern id="marrow" width="8" height="8" patternUnits="userSpaceOnUse">
 <rect width="8" height="8" fill="#fbf3dc"/><circle cx="2" cy="2" r="0.9" fill="#d9c98f"/><circle cx="6" cy="6" r="0.7" fill="#e0d29e"/></pattern>
<pattern id="mus1" width="12" height="6" patternUnits="userSpaceOnUse">
 <rect width="12" height="6" fill="#f6e1d8"/><line x1="0" y1="3" x2="12" y2="3" stroke="#d9a998" stroke-width="0.8"/></pattern>
<pattern id="mus2" width="12" height="6" patternUnits="userSpaceOnUse">
 <rect width="12" height="6" fill="#ecc9bc"/><line x1="0" y1="3" x2="12" y2="3" stroke="#c48d7c" stroke-width="0.8"/></pattern>
<pattern id="fat" width="10" height="10" patternUnits="userSpaceOnUse">
 <rect width="10" height="10" fill="#fdf7e3"/><circle cx="3" cy="3" r="2" fill="none" stroke="#e2d3a4" stroke-width="0.6"/><circle cx="8" cy="8" r="1.6" fill="none" stroke="#e2d3a4" stroke-width="0.6"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker>
</defs>
<rect width="900" height="800" fill="#ffffff"/>
<text x="450" y="30" font-size="19" text-anchor="middle" fill="#222">Трёхмоментная конусно-круговая ампутация бедра (Н.И. Пирогов)</text>
<text x="450" y="52" font-size="13.5" text-anchor="middle" fill="#555">А — продольный разрез: уровни рассечения тканей; Б — готовая культя. Проксимально — слева</text>
<text x="40" y="92" font-size="17" font-weight="bold" fill="#222">А</text>

<!-- удаляемая часть конечности (бледно) -->
<g opacity="0.35" filter="url(#pencil)" stroke="#9a9a9a" stroke-width="1.2" fill="none" stroke-dasharray="5 5">
<path d="M760 182 L860 182 M760 418 L860 418 M700 200 L860 200 M700 400 L860 400 M640 240 L860 240 M640 360 L860 360 M590 280 L860 280 M590 320 L860 320"/>
</g>

<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round" stroke="#3a3a3a" stroke-width="1.6">
<!-- кожа + клетчатка (до I) -->
<path d="M80 182 L760 182 L760 200 L80 200 Z" fill="url(#fat)"/>
<path d="M80 400 L760 400 L760 418 L80 418 Z" fill="url(#fat)"/>
<line x1="80" y1="182" x2="760" y2="182" stroke-width="2.4"/>
<line x1="80" y1="418" x2="760" y2="418" stroke-width="2.4"/>
<!-- фасция -->
<line x1="80" y1="200" x2="760" y2="200" stroke="#555" stroke-width="1.4" stroke-dasharray="9 3"/>
<line x1="80" y1="400" x2="760" y2="400" stroke="#555" stroke-width="1.4" stroke-dasharray="9 3"/>
<!-- поверхностные мышцы (до II) -->
<path d="M80 200 L700 200 L700 240 L80 240 Z" fill="url(#mus1)"/>
<path d="M80 360 L700 360 L700 400 L80 400 Z" fill="url(#mus1)"/>
<!-- глубокие мышцы (до III) -->
<path d="M80 240 L640 240 L640 280 L80 280 Z" fill="url(#mus2)"/>
<path d="M80 320 L640 320 L640 360 L80 360 Z" fill="url(#mus2)"/>
<!-- кость (до распила) -->
<path d="M80 280 L590 280 L590 320 L80 320 Z" fill="url(#bone)"/>
<path d="M80 290 L590 290 L590 310 L80 310 Z" fill="url(#marrow)" stroke-width="1"/>
<!-- надкостница -->
<line x1="80" y1="278" x2="584" y2="278" stroke="#7a5c2e" stroke-width="1.2"/>
<line x1="80" y1="322" x2="584" y2="322" stroke="#7a5c2e" stroke-width="1.2"/>
</g>

<!-- уровни -->
<g font-size="14" fill="#222">
<line x1="760" y1="120" x2="760" y2="440" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="700" y1="140" x2="700" y2="440" stroke="#d35400" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="640" y1="160" x2="640" y2="440" stroke="#8e44ad" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="590" y1="180" x2="590" y2="440" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="2 4"/>
<text x="764" y="116" fill="#c0392b" font-weight="bold">I</text>
<text x="704" y="136" fill="#d35400" font-weight="bold">II</text>
<text x="644" y="156" fill="#8e44ad" font-weight="bold">III</text>
<text x="574" y="176" fill="#1f6fb2" font-weight="bold" text-anchor="end">распил</text>
</g>
<!-- стрелки оттягивания -->
<g stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#ar)">
<path d="M752 172 L712 172"/><path d="M692 212 L652 212"/><path d="M632 252 L600 252"/>
</g>

<!-- подписи слоёв -->
<g font-size="12.5" fill="#444">
<text x="60" y="186" text-anchor="end">кожа</text>
<text x="60" y="204" text-anchor="end">фасция</text>
<text x="60" y="226" text-anchor="end">поверхн.</text><text x="60" y="240" text-anchor="end">мышцы</text>
<text x="60" y="266" text-anchor="end">глубокие</text><text x="60" y="280" text-anchor="end">мышцы</text>
<text x="60" y="305" text-anchor="end">кость</text>
</g>

<!-- легенда моментов -->
<g font-size="13.5" fill="#222">
<text x="80" y="470"><tspan fill="#c0392b" font-weight="bold">I момент</tspan> — круговой разрез кожи, клетчатки и фасции; кожа сокращается, её оттягивают проксимально.</text>
<text x="80" y="492"><tspan fill="#d35400" font-weight="bold">II момент</tspan> — по краю сократившейся кожи рассекают поверхностные мышцы.</text>
<text x="80" y="514"><tspan fill="#8e44ad" font-weight="bold">III момент</tspan> — по краю сократившихся поверхностных мышц рассекают глубокие мышцы до кости.</text>
<text x="80" y="536"><tspan fill="#1f6fb2" font-weight="bold">Распил</tspan> — ткани убирают ретрактором, кость перепиливают; «моментом» распил не считается.</text>
</g>

<!-- Б: готовая культя -->
<text x="40" y="590" font-size="17" font-weight="bold" fill="#222">Б</text>
<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round" stroke="#3a3a3a" stroke-width="1.6">
<path d="M80 600 L440 600 C520 600, 600 640, 640 680 C600 720, 520 760, 440 760 L80 760 Z" fill="url(#mus1)"/>
<path d="M80 616 L420 616 C480 618, 540 650, 568 680 C540 710, 480 742, 420 744 L80 744 Z" fill="url(#mus2)"/>
<path d="M80 660 L470 660 L470 700 L80 700 Z" fill="url(#bone)"/>
<path d="M80 670 L470 670 L470 690 L80 690 Z" fill="url(#marrow)" stroke-width="1"/>
<path d="M80 600 L440 600 C520 600, 600 640, 640 680 C600 720, 520 760, 440 760 L80 760" fill="none" stroke-width="2.6"/>
</g>
<g stroke="#c0392b" stroke-width="1.6"><line x1="630" y1="668" x2="648" y2="692"/><line x1="648" y1="668" x2="630" y2="692"/></g>
<g font-size="12.5" fill="#444">
<line x1="470" y1="680" x2="520" y2="560" stroke="#888" stroke-width="0.9"/><text x="524" y="556">опил кости — в глубине конуса мягких тканей</text>
<line x1="645" y1="690" x2="690" y2="730" stroke="#888" stroke-width="0.9"/><text x="694" y="734">рубец кожи — на торце культи</text>
<text x="694" y="750">(на опорной поверхности)</text>
</g>
<text x="450" y="790" font-size="12" text-anchor="middle" fill="#666">Схема, не в масштабе (по рис. 3.64 учебника Николаева). Рисовать: кость с надкостницей → глубокие и поверхностные мышцы → кожа; уровни I–III цветом.</text>
</svg>
