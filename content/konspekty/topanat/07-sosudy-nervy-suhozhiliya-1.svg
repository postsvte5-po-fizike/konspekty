<path d="M643.1 638.0 L 680.6 659.6" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="643.1" cy="638.0" r="4.5" fill="#1f4fa0"/>
<path d="M476.9 638.0 L 439.4 659.6" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="476.9" cy="638.0" r="4.5" fill="#1f4fa0"/>
<path d="M493.6 626.0 C 504.6 624.0, 510.6 642.0, 503.6 652.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M517.4 626.0 C 528.4 624.0, 534.4 642.0, 527.4 652.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M541.1 626.0 C 552.1 624.0, 558.1 642.0, 551.1 652.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M564.9 626.0 C 575.9 624.0, 581.9 642.0, 574.9 652.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M588.6 626.0 C 599.6 624.0, 605.6 642.0, 598.6 652.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M612.4 626.0 C 623.4 624.0, 629.4 642.0, 622.4 652.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<text x="560" y="728" font-size="13" fill="#1f4fa0" font-weight="700" text-anchor="middle">непрерывный обвивной шов по стороне треугольника</text>
<text x="750" y="540" font-size="13.5" fill="#222" font-weight="600">Почему треугольник?</text>
<text x="750" y="560" font-size="12.5" fill="#555">сторона прямая и натянута:</text>
<text x="750" y="578" font-size="12.5" fill="#555">игла не захватит</text>
<text x="750" y="596" font-size="12.5" fill="#555">противоположную стенку;</text>
<text x="750" y="614" font-size="12.5" fill="#555">сосуд поворачивают</text>
<text x="750" y="632" font-size="12.5" fill="#555">за держалки и шьют</text>
<text x="750" y="650" font-size="12.5" fill="#555">следующую сторону</text>
<line x1="20" y1="756" x2="940" y2="756" stroke="#e3e3e3"/>
<text x="40" y="786" font-size="20" font-weight="800" fill="#222">В</text><text x="66" y="786" font-size="14.5" fill="#444">продольный срез стенки по линии шва: края вывернуты — интима к интиме</text>
<path d="M80 856 L 340 856 C 360 856, 374 850, 374 822 L 350 822 C 350 838, 336 842, 320 842 L 80 842 Z" fill="#e9c9a8" stroke="#8a6a44" stroke-width="1.2"/>
<path d="M80 884 L 344 884 C 366 884, 374 870, 374 850 L 350 850 C 350 854, 336 856, 320 856 L 80 856 Z" fill="#d2555f"/>
