<circle cx="367.8" cy="268.0" r="4" fill="#1f4fa0"/>
<text x="400" y="114" font-size="13" fill="#1f4fa0" font-weight="700" text-anchor="middle">держалка 1</text>
<text x="290" y="366" font-size="13" fill="#1f4fa0" font-weight="700" text-anchor="middle">держалка 3</text>
<text x="510" y="366" font-size="13" fill="#1f4fa0" font-weight="700" text-anchor="middle">держалка 2</text>
<path d="M680 155 L 521.3 193.3" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="521.3" cy="193.3" r="2.6" fill="#333"/>
<text x="684" y="160" font-size="13.5" font-weight="600" fill="#8a6a44">адвентиция</text>
<path d="M680 195 L 528.6 221.4" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="528.6" cy="221.4" r="2.6" fill="#333"/>
<text x="684" y="200" font-size="13.5" font-weight="600" fill="#a3333d">средняя оболочка (медия)</text>
<path d="M680 235 L 524.3 245.1" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="524.3" cy="245.1" r="2.6" fill="#333"/>
<text x="684" y="240" font-size="13.5" font-weight="600" fill="#8a7a5a">интима</text>
<text x="684" y="257" font-size="12.5" fill="#666">гладкая, не вызывает тромбоз</text>
<path d="M680 295 L 507.7 245.0" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="507.7" cy="245.0" r="2.6" fill="#333"/>
<text x="684" y="300" font-size="13.5" font-weight="600" fill="#7d1d27">просвет</text>
<line x1="20" y1="400" x2="940" y2="400" stroke="#e3e3e3"/>
<text x="40" y="430" font-size="20" font-weight="800" fill="#222">Б</text><text x="66" y="430" font-size="14.5" fill="#444">вид с торца: держалки растягивают — окружность становится треугольником</text>
<circle cx="190" cy="580" r="70" fill="#d2555f" stroke="#7a2630" stroke-width="2"/><circle cx="190" cy="580" r="56.0" fill="#f7ecd9"/><circle cx="190" cy="580" r="51.8" fill="#7d1d27"/>
<path d="M190.0 517.0 L 190.0 475.0" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="190.0" cy="517.0" r="4.5" fill="#1f4fa0"/>
<path d="M244.6 611.5 L 280.9 632.5" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="244.6" cy="611.5" r="4.5" fill="#1f4fa0"/>
<path d="M135.4 611.5 L 99.1 632.5" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="135.4" cy="611.5" r="4.5" fill="#1f4fa0"/>
<text x="190" y="714" font-size="13" fill="#555" text-anchor="middle">держалки через 120°</text>
<path d="M310 580 H 390" stroke="#333" stroke-width="2.4" marker-end="url(#ar)"/><text x="350" y="570" font-size="12.5" fill="#333" text-anchor="middle">тянут</text>
<path d="M560.0 494.0 L643.1 638.0 L476.9 638.0 Z" fill="#d2555f" stroke="#7a2630" stroke-width="2" stroke-linejoin="round"/>
<path d="M560.0 511.3 L628.2 629.4 L491.8 629.4 Z" fill="#f7ecd9" stroke-linejoin="round"/><path d="M560.0 517.0 L623.2 626.5 L496.8 626.5 Z" fill="#7d1d27" stroke-linejoin="round"/>
