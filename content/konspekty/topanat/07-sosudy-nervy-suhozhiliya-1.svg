<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1046">
<title>Сосудистый шов по Каррелю</title>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap'); text { font-family: Onest, 'PT Sans', 'Helvetica Neue', Arial, sans-serif; } .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }</style>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#333"/></marker></defs>
<rect width="960" height="1046" fill="#fff"/>
<text x="480" y="34" font-size="23" font-weight="700" fill="#1f1f1f" text-anchor="middle">Сосудистый шов по Каррелю</text>
<text x="480" y="58" font-size="14.5" fill="#666" text-anchor="middle">циркулярный шов «конец в конец» при полном пересечении артерии</text>
<text x="40" y="100" font-size="20" font-weight="800" fill="#222">А</text><text x="66" y="100" font-size="14.5" fill="#444">на концы сосуда накладывают три шва-держалки через 120°</text>
<circle cx="250" cy="240" r="74" fill="#e9c9a8" stroke="#7a2630" stroke-width="2"/><circle cx="250" cy="240" r="63.6" fill="#d2555f"/><circle cx="250" cy="240" r="48.8" fill="#f7ecd9"/><circle cx="250" cy="240" r="44.4" fill="#7d1d27"/>
<text x="250" y="366" font-size="12.5" fill="#666" text-anchor="middle">конец 1 (с торца)</text>
<circle cx="510" cy="240" r="74" fill="#e9c9a8" stroke="#7a2630" stroke-width="2"/><circle cx="510" cy="240" r="63.6" fill="#d2555f"/><circle cx="510" cy="240" r="48.8" fill="#f7ecd9"/><circle cx="510" cy="240" r="44.4" fill="#7d1d27"/>
<text x="510" y="366" font-size="12.5" fill="#666" text-anchor="middle">конец 2 (с торца)</text>
<path d="M250.0 180.8 Q 380.0 90.0 510.0 180.8" fill="none" stroke="#1f4fa0" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="250.0" cy="180.8" r="11" fill="#1f4fa0" stroke="#fff" stroke-width="2"/><text x="250.0" y="185.3" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<circle cx="510.0" cy="180.8" r="11" fill="#1f4fa0" stroke="#fff" stroke-width="2"/><text x="510.0" y="185.3" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<path d="M301.3 269.6 Q 380.0 310.0 458.7 269.6" fill="none" stroke="#1f4fa0" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="301.3" cy="269.6" r="11" fill="#1f4fa0" stroke="#fff" stroke-width="2"/><text x="301.3" y="274.1" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<circle cx="458.7" cy="269.6" r="11" fill="#1f4fa0" stroke="#fff" stroke-width="2"/><text x="458.7" y="274.1" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<path d="M198.7 269.6 Q 380.0 390.0 561.3 269.6" fill="none" stroke="#1f4fa0" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="198.7" cy="269.6" r="11" fill="#1f4fa0" stroke="#fff" stroke-width="2"/><text x="198.7" y="274.1" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<circle cx="561.3" cy="269.6" r="11" fill="#1f4fa0" stroke="#fff" stroke-width="2"/><text x="561.3" y="274.1" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<path d="M680 155 L 562.7 195.8" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="562.7" cy="195.8" r="2.6" fill="#333"/>
<text x="684" y="160" font-size="13.5" font-weight="600" fill="#8a6a44">адвентиция</text>
<path d="M680 195 L 564.3 225.4" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="564.3" cy="225.4" r="2.6" fill="#333"/>
<text x="684" y="200" font-size="13.5" font-weight="600" fill="#a3333d">средняя оболочка (медия)</text>
<path d="M680 235 L 555.9 248.1" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="555.9" cy="248.1" r="2.6" fill="#333"/>
<text x="684" y="240" font-size="13.5" font-weight="600" fill="#8a7a5a">интима</text>
<text x="684" y="257" font-size="12.5" fill="#666">гладкая, не вызывает тромбоз</text>
<path d="M680 295 L 519.2 256.0" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="519.2" cy="256.0" r="2.6" fill="#333"/>
<text x="684" y="300" font-size="13.5" font-weight="600" fill="#7d1d27">просвет</text>
<text x="680" y="345" font-size="12.5" fill="#555">Три держалки — через 120° на обоих</text><text x="680" y="362" font-size="12.5" fill="#555">концах; одинаковые номера (пунктир) —</text><text x="680" y="379" font-size="12.5" fill="#555">одна нить, связывающая два конца.</text>
<line x1="20" y1="430" x2="940" y2="430" stroke="#e3e3e3"/>
<text x="40" y="460" font-size="20" font-weight="800" fill="#222">Б</text><text x="66" y="460" font-size="14.5" fill="#444">вид с торца: держалки растягивают — окружность становится треугольником</text>
<circle cx="190" cy="610" r="70" fill="#d2555f" stroke="#7a2630" stroke-width="2"/><circle cx="190" cy="610" r="56.0" fill="#f7ecd9"/><circle cx="190" cy="610" r="51.8" fill="#7d1d27"/>
<path d="M190.0 547.0 L 190.0 505.0" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="190.0" cy="547.0" r="4.5" fill="#1f4fa0"/>
<path d="M244.6 641.5 L 280.9 662.5" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="244.6" cy="641.5" r="4.5" fill="#1f4fa0"/>
<path d="M135.4 641.5 L 99.1 662.5" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="135.4" cy="641.5" r="4.5" fill="#1f4fa0"/>
<text x="190" y="744" font-size="13" fill="#555" text-anchor="middle">держалки через 120°</text>
<path d="M310 610 H 390" stroke="#333" stroke-width="2.4" marker-end="url(#ar)"/><text x="350" y="600" font-size="12.5" fill="#333" text-anchor="middle">тянут</text>
<path d="M560.0 524.0 L643.1 668.0 L476.9 668.0 Z" fill="#d2555f" stroke="#7a2630" stroke-width="2" stroke-linejoin="round"/>
<path d="M560.0 541.3 L628.2 659.4 L491.8 659.4 Z" fill="#f7ecd9" stroke-linejoin="round"/><path d="M560.0 547.0 L623.2 656.5 L496.8 656.5 Z" fill="#7d1d27" stroke-linejoin="round"/>
<path d="M560.0 524.0 L 560.0 480.8" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="560.0" cy="524.0" r="4.5" fill="#1f4fa0"/>
<path d="M643.1 668.0 L 680.6 689.6" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="643.1" cy="668.0" r="4.5" fill="#1f4fa0"/>
<path d="M476.9 668.0 L 439.4 689.6" stroke="#1f4fa0" stroke-width="2.4"/><circle cx="476.9" cy="668.0" r="4.5" fill="#1f4fa0"/>
<path d="M493.6 656.0 C 504.6 654.0, 510.6 672.0, 503.6 682.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M517.4 656.0 C 528.4 654.0, 534.4 672.0, 527.4 682.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M541.1 656.0 C 552.1 654.0, 558.1 672.0, 551.1 682.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M564.9 656.0 C 575.9 654.0, 581.9 672.0, 574.9 682.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M588.6 656.0 C 599.6 654.0, 605.6 672.0, 598.6 682.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<path d="M612.4 656.0 C 623.4 654.0, 629.4 672.0, 622.4 682.0" fill="none" stroke="#1f4fa0" stroke-width="2.2"/>
<text x="560" y="758" font-size="13" fill="#1f4fa0" font-weight="700" text-anchor="middle">непрерывный обвивной шов по стороне треугольника</text>
<text x="750" y="570" font-size="13.5" fill="#222" font-weight="600">Почему треугольник?</text>
<text x="750" y="590" font-size="12.5" fill="#555">сторона прямая и натянута:</text>
<text x="750" y="608" font-size="12.5" fill="#555">игла не захватит</text>
<text x="750" y="626" font-size="12.5" fill="#555">противоположную стенку;</text>
<text x="750" y="644" font-size="12.5" fill="#555">сосуд поворачивают</text>
<text x="750" y="662" font-size="12.5" fill="#555">за держалки и шьют</text>
<text x="750" y="680" font-size="12.5" fill="#555">следующую сторону</text>
<line x1="20" y1="786" x2="940" y2="786" stroke="#e3e3e3"/>
<text x="40" y="816" font-size="20" font-weight="800" fill="#222">В</text><text x="66" y="816" font-size="14.5" fill="#444">продольный срез стенки по линии шва: края вывернуты — интима к интиме</text>
<path d="M80 886 L 340 886 C 360 886, 374 880, 374 852 L 350 852 C 350 868, 336 872, 320 872 L 80 872 Z" fill="#e9c9a8" stroke="#8a6a44" stroke-width="1.2"/>
<path d="M80 914 L 344 914 C 366 914, 374 900, 374 880 L 350 880 C 350 884, 336 886, 320 886 L 80 886 Z" fill="#d2555f"/>
<path d="M80 920 L 346 920 C 370 920, 379 904, 379 880 L 374 880 C 374 900, 366 914, 344 914 L 80 914 Z" fill="#f2dfb8" stroke="#c9a96a" stroke-width="0.8"/>
<path d="M680 886 L 420 886 C 400 886, 386 880, 386 852 L 410 852 C 410 868, 424 872, 440 872 L 680 872 Z" fill="#e9c9a8" stroke="#8a6a44" stroke-width="1.2"/>
<path d="M680 914 L 416 914 C 394 914, 386 900, 386 880 L 410 880 C 410 884, 424 886, 440 886 L 680 886 Z" fill="#d2555f"/>
<path d="M680 920 L 414 920 C 390 920, 381 904, 381 880 L 386 880 C 386 900, 394 914, 416 914 L 680 914 Z" fill="#f2dfb8" stroke="#c9a96a" stroke-width="0.8"/>
<rect x="80" y="920" width="600" height="46" fill="#7d1d27" opacity="0.85"/>
<text x="160" y="948" font-size="13" fill="#fff" font-weight="700">просвет сосуда</text>
<path d="M354 856 C 354 826, 406 826, 406 856 L 402 892 C 390 906, 370 906, 358 892 Z" fill="none" stroke="#1f4fa0" stroke-width="2.4"/>
<path d="M720 841 L 500 879" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="500" cy="879" r="2.4" fill="#333"/><text x="724" y="846" font-size="13.5" font-weight="600" fill="#8a6a44">адвентиция</text>
<path d="M720 871 L 520 900" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="520" cy="900" r="2.4" fill="#333"/><text x="724" y="876" font-size="13.5" font-weight="600" fill="#a3333d">медия</text>
<path d="M720 901 L 540 917" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="540" cy="917" r="2.4" fill="#333"/><text x="724" y="906" font-size="13.5" font-weight="600" fill="#8a7a5a">интима</text>
<path d="M720 933 L 382 890" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="382" cy="890" r="2.4" fill="#333"/><text x="724" y="938" font-size="13.5" font-weight="600" fill="#1f6b3a">интима соприкасается с интимой</text>
<path d="M720 811 L 404 840" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="404" cy="840" r="2.4" fill="#333"/><text x="724" y="816" font-size="13.5" font-weight="600" fill="#1f4fa0">нить — через все слои</text>
<text x="40" y="1006" font-size="13" fill="#555">Если в шов попадёт адвентиция (вывернется внутрь) — она окажется в просвете и вызовет тромбоз. Поэтому края выворачивают наружу.</text>
<text x="480" y="1030" font-size="11.5" fill="#999" text-anchor="middle">Схема, не в масштабе. Классическое описание шва A. Carrel (1902).</text>
</svg>