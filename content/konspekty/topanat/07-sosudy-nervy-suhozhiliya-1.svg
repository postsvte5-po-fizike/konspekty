<path d="M680 884 L 416 884 C 394 884, 386 870, 386 850 L 410 850 C 410 854, 424 856, 440 856 L 680 856 Z" fill="#d2555f"/>
<path d="M680 890 L 414 890 C 390 890, 381 874, 381 850 L 386 850 C 386 870, 394 884, 416 884 L 680 884 Z" fill="#f2dfb8" stroke="#c9a96a" stroke-width="0.8"/>
<rect x="80" y="890" width="600" height="46" fill="#7d1d27" opacity="0.85"/>
<text x="160" y="918" font-size="13" fill="#fff" font-weight="700">просвет сосуда</text>
<path d="M354 826 C 354 796, 406 796, 406 826 L 402 862 C 390 876, 370 876, 358 862 Z" fill="none" stroke="#1f4fa0" stroke-width="2.4"/>
<path d="M720 811 L 500 849" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="500" cy="849" r="2.4" fill="#333"/><text x="724" y="816" font-size="13.5" font-weight="600" fill="#8a6a44">адвентиция</text>
<path d="M720 841 L 520 870" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="520" cy="870" r="2.4" fill="#333"/><text x="724" y="846" font-size="13.5" font-weight="600" fill="#a3333d">медия</text>
<path d="M720 871 L 540 887" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="540" cy="887" r="2.4" fill="#333"/><text x="724" y="876" font-size="13.5" font-weight="600" fill="#8a7a5a">интима</text>
<path d="M720 903 L 382 860" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="382" cy="860" r="2.4" fill="#333"/><text x="724" y="908" font-size="13.5" font-weight="600" fill="#1f6b3a">интима соприкасается с интимой</text>
<path d="M720 781 L 404 810" stroke="#9a9a9a" stroke-width="1.1"/><circle cx="404" cy="810" r="2.4" fill="#333"/><text x="724" y="786" font-size="13.5" font-weight="600" fill="#1f4fa0">нить — через все слои обоих краёв</text>
<text x="40" y="976" font-size="13" fill="#555">Если в шов попадёт адвентиция (вывернется внутрь) — она окажется в просвете и вызовет тромбоз. Поэтому края выворачивают наружу.</text>
<text x="480" y="1000" font-size="11.5" fill="#999" text-anchor="middle">Схема, не в масштабе. Классическое описание шва A. Carrel (1902).</text>
</svg>