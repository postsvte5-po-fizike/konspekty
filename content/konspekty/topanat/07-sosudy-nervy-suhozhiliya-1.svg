<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Georgia, 'Times New Roman', serif">
<title>Сосудистый шов по Каррелю</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="bone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
 <rect width="6" height="6" fill="#f4f1ea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9d9d9d" stroke-width="0.8"/></pattern>
<pattern id="fat" width="10" height="10" patternUnits="userSpaceOnUse">
 <rect width="10" height="10" fill="#fdf7e3"/><circle cx="3" cy="3" r="2" fill="none" stroke="#e2d3a4" stroke-width="0.6"/><circle cx="8" cy="8" r="1.6" fill="none" stroke="#e2d3a4" stroke-width="0.6"/></pattern>
<pattern id="mus" width="6" height="12" patternUnits="userSpaceOnUse">
 <rect width="6" height="12" fill="#f6e1d8"/><line x1="3" y1="0" x2="3" y2="12" stroke="#d9a998" stroke-width="0.8"/></pattern>
<pattern id="nerve" width="6" height="6" patternUnits="userSpaceOnUse">
 <rect width="6" height="6" fill="#fbf0b8"/><circle cx="3" cy="3" r="0.8" fill="#e0c75a"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker>
</defs>
<rect width="900" height="560" fill="#ffffff"/>
<text x="450.0" y="30" font-size="19" text-anchor="middle" fill="#222">Сосудистый шов по Каррелю</text>
<text x="450.0" y="52" font-size="13.5" text-anchor="middle" fill="#555">А — три шва-держалки; Б — растягивание держалок превращает окружность в треугольник; В — выворот краёв: интима к интиме</text>
<text x="40" y="100" font-size="17" font-weight="bold" fill="#222">А</text>
<g filter="url(#pencil)" stroke="#3a3a3a" stroke-linecap="round"><circle cx="160" cy="280" r="80" fill="#fbe9e6" stroke-width="5" stroke-opacity="0.35"/><circle cx="160" cy="280" r="80" fill="none" stroke-width="2"/><circle cx="160" cy="280" r="71" fill="#fff" stroke="#c0392b" stroke-width="1.2"/></g>
<circle cx="160.0" cy="200.0" r="5" fill="#1f6fb2"/><line x1="160.0" y1="200.0" x2="160.0" y2="152.0" stroke="#1f6fb2" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="229.3" cy="320.0" r="5" fill="#1f6fb2"/><line x1="229.3" y1="320.0" x2="270.9" y2="344.0" stroke="#1f6fb2" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="90.7" cy="320.0" r="5" fill="#1f6fb2"/><line x1="90.7" y1="320.0" x2="49.1" y2="344.0" stroke="#1f6fb2" stroke-width="2" marker-end="url(#ar)"/>
<text x="160" y="285" font-size="13" text-anchor="middle" fill="#444">просвет</text>
<text x="160" y="430" font-size="13" text-anchor="middle" fill="#444">держалки через 120°</text>
<text x="320" y="100" font-size="17" font-weight="bold" fill="#222">Б</text>
<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round"><polygon points="450,170 560,360 340,360" fill="#fbe9e6" stroke="#3a3a3a" stroke-width="2"/></g>
<circle cx="450" cy="170" r="5" fill="#1f6fb2"/>
<circle cx="560" cy="360" r="5" fill="#1f6fb2"/>
<circle cx="340" cy="360" r="5" fill="#1f6fb2"/>
<line x1="453.2" y1="187.1" x2="471.2" y2="195.1" stroke="#2d6a2d" stroke-width="2"/>
<line x1="465.4" y1="208.2" x2="483.4" y2="216.2" stroke="#2d6a2d" stroke-width="2"/>
<line x1="477.7" y1="229.3" x2="495.7" y2="237.3" stroke="#2d6a2d" stroke-width="2"/>
<line x1="489.9" y1="250.4" x2="507.9" y2="258.4" stroke="#2d6a2d" stroke-width="2"/>
<line x1="502.1" y1="271.6" x2="520.1" y2="279.6" stroke="#2d6a2d" stroke-width="2"/>
<line x1="514.3" y1="292.7" x2="532.3" y2="300.7" stroke="#2d6a2d" stroke-width="2"/>
<line x1="526.6" y1="313.8" x2="544.6" y2="321.8" stroke="#2d6a2d" stroke-width="2"/>
<line x1="538.8" y1="334.9" x2="556.8" y2="342.9" stroke="#2d6a2d" stroke-width="2"/>
<line x1="450" y1="170" x2="450" y2="130" stroke="#1f6fb2" stroke-width="2" marker-end="url(#ar)"/><line x1="560" y1="360" x2="595" y2="380" stroke="#1f6fb2" stroke-width="2" marker-end="url(#ar)"/><line x1="340" y1="360" x2="305" y2="380" stroke="#1f6fb2" stroke-width="2" marker-end="url(#ar)"/>
<g font-size="12.5" fill="#444"><line x1="520" y1="255" x2="590" y2="230" stroke="#888" stroke-width="0.9"/><text x="594" y="226">непрерывный</text><text x="594" y="241">обвивной шов</text><text x="594" y="256">между держалками</text></g>
<text x="450" y="430" font-size="13" text-anchor="middle" fill="#444">прямые края — игла не захватит</text><text x="450" y="446" font-size="13" text-anchor="middle" fill="#444">противоположную стенку</text>
<text x="630" y="110" font-size="17" font-weight="bold" fill="#222">В</text>
<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M640 270 L735 270 Q750 270 750 255 L750 200" stroke="#bdbdbd" stroke-width="18"/>
<path d="M880 270 L785 270 Q770 270 770 255 L770 200" stroke="#bdbdbd" stroke-width="18"/>
<path d="M640 279 L735 279 Q759 279 759 255 L759 200" stroke="#c0392b" stroke-width="2.5"/>
<path d="M880 279 L785 279 Q761 279 761 255 L761 200" stroke="#c0392b" stroke-width="2.5"/>
</g>
<path d="M736 222 L784 222 M736 222 C736 196, 784 196, 784 222" fill="none" stroke="#2d6a2d" stroke-width="2.2"/>
<g font-size="12.5" fill="#444">
<text x="760" y="320" text-anchor="middle">просвет сосуда</text>
<line x1="840" y1="262" x2="850" y2="300" stroke="#888" stroke-width="0.9"/><text x="830" y="316">стенка</text>
<line x1="700" y1="281" x2="680" y2="345" stroke="#888" stroke-width="0.9"/><text x="640" y="360" fill="#c0392b">интима</text>
<line x1="770" y1="200" x2="780" y2="168" stroke="#888" stroke-width="0.9"/><text x="680" y="150">шов: края вывернуты,</text><text x="680" y="165">интима к интиме</text>
</g>
<text x="450.0" y="530" font-size="12" text-anchor="middle" fill="#666">Схема, не в масштабе. Рисовать: окружность → три точки через 120° → треугольник → стежки по одной стороне; рядом — вывернутые края.</text>
<text x="450.0" y="548" font-size="12" text-anchor="middle" fill="#666">Внешний источник: классическое описание шва A. Carrel (1902) в учебниках оперативной хирургии.</text>
</svg>
