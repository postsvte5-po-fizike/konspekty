<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, 'Times New Roman', serif">
<title>Строение периферического нерва и виды шва нерва</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="bone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
 <rect width="6" height="6" fill="#f4f1ea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9d9d9d" stroke-width="0.8"/></pattern>
<pattern id="fat" width="10" height="10" patternUnits="userSpaceOnUse">
 <rect width="10" height="10" fill="#fdf7e3"/><circle cx="3" cy="3" r="2" fill="none" stroke="#e2d3a4" stroke-width="0.6"/><circle cx="8" cy="8" r="1.6" fill="none" stroke="#e2d3a4" stroke-width="0.6"/></pattern>
<pattern id="mus" width="6" height="12" patternUnits="userSpaceOnUse">
 <rect width="6" height="12" fill="#f6e1d8"/><line x1="3" y1="0" x2="3" y2="12" stroke="#d9a998" stroke-width="0.8"/></pattern>
<pattern id="nerve" width="6" height="6" patternUnits="userSpaceOnUse">
 <rect width="6" height="6" fill="#fbf0b8"/><circle cx="3" cy="3" r="0.8" fill="#e0c75a"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker>
</defs>
<rect width="900" height="600" fill="#ffffff"/>
<text x="450.0" y="30" font-size="19" text-anchor="middle" fill="#222">Строение периферического нерва и виды шва нерва</text>
<text x="450.0" y="52" font-size="13.5" text-anchor="middle" fill="#555">А — поперечный срез; Б — эпиневральный шов; В — периневральный (пучковый) шов</text>
<text x="40" y="100" font-size="17" font-weight="bold" fill="#222">А</text>
<g filter="url(#pencil)" stroke-linecap="round"><circle cx="200" cy="300" r="130" fill="#fdf7e3" stroke="#3a3a3a" stroke-width="2.4"/><circle cx="150" cy="250" r="38" fill="url(#nerve)" stroke="#8a6d00" stroke-width="2"/><circle cx="240" cy="240" r="42" fill="url(#nerve)" stroke="#8a6d00" stroke-width="2"/><circle cx="130" cy="340" r="32" fill="url(#nerve)" stroke="#8a6d00" stroke-width="2"/><circle cx="215" cy="330" r="46" fill="url(#nerve)" stroke="#8a6d00" stroke-width="2"/><circle cx="285" cy="320" r="26" fill="url(#nerve)" stroke="#8a6d00" stroke-width="2"/><circle cx="180" cy="400" r="22" fill="url(#nerve)" stroke="#8a6d00" stroke-width="2"/></g>
<circle cx="270" cy="395" r="7" fill="#f2b8b0" stroke="#c0392b" stroke-width="1.5"/><circle cx="95" cy="290" r="7" fill="#f2b8b0" stroke="#c0392b" stroke-width="1.5"/><g font-size="12.5" fill="#444">
<line x1="300" y1="200" x2="360" y2="160" stroke="#888" stroke-width="0.9"/><text x="364" y="156">эпиневрий — наружная</text><text x="364" y="171">оболочка с сосудами</text>
<line x1="270" y1="225" x2="360" y2="215" stroke="#888" stroke-width="0.9"/><text x="364" y="211">периневрий — оболочка</text><text x="364" y="226">пучка (фасцикулы)</text>
<line x1="230" y1="335" x2="360" y2="290" stroke="#888" stroke-width="0.9"/><text x="364" y="286">пучок нервных волокон;</text><text x="364" y="301">внутри — эндоневрий</text>
<line x1="270" y1="395" x2="360" y2="400" stroke="#888" stroke-width="0.9"/><text x="364" y="404">сосуды эпиневрия —</text><text x="364" y="419">ориентир для поворота</text><text x="364" y="434">концов при шве</text>
</g>
<text x="540" y="110" font-size="17" font-weight="bold" fill="#222">Б</text>
<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round"><rect x="560" y="140" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#3a3a3a" stroke-width="2"/><rect x="700" y="140" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#3a3a3a" stroke-width="2"/><rect x="562" y="150" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="702" y="150" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="562" y="172" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="702" y="172" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="562" y="194" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="702" y="194" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/></g>
<path d="M668 140 C676 126, 704 126, 712 140" fill="none" stroke="#2d6a2d" stroke-width="2.4"/><path d="M668 220 C676 234, 704 234, 712 220" fill="none" stroke="#2d6a2d" stroke-width="2.4"/><text x="540" y="330" font-size="17" font-weight="bold" fill="#222">В</text>
<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round"><rect x="560" y="360" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#3a3a3a" stroke-width="2"/><rect x="700" y="360" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#3a3a3a" stroke-width="2"/><rect x="562" y="370" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="702" y="370" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="562" y="392" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="702" y="392" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="562" y="414" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/><rect x="702" y="414" width="116" height="16" rx="6" fill="url(#nerve)" stroke="#8a6d00" stroke-width="1.4"/></g>
<path d="M670 370 C680 362, 700 362, 710 370" fill="none" stroke="#2d6a2d" stroke-width="2"/><path d="M670 392 C680 384, 700 384, 710 392" fill="none" stroke="#2d6a2d" stroke-width="2"/><path d="M670 414 C680 406, 700 406, 710 414" fill="none" stroke="#2d6a2d" stroke-width="2"/><g font-size="12.5" fill="#444">
<text x="690" y="250" text-anchor="middle">нить проходит только через эпиневрий;</text><text x="690" y="265" text-anchor="middle">концы сопоставляют по сосудам и рисунку пучков</text>
<text x="690" y="470" text-anchor="middle">сшивают периневрий соответствующих пучков;</text><text x="690" y="485" text-anchor="middle">точнее, но дольше; нужен микроскоп</text>
</g>
<text x="450.0" y="570" font-size="12" text-anchor="middle" fill="#666">Схема, не в масштабе. Рисовать: эпиневрий → пучки разного размера → сосуды; справа — два конца нерва и швы (зелёные).</text>
<text x="450.0" y="588" font-size="12" text-anchor="middle" fill="#666">Внешний источник: учебники оперативной хирургии и микрохирургии нервов.</text>
</svg>
