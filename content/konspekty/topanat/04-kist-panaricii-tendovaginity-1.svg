<text x="30" y="570" font-size="12.5" fill="#222">1 — удерживатель сгибателей (retinaculum flexorum)</text>
<text x="30" y="589" font-size="12.5" fill="#222">2 — срединный нерв (в канале, под удерживателем)</text>
<text x="30" y="608" font-size="12.5" fill="#222">3 — сухожилия поверхностного сгибателя пальцев (FDS)</text>
<text x="30" y="627" font-size="12.5" fill="#222">4 — сухожилия глубокого сгибателя пальцев (FDP)</text>
<text x="30" y="646" font-size="12.5" fill="#222">5 — общее (локтевое) синовиальное влагалище</text>
<text x="30" y="665" font-size="12.5" fill="#222">6 — сухожилие FPL в лучевом влагалище</text>
<text x="30" y="684" font-size="12.5" fill="#222">7 — сухожилие лучевого сгибателя запястья (FCR)</text>
<text x="30" y="703" font-size="12.5" fill="#222">8 — сухожилие длинной ладонной мышцы</text>
<text x="30" y="722" font-size="12.5" fill="#222">9 — локтевая артерия (канал Гийона)</text>
<text x="470" y="570" font-size="12.5" fill="#222">10 — локтевой нерв (канал Гийона)</text>
<text x="470" y="589" font-size="12.5" fill="#222">11 — крючок крючковидной кости</text>
