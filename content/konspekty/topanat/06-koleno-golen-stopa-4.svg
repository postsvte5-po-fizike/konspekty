<text x="30" y="640" font-size="12.5" fill="#222">1 — медиальная лодыжка</text>
<text x="30" y="659" font-size="12.5" fill="#222">2 — удерживатель сгибателей — крыша канала</text>
<text x="30" y="678" font-size="12.5" fill="#222">3 — сухожилие задней большеберцовой мышцы (1-е, у лодыжки)</text>
<text x="30" y="697" font-size="12.5" fill="#222">4 — сухожилие длинного сгибателя пальцев (2-е)</text>
<text x="30" y="716" font-size="12.5" fill="#222">5 — задние большеберцовые артерия и вены (3-и)</text>
<text x="30" y="735" font-size="12.5" fill="#222">6 — большеберцовый нерв (4-й)</text>
<text x="470" y="640" font-size="12.5" fill="#222">7 — сухожилие длинного сгибателя большого пальца (5-е, кзади)</text>
<text x="470" y="659" font-size="12.5" fill="#222">8 — пяточное (ахиллово) сухожилие</text>
<text x="470" y="678" font-size="12.5" fill="#222">9 — пяточная кость</text>
<text x="470" y="697" font-size="12.5" fill="#222">10 — большая подкожная вена и подкожный нерв — впереди лодыжки</text>
<text x="470" y="716" font-size="12.5" fill="#222">11 — таранная кость</text>
<text x="470" y="735" font-size="12.5" fill="#222">12 — ладьевидная кость</text>
