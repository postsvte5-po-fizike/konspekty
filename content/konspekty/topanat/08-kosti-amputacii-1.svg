<g font-size="12.5" fill="#444">
<text x="250" y="342" text-anchor="end">I плюсневая</text><line x1="254" y1="338" x2="334" y2="338" stroke="#888" stroke-width="0.9"/>
<text x="250" y="420" text-anchor="end">основание II —</text><text x="250" y="435" text-anchor="end">«ключ» Лисфранка</text><line x1="254" y1="428" x2="398" y2="470" stroke="#888" stroke-width="0.9"/>
<text x="250" y="492" text-anchor="end">клиновидные</text><line x1="254" y1="488" x2="346" y2="488" stroke="#888" stroke-width="0.9"/>
<text x="250" y="556" text-anchor="end">ладьевидная</text><line x1="254" y1="552" x2="344" y2="552" stroke="#888" stroke-width="0.9"/>
<text x="250" y="626" text-anchor="end">головка таранной</text><line x1="254" y1="622" x2="392" y2="606" stroke="#888" stroke-width="0.9"/>
<text x="250" y="690" text-anchor="end">тело таранной</text><line x1="254" y1="686" x2="430" y2="680" stroke="#888" stroke-width="0.9"/>
<text x="664" y="556" text-anchor="start">кубовидная</text><line x1="660" y1="552" x2="560" y2="552" stroke="#888" stroke-width="0.9"/>
<text x="664" y="700" text-anchor="start">пяточная</text><line x1="660" y1="696" x2="580" y2="696" stroke="#888" stroke-width="0.9"/>
<text x="664" y="470" text-anchor="start">V плюсневая</text><line x1="660" y1="466" x2="560" y2="440" stroke="#888" stroke-width="0.9"/>
</g>
<g font-size="15" font-weight="bold">
<line x1="604" y1="312" x2="640" y2="300" stroke="#c0392b" stroke-width="1.2"/><circle cx="652" cy="298" r="13" fill="#fff" stroke="#c0392b" stroke-width="1.6"/><text x="652" y="303" text-anchor="middle" fill="#c0392b">1</text>
<line x1="608" y1="404" x2="640" y2="400" stroke="#d35400" stroke-width="1.2"/><circle cx="652" cy="398" r="13" fill="#fff" stroke="#d35400" stroke-width="1.6"/><text x="652" y="403" text-anchor="middle" fill="#d35400">2</text>
<line x1="606" y1="512" x2="640" y2="512" stroke="#1f6fb2" stroke-width="1.2"/><circle cx="652" cy="512" r="13" fill="#fff" stroke="#1f6fb2" stroke-width="1.6"/><text x="652" y="517" text-anchor="middle" fill="#1f6fb2">3</text>
<line x1="612" y1="592" x2="640" y2="606" stroke="#1e8449" stroke-width="1.2"/><circle cx="652" cy="610" r="13" fill="#fff" stroke="#1e8449" stroke-width="1.6"/><text x="652" y="615" text-anchor="middle" fill="#1e8449">4</text>
</g>
<g font-size="14" fill="#222">
<text x="664" y="110" font-weight="bold">Уровни</text>
<line x1="664" y1="134" x2="696" y2="134" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><text x="704" y="139">1 — Гаранжо</text><text x="704" y="156" font-size="12.5" fill="#555">вычленение всех пальцев</text><text x="704" y="171" font-size="12.5" fill="#555">в плюснефаланговых суставах</text>
<line x1="664" y1="196" x2="696" y2="196" stroke="#d35400" stroke-width="3"/><text x="704" y="201">2 — Шарп</text><text x="704" y="218" font-size="12.5" fill="#555">распил плюсневых костей</text>
<line x1="664" y1="242" x2="696" y2="242" stroke="#1f6fb2" stroke-width="3.6" stroke-dasharray="3 6"/><text x="704" y="247">3 — Лисфранк</text><text x="704" y="264" font-size="12.5" fill="#555">предплюсне-плюсневый сустав</text>
<line x1="664" y1="288" x2="696" y2="288" stroke="#1e8449" stroke-width="3" stroke-dasharray="12 5 3 5"/><text x="704" y="293">4 — Шопар</text><text x="704" y="310" font-size="12.5" fill="#555">поперечный сустав предплюсны</text>
</g>
<text x="450" y="830" font-size="12" text-anchor="middle" fill="#666">Схема, не в масштабе. Порядок рисования: пяточная и таранная → ладьевидная, кубовидная, клиновидные → плюсневые → пальцы;</text>
<text x="450" y="848" font-size="12" text-anchor="middle" fill="#666">линии уровней — в конце цветом. Сверить: атлас Неттера — кости стопы (вид сверху).</text>
</svg>