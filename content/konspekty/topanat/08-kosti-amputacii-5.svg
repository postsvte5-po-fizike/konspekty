<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Georgia, 'Times New Roman', serif">
<title>Ампутация голени в средней трети двухлоскутным способом: обработка костей</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="bone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
 <rect width="6" height="6" fill="#f4f1ea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9d9d9d" stroke-width="0.8"/></pattern>
<pattern id="mus1" width="6" height="12" patternUnits="userSpaceOnUse">
 <rect width="6" height="12" fill="#f6e1d8"/><line x1="3" y1="0" x2="3" y2="12" stroke="#d9a998" stroke-width="0.8"/></pattern>
<pattern id="fat" width="10" height="10" patternUnits="userSpaceOnUse">
 <rect width="10" height="10" fill="#fdf7e3"/><circle cx="3" cy="3" r="2" fill="none" stroke="#e2d3a4" stroke-width="0.6"/><circle cx="8" cy="8" r="1.6" fill="none" stroke="#e2d3a4" stroke-width="0.6"/></pattern>
</defs>
<rect width="900" height="620" fill="#ffffff"/>
<text x="450" y="30" font-size="19" text-anchor="middle" fill="#222">Ампутация голени в средней трети: обработка костей и лоскуты</text>
<text x="450" y="52" font-size="13.5" text-anchor="middle" fill="#555">правая голень, вид снаружи (латерально); кпереди — справа</text>

<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round" stroke="#3a3a3a" stroke-width="1.7">
<!-- мягкие ткани культи до уровня распила -->
<path d="M300 90 L300 330 L560 330 L560 90 Z" fill="url(#mus1)" stroke="none"/>
<line x1="300" y1="90" x2="300" y2="330" stroke-width="2.2"/>
<line x1="560" y1="90" x2="560" y2="330" stroke-width="2.2"/>
<!-- задний короткий лоскут (кожа+фасция) -->
<path d="M300 330 C300 370, 310 400, 330 410 L346 410 C334 396, 326 370, 324 330 Z" fill="url(#fat)"/>
<!-- передний длинный лоскут -->
<path d="M560 330 C560 400, 550 470, 500 500 C470 516, 430 516, 412 506 L420 494 C440 500, 470 500, 492 486 C530 460, 538 400, 538 330 Z" fill="url(#fat)"/>
<!-- малоберцовая (короче) -->
<path d="M352 90 L376 90 L376 290 L352 290 Z" fill="url(#bone)"/>
<!-- большеберцовая со скошенным передним краем -->
<path d="M430 90 L520 90 L520 300 L496 330 L430 330 Z" fill="url(#bone)"/>
</g>
<g stroke-linecap="round" fill="none">
<line x1="330" y1="290" x2="398" y2="290" stroke="#1f6fb2" stroke-width="2.4" stroke-dasharray="7 4"/>
<line x1="410" y1="330" x2="496" y2="330" stroke="#1f6fb2" stroke-width="2.4" stroke-dasharray="7 4"/>
<line x1="496" y1="330" x2="540" y2="276" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 4"/>
<line x1="520" y1="300" x2="520" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="496" y1="330" x2="520" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
</g>
<g font-size="13" fill="#444">
<line x1="364" y1="160" x2="230" y2="160" stroke="#888" stroke-width="0.9"/><text x="226" y="156" text-anchor="end">малоберцовая —</text><text x="226" y="171" text-anchor="end">перепилена на 1,5–2 см</text><text x="226" y="186" text-anchor="end">выше большеберцовой</text>
<line x1="476" y1="160" x2="640" y2="140" stroke="#888" stroke-width="0.9"/><text x="644" y="144">большеберцовая</text>
<line x1="532" y1="290" x2="640" y2="250" stroke="#888" stroke-width="0.9"/><text x="644" y="240">передний край (гребень)</text><text x="644" y="255">спилен косо, примерно под 45°:</text><text x="644" y="270">острый угол давил бы на кожу</text>
<line x1="330" y1="400" x2="230" y2="420" stroke="#888" stroke-width="0.9"/><text x="226" y="416" text-anchor="end">задний короткий</text><text x="226" y="431" text-anchor="end">лоскут</text>
<line x1="540" y1="450" x2="640" y2="460" stroke="#888" stroke-width="0.9"/><text x="644" y="456">передний длинный кожно-</text><text x="644" y="471">фасциальный лоскут: закрывает</text><text x="644" y="486">опилы, рубец уходит назад</text>
<line x1="380" y1="230" x2="230" y2="250" stroke="#888" stroke-width="0.9"/><text x="226" y="246" text-anchor="end">межкостная</text><text x="226" y="261" text-anchor="end">мембрана и мышцы</text>
</g>
<text x="450" y="570" font-size="12" text-anchor="middle" fill="#666">Схема, не в масштабе. Цифры (1,5–2 см, 45°) — по классическим учебникам оперативной хирургии, сверить с кафедрой.</text>
<text x="450" y="588" font-size="12" text-anchor="middle" fill="#666">Рисовать: большеберцовая и малоберцовая → линии распилов (синие) и скос гребня (красный) → лоскуты.</text>
<text x="450" y="606" font-size="12" text-anchor="middle" fill="#666">Сверить: атлас Неттера — кости голени.</text>
</svg>
