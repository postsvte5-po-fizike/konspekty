<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" font-family="Georgia, 'Times New Roman', serif">
<title>Костно-пластическая ампутация голени по Пирогову</title>
<defs>
<filter id="pencil" x="-3%" y="-3%" width="106%" height="106%">
 <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="bone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
 <rect width="6" height="6" fill="#f4f1ea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9d9d9d" stroke-width="0.8"/></pattern>
<pattern id="del" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
 <rect width="7" height="7" fill="#fbe9e6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d98c80" stroke-width="1.1"/></pattern>
<pattern id="fat" width="10" height="10" patternUnits="userSpaceOnUse">
 <rect width="10" height="10" fill="#fdf7e3"/><circle cx="3" cy="3" r="2" fill="none" stroke="#e2d3a4" stroke-width="0.6"/><circle cx="8" cy="8" r="1.6" fill="none" stroke="#e2d3a4" stroke-width="0.6"/></pattern>
<pattern id="ten" width="6" height="6" patternUnits="userSpaceOnUse">
 <rect width="6" height="6" fill="#eef0f2"/><line x1="3" y1="0" x2="3" y2="6" stroke="#b8bec6" stroke-width="0.8"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker>
</defs>
<rect width="900" height="670" fill="#ffffff"/>
<text x="450" y="30" font-size="19" text-anchor="middle" fill="#222">Костно-пластическая ампутация голени по Н.И. Пирогову</text>
<text x="450" y="52" font-size="13.5" text-anchor="middle" fill="#555">сагиттальный разрез, вид с медиальной стороны; кпереди — справа</text>
<text x="40" y="88" font-size="17" font-weight="bold" fill="#222">А</text>
<text x="70" y="88" font-size="14" fill="#444">что удаляют (красная штриховка)</text>
<text x="490" y="88" font-size="17" font-weight="bold" fill="#222">Б</text>
<text x="520" y="88" font-size="14" fill="#444">культя: распил к распилу</text>

<!-- ===== А ===== -->
<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round" stroke="#3a3a3a" stroke-width="1.7">
<!-- кожа и клетчатка голени и стопы -->
<path d="M150 110 L150 300 C140 340, 110 380, 108 430 C106 470, 130 492, 170 494 L400 494 C430 494, 446 470, 440 452 C432 430, 380 404, 330 380 C306 366, 300 340, 300 300 L300 110" fill="url(#fat)" stroke-width="2.2"/>
<!-- большеберцовая -->
<path d="M196 110 L262 110 L262 300 C266 312, 268 322, 262 332 C246 340, 210 340, 196 332 C190 322, 192 310, 196 300 Z" fill="url(#bone)"/>
<!-- удаляемый дистальный участок большеберцовой -->
<path d="M193 312 L265 312 C268 322, 266 328, 262 332 C246 340, 210 340, 196 332 C190 326, 191 318, 193 312 Z" fill="url(#del)"/>
<!-- ахиллово сухожилие -->
<path d="M160 110 L180 110 L180 340 C178 360, 172 372, 166 380 L150 380 C156 360, 160 340, 160 320 Z" fill="url(#ten)"/>
<!-- таранная (удаляется) -->
<path d="M198 342 C214 334, 250 334, 266 342 C286 346, 312 354, 326 370 C330 384, 316 394, 296 394 L214 396 C200 392, 194 372, 198 342 Z" fill="url(#del)"/>
<!-- пяточная: передняя часть удаляется, бугор остаётся -->
<path d="M196 398 L300 396 C320 400, 336 410, 338 428 C336 446, 320 456, 296 458 L200 462 Z" fill="url(#del)"/>
<path d="M200 398 L200 462 L150 464 C126 462, 116 444, 118 424 C122 404, 138 392, 156 388 C170 386, 186 392, 200 398 Z" fill="url(#bone)"/>
<!-- кости переднего отдела стопы (удаляются) -->
<path d="M332 380 C350 384, 380 400, 410 420 C424 432, 428 448, 414 458 C390 462, 360 458, 342 448 C336 436, 334 412, 332 380 Z" fill="url(#del)"/>
</g>
<!-- линии распилов и разреза -->
<g stroke-linecap="round" fill="none">
<line x1="176" y1="312" x2="282" y2="312" stroke="#1f6fb2" stroke-width="2.6" stroke-dasharray="8 4"/>
<line x1="200" y1="384" x2="200" y2="476" stroke="#1f6fb2" stroke-width="2.6" stroke-dasharray="8 4"/>
<path d="M200 476 L200 506" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="3 4"/>
<path d="M300 318 C310 324, 316 330, 318 340" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="3 4"/>
</g>
<g font-size="12.5" fill="#444">
<line x1="282" y1="312" x2="350" y2="270" stroke="#888" stroke-width="0.9"/><text x="354" y="262">распил большеберцовой</text><text x="354" y="277">и малоберцовой</text><text x="354" y="292">над лодыжками</text>
<line x1="202" y1="440" x2="80" y2="560" stroke="#888" stroke-width="0.9"/><text x="40" y="576">распил пяточной кости</text><text x="40" y="591">позади таранной</text>
<line x1="200" y1="500" x2="210" y2="540" stroke="#888" stroke-width="0.9"/><text x="214" y="552">стремяобразный разрез</text><text x="214" y="567">через подошву</text>
<line x1="318" y1="338" x2="380" y2="336" stroke="#888" stroke-width="0.9"/><text x="384" y="340">тыльный разрез</text><text x="384" y="355">над суставом</text>
<line x1="170" y1="200" x2="100" y2="190" stroke="#888" stroke-width="0.9"/><text x="96" y="186" text-anchor="end">ахиллово</text><text x="96" y="201" text-anchor="end">сухожилие</text>
<line x1="230" y1="200" x2="300" y2="160" stroke="#888" stroke-width="0.9"/><text x="304" y="156">большеберцовая</text>
<text x="420" y="402">таранная</text><line x1="416" y1="398" x2="300" y2="372" stroke="#888" stroke-width="0.9"/>
<line x1="150" y1="430" x2="70" y2="470" stroke="#888" stroke-width="0.9"/><text x="66" y="466" text-anchor="end">пяточный</text><text x="66" y="481" text-anchor="end">бугор</text>
</g>

<!-- ===== Б ===== -->
<g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round" stroke="#3a3a3a" stroke-width="1.7">
<path d="M610 110 L610 330 C604 380, 600 430, 630 452 C660 470, 720 470, 750 452 C776 432, 772 380, 760 330 L760 110" fill="url(#fat)" stroke-width="2.2"/>
<path d="M656 110 L722 110 L722 312 L656 312 Z" fill="url(#bone)"/>
<path d="M620 110 L640 110 L640 300 C640 320, 636 336, 630 346 L618 346 C620 330, 620 316, 620 300 Z" fill="url(#ten)"/>
<!-- повёрнутый пяточный бугор: распил вверх -->
<path d="M652 312 L726 312 C736 330, 740 352, 734 374 C724 398, 700 408, 680 404 C658 400, 642 384, 640 362 C638 344, 642 326, 652 312 Z" fill="url(#bone)"/>
</g>
<line x1="646" y1="312" x2="732" y2="312" stroke="#1f6fb2" stroke-width="2.4" stroke-dasharray="8 4"/>
<g stroke="#555" stroke-width="1.5" fill="none"><path d="M780 420 C820 400, 822 350, 790 330" marker-end="url(#ar)"/></g>
<g font-size="12.5" fill="#444">
<text x="800" y="438">поворот</text><text x="800" y="453">на 90°</text><text x="800" y="468">кпереди</text>
<line x1="732" y1="312" x2="790" y2="260" stroke="#888" stroke-width="0.9"/><text x="794" y="252">распил к распилу,</text><text x="794" y="267">сращение</text>
<line x1="690" y1="360" x2="560" y2="400" stroke="#888" stroke-width="0.9"/><text x="556" y="396" text-anchor="end">пяточный</text><text x="556" y="411" text-anchor="end">бугор</text>
<line x1="690" y1="462" x2="640" y2="520" stroke="#888" stroke-width="0.9"/><text x="560" y="536">опора — на кожу и жировую подушку пятки</text>
<line x1="626" y1="250" x2="560" y2="250" stroke="#888" stroke-width="0.9"/><text x="556" y="246" text-anchor="end">ахиллово</text><text x="556" y="261" text-anchor="end">сухожилие</text>
</g>
<text x="450" y="612" font-size="12" text-anchor="middle" fill="#666">Схема, не в масштабе, по смыслу рис. 3.65 учебника Николаева. Малоберцовая кость на срезе не видна — её перепиливают на том же уровне.</text>
<text x="450" y="630" font-size="12" text-anchor="middle" fill="#666">Рисовать: большеберцовая → таранная и пяточная → линии распилов (синие) → разрезы (красные).</text>
<text x="450" y="648" font-size="12" text-anchor="middle" fill="#666">Сверить: атлас Неттера — кости и суставы стопы, сагиттальный срез.</text>
</svg>
