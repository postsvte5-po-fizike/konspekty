<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="790" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Осмотр и пальпация области сердца: где искать толчки и пульсации</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#555">передняя грудная стенка, больной лицом к нам: его левая сторона — справа на рисунке</text>

  <!-- контур туловища -->
  <path d="M150 120 C 210 95, 330 92, 440 100 L 520 100 C 630 92, 750 95, 810 120 L 830 560 C 700 600, 260 600, 130 560 Z" fill="#fbfaf7" stroke="#444" stroke-width="2"/>

  <!-- ключицы -->
  <path d="M432 112 C 380 102, 300 98, 200 118" fill="none" stroke="#777" stroke-width="7" stroke-linecap="round"/>
  <path d="M528 112 C 580 102, 660 98, 760 118" fill="none" stroke="#777" stroke-width="7" stroke-linecap="round"/>
  <text x="250" y="96" font-size="12" fill="#666">ключица</text>

  <!-- рёбра I–VII (справа и слева от грудины) -->
  <g fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round">
    <path d="M435 135 C 400 138, 330 150, 250 172"/>  <path d="M525 135 C 560 138, 630 150, 710 172"/>
    <path d="M435 172 C 395 178, 320 195, 230 225"/>  <path d="M525 172 C 565 178, 640 195, 730 225"/>
    <path d="M435 212 C 395 220, 315 242, 215 280"/>  <path d="M525 212 C 565 220, 645 242, 745 280"/>
    <path d="M435 252 C 392 262, 312 290, 205 335"/>  <path d="M525 252 C 568 262, 648 290, 755 335"/>
    <path d="M435 292 C 392 304, 315 336, 205 388"/>  <path d="M525 292 C 568 304, 645 336, 755 388"/>
    <path d="M438 330 C 400 345, 330 380, 225 438"/>  <path d="M522 330 C 560 345, 630 380, 735 438"/>
    <path d="M445 362 C 415 380, 360 418, 270 480"/>  <path d="M515 362 C 545 380, 600 418, 690 480"/>
  </g>
  <g font-size="11.5" fill="#888">
    <text x="236" y="168">I</text><text x="214" y="222">II</text><text x="198" y="278">III</text><text x="186" y="334">IV</text><text x="186" y="388">V</text><text x="206" y="438">VI</text><text x="252" y="482">VII</text>
  </g>

  <!-- грудина -->
  <path d="M432 112 L 528 112 L 522 160 L 525 170 L 520 350 L 500 372 L 492 405 L 468 405 L 460 372 L 440 350 L 435 170 L 438 160 Z" fill="#e6e6e6" stroke="#777" stroke-width="2"/>
  <text x="480" y="250" text-anchor="middle" font-size="12" fill="#777" transform="rotate(-90 480 250)">грудина</text>
  <line x1="438" y1="166" x2="522" y2="166" stroke="#777" stroke-width="1.5"/>
  <rect x="536" y="148" width="132" height="16" fill="#fbfaf7"/><text x="540" y="160" font-size="11" fill="#777">угол грудины (II ребро)</text>

  <!-- срединно-ключичные линии -->
  <g stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="315" y1="104" x2="315" y2="535"/>
    <line x1="645" y1="104" x2="645" y2="535"/>
  </g>
  <text x="645" y="552" text-anchor="middle" font-size="12" fill="#3b6ea5">левая срединно-ключичная линия</text>
  <text x="315" y="552" text-anchor="middle" font-size="12" fill="#3b6ea5">правая срединно-ключичная линия</text>

  <!-- контур сердца (проекция) -->
  <path d="M448 192 C 425 215, 412 255, 418 290 C 422 315, 440 335, 470 345 C 520 358, 580 352, 618 338 C 600 300, 580 255, 548 225 C 535 210, 525 200, 515 192 Z" fill="#c0262d" fill-opacity="0.13" stroke="#c0262d" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="560" y="372" font-size="12" fill="#c0262d">проекция сердца</text>

  <!-- точки -->
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <!-- 1 ВТ: V межреберье, 1–1,5 см кнутри от левой СКЛ -->
    <circle cx="622" cy="330" r="15" fill="#c0262d"/><text x="622" y="335">1</text>
    <!-- 2 сердечный толчок: III–IV межреберье слева от грудины -->
    <ellipse cx="555" cy="262" rx="28" ry="20" fill="#d9822b" fill-opacity="0.85"/><text x="555" y="267">2</text>
    <!-- 3 аорта: II межреберье справа -->
    <circle cx="408" cy="193" r="14" fill="#7b3fa0"/><text x="408" y="198">3</text>
    <!-- 4 лёгочный ствол: II–III межреберье слева -->
    <circle cx="552" cy="195" r="14" fill="#2c4f9e"/><text x="552" y="200">4</text>
    <!-- 5 аневризма ЛЖ: III–IV межреберье слева -->
    <circle cx="598" cy="250" r="14" fill="#555"/><text x="598" y="255">5</text>
    <!-- 6 эпигастральная -->
    <ellipse cx="480" cy="438" rx="30" ry="16" fill="#2f8a4a"/><text x="480" y="443">6</text>
    <!-- 7 яремная ямка -->
    <circle cx="480" cy="98" r="13" fill="#7b3fa0"/><text x="480" y="103">7</text>
  </g>

  <!-- легенда -->
  <g font-size="13" fill="#222">
    <text x="40" y="622"><tspan font-weight="bold" fill="#c0262d">1</tspan> — верхушечный толчок: V межреберье, на 1–1,5 см кнутри от левой срединно-ключичной линии;</text>
    <text x="58" y="640">здесь же — диастолическое «кошачье мурлыканье» при митральном стенозе</text>
    <text x="40" y="662"><tspan font-weight="bold" fill="#d9822b">2</tspan> — сердечный толчок: III–IV межреберье слева от грудины (правый желудочек)</text>
    <text x="40" y="684"><tspan font-weight="bold" fill="#7b3fa0">3</tspan> — пульсация аорты: II межреберье справа; здесь же систолическое «кошачье мурлыканье» при стенозе устья аорты</text>
    <text x="40" y="706"><tspan font-weight="bold" fill="#2c4f9e">4</tspan> — пульсация лёгочного ствола: II–III межреберье слева (митральный стеноз, лёгочная гипертензия)</text>
    <text x="40" y="728"><tspan font-weight="bold" fill="#555">5</tspan> — пульсация аневризмы сердца после инфаркта: III–IV межреберье слева</text>
    <text x="40" y="750"><tspan font-weight="bold" fill="#2f8a4a">6</tspan> — эпигастральная пульсация: правый желудочек, брюшная аорта или печень; <tspan font-weight="bold" fill="#7b3fa0">7</tspan> — яремная ямка: дуга аорты</text>
  </g>
  <text x="920" y="780" text-anchor="end" font-size="11.5" fill="#888">Схема, не в масштабе. Сверить: Гребенев, гл. 6, с. 179–183; атлас Неттера — проекция сердца на грудную стенку.</text>
</svg>
