<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Алгоритм: от физикальных данных к синдрому</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#555">шаг 1 — перкуторный звук, шаг 2 — голосовое дрожание и бронхофония, шаг 3 — дыхание и побочные шумы</text>

  <!-- Корень -->
  <rect x="330" y="70" width="300" height="46" rx="8" fill="#1f4e79"/>
  <text x="480" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Сравнительная перкуссия: звук?</text>

  <!-- Ветви звука -->
  <line x1="400" y1="116" x2="190" y2="160" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="116" x2="760" y2="160" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="162" width="260" height="56" rx="8" fill="#f8cbad" stroke="#843c0c"/>
  <text x="190" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#843c0c">ПРИТУПЛЕНИЕ / ТУПОСТЬ</text>
  <text x="190" y="206" text-anchor="middle" font-size="12.5" fill="#222">воздуха в зоне меньше нормы</text>

  <rect x="640" y="162" width="260" height="56" rx="8" fill="#bdd7ee" stroke="#1f4e79"/>
  <text x="770" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">ТИМПАНИТ / КОРОБОЧНЫЙ</text>
  <text x="770" y="206" text-anchor="middle" font-size="12.5" fill="#222">воздуха в зоне больше нормы</text>

  <!-- Под притуплением -->
  <rect x="60" y="250" width="260" height="46" rx="8" fill="#ffffff" stroke="#843c0c" stroke-width="2"/>
  <text x="190" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#843c0c">Голосовое дрожание?</text>
  <line x1="190" y1="218" x2="190" y2="248" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <line x1="130" y1="296" x2="80" y2="340" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="250" y1="296" x2="320" y2="340" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="68" y="324" font-size="12.5" font-weight="bold" fill="#c00000">УСИЛЕНО</text>
  <text x="262" y="324" font-size="12.5" font-weight="bold" fill="#1f4e79">ОСЛАБЛЕНО</text>

  <rect x="10" y="342" width="215" height="150" rx="8" fill="#fde9d9" stroke="#c00000"/>
  <text x="117" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#c00000">Уплотнение лёгкого</text>
  <text x="117" y="384" text-anchor="middle" font-size="12" fill="#222">(бронх проходим)</text>
  <text x="22" y="408" font-size="12" fill="#222">• бронхиальное дыхание</text>
  <text x="22" y="426" font-size="12" fill="#222">• бронхофония усилена</text>
  <text x="22" y="444" font-size="12" fill="#222">• крепитация, влажные</text>
  <text x="22" y="460" font-size="12" fill="#222">  звучные хрипы</text>
  <text x="22" y="480" font-size="11.5" font-style="italic" fill="#843c0c">пневмония, инфаркт лёгкого</text>

  <rect x="235" y="342" width="225" height="150" rx="8" fill="#deebf7" stroke="#1f4e79"/>
  <text x="347" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">Жидкость в плевре</text>
  <text x="347" y="384" text-anchor="middle" font-size="12" fill="#222">или обтурационный ателектаз</text>
  <text x="247" y="408" font-size="12" fill="#222">• дыхание резко ослаблено</text>
  <text x="247" y="426" font-size="12" fill="#222">  или не проводится</text>
  <text x="247" y="444" font-size="12" fill="#222">• бронхофония ослаблена</text>
  <text x="247" y="462" font-size="12" fill="#222">• средостение: от выпота /</text>
  <text x="247" y="480" font-size="12" fill="#222">  к ателектазу</text>

  <!-- Под тимпанитом -->
  <rect x="640" y="250" width="260" height="46" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="770" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">Где и какой?</text>
  <line x1="770" y1="218" x2="770" y2="248" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <line x1="680" y1="296" x2="580" y2="340" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="296" x2="770" y2="340" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="296" x2="900" y2="340" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <rect x="470" y="342" width="190" height="150" rx="8" fill="#e2f0d9" stroke="#385723"/>
  <text x="565" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#385723">Коробочный,</text>
  <text x="565" y="382" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#385723">с обеих сторон</text>
  <text x="480" y="406" font-size="12" fill="#222">Эмфизема:</text>
  <text x="480" y="424" font-size="12" fill="#222">• дрожание ослаблено</text>
  <text x="480" y="442" font-size="12" fill="#222">• везикулярное ослаблено</text>
  <text x="480" y="460" font-size="12" fill="#222">• границы опущены,</text>
  <text x="480" y="478" font-size="12" fill="#222">  экскурсия мала</text>

  <rect x="670" y="342" width="140" height="150" rx="8" fill="#fff2cc" stroke="#b8860b"/>
  <text x="740" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f6000">Тимпанит</text>
  <text x="740" y="382" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f6000">ограниченный</text>
  <text x="680" y="406" font-size="12" fill="#222">Полость:</text>
  <text x="680" y="424" font-size="12" fill="#222">• дрожание ↑</text>
  <text x="680" y="442" font-size="12" fill="#222">• амфорическое</text>
  <text x="680" y="460" font-size="12" fill="#222">• звучные крупно-</text>
  <text x="680" y="478" font-size="12" fill="#222">  пузырчатые хрипы</text>

  <rect x="820" y="342" width="130" height="150" rx="8" fill="#ededed" stroke="#555"/>
  <text x="885" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">Тимпанит</text>
  <text x="885" y="382" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">на половине</text>
  <text x="828" y="406" font-size="12" fill="#222">Пневмоторакс:</text>
  <text x="828" y="424" font-size="12" fill="#222">• дрожание ↓</text>
  <text x="828" y="442" font-size="12" fill="#222">• дыхание резко</text>
  <text x="828" y="460" font-size="12" fill="#222">  ослаблено</text>
  <text x="828" y="478" font-size="12" fill="#222">• бронхофония ↓</text>

  <!-- Правило -->
  <rect x="40" y="524" width="880" height="150" rx="10" fill="#f2f2f2" stroke="#7f7f7f"/>
  <text x="480" y="550" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Главное правило (почему так)</text>
  <text x="60" y="578" font-size="13" fill="#222">• Голосовое дрожание и бронхофония — <tspan font-weight="bold">одно явление</tspan>: звук голоса идёт по бронхам и через ткань к стенке.</text>
  <text x="60" y="600" font-size="13" fill="#222">• <tspan font-weight="bold" fill="#c00000">Плотная безвоздушная ткань + проходимый бронх</tspan> проводит лучше → дрожание, бронхофония ↑, дыхание бронхиальное.</text>
  <text x="60" y="622" font-size="13" fill="#222">• <tspan font-weight="bold" fill="#1f4e79">Преграда между лёгким и стенкой</tspan> (жидкость, воздух в плевре) или закрытый бронх → всё ↓.</text>
  <text x="60" y="644" font-size="13" fill="#222">• Перкуссия отвечает на вопрос «сколько воздуха», а дрожание — «проводит ли ткань звук».</text>
  <text x="60" y="664" font-size="12" font-style="italic" fill="#555">По материалу кафедры «Синдромы при патологии органов дыхания» и Гребеневу, гл. 5. Не в масштабе.</text>
</svg>
