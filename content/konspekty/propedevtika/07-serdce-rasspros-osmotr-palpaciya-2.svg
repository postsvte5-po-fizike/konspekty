<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Сфигмограммы: как «выглядит» пульс под пальцами</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#555">по оси X — время (два сердечных цикла), по оси Y — растяжение стенки артерии; по Гребеневу, рис. 47</text>

  <!-- оси -->
  <g stroke="#bbb" stroke-width="1">
    <line x1="40" y1="300" x2="310" y2="300"/><line x1="345" y1="300" x2="615" y2="300"/><line x1="650" y1="300" x2="920" y2="300"/>
  </g>

  <!-- а: норма -->
  <path d="M45 300 L 70 300 C 78 260, 84 205, 92 195 C 100 190, 108 205, 118 225 C 124 238, 128 246, 134 244 C 140 242, 144 246, 150 255 C 165 278, 185 296, 205 300
           L 205 300 C 213 260, 219 205, 227 195 C 235 190, 243 205, 253 225 C 259 238, 263 246, 269 244 C 275 242, 279 246, 285 255 C 297 278, 305 296, 310 300"
        fill="none" stroke="#2c4f9e" stroke-width="3"/>
  <g font-size="12" fill="#2c4f9e">
    <line x1="80" y1="250" x2="58" y2="170" stroke="#2c4f9e" stroke-width="1"/><text x="40" y="164">анакрота</text>
    <line x1="112" y1="215" x2="150" y2="150" stroke="#2c4f9e" stroke-width="1"/><text x="140" y="144">катакрота</text>
    <line x1="134" y1="244" x2="178" y2="210" stroke="#2c4f9e" stroke-width="1"/><text x="168" y="204">дикротическая волна</text>
  </g>
  <text x="175" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">а) нормальный пульс</text>
  <text x="175" y="352" text-anchor="middle" font-size="13" font-style="italic" fill="#2c4f9e">pulsus regularis, aequalis</text>
  <text x="175" y="372" text-anchor="middle" font-size="12.5" fill="#444">крутая анакрота, пологая катакрота,</text>
  <text x="175" y="389" text-anchor="middle" font-size="12.5" fill="#444">небольшая дикротическая волна</text>

  <!-- б: скорый и высокий -->
  <path d="M350 300 L 365 300 C 370 220, 374 110, 380 100 C 386 95, 391 200, 398 285 C 403 296, 420 300, 500 300
           L 500 300 C 505 220, 509 110, 515 100 C 521 95, 526 200, 533 285 C 538 296, 560 300, 615 300"
        fill="none" stroke="#c0262d" stroke-width="3"/>
  <text x="480" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">б) скорый и высокий</text>
  <text x="480" y="352" text-anchor="middle" font-size="13" font-style="italic" fill="#c0262d">pulsus celer et altus</text>
  <text x="480" y="372" text-anchor="middle" font-size="12.5" fill="#444">резкий подъём и такой же резкий спад, большая амплитуда:</text>
  <text x="480" y="389" text-anchor="middle" font-size="12.5" fill="#444">недостаточность клапана аорты (меньше — тиреотоксикоз)</text>

  <!-- в: медленный и малый -->
  <path d="M655 300 L 670 300 C 690 285, 715 245, 735 240 C 752 238, 770 260, 795 300
           L 795 300 C 815 285, 840 245, 860 240 C 877 238, 895 260, 920 300"
        fill="none" stroke="#2f8a4a" stroke-width="3"/>
  <text x="785" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">в) медленный и малый</text>
  <text x="785" y="352" text-anchor="middle" font-size="13" font-style="italic" fill="#2f8a4a">pulsus tardus et parvus</text>
  <text x="785" y="372" text-anchor="middle" font-size="12.5" fill="#444">пологий подъём, малая амплитуда:</text>
  <text x="785" y="389" text-anchor="middle" font-size="12.5" fill="#444">стеноз устья аорты</text>

  <text x="920" y="418" text-anchor="end" font-size="11.5" fill="#888">Схема, не в масштабе. Сверить: Гребенев, гл. 6, рис. 46–47.</text>
</svg>
