<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Типы дыхания: запись дыхательных движений (спирограмма), схематично</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#555">вверх — вдох, вниз — выдох; высота волны — глубина; ровная линия — пауза (апноэ)</text>

  <g font-size="14" font-weight="bold" fill="#1f4e79">
    <text x="30" y="92">Норма</text>
    <text x="30" y="182">Куссмауля</text>
    <text x="30" y="272">Чейна — Стокса</text>
    <text x="30" y="362">Биота</text>
    <text x="30" y="452">Грокко</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="30" y="110">16–20 в мин, ровно</text>
    <text x="30" y="200">редкое, глубокое, шумное</text>
    <text x="30" y="290">нарастание → убывание → пауза</text>
    <text x="30" y="380">одинаковые глубокие + паузы</text>
    <text x="30" y="470">волна без паузы</text>
  </g>

  <g fill="none" stroke-width="2.5">
    <!-- Норма: равномерные волны амплитуда 14 -->
    <path stroke="#385723" d="M240,95 q15,-14 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0"/>
    <!-- Куссмауль: редкие глубокие -->
    <path stroke="#c00000" d="M240,185 q35,-40 70,0 t70,0 t70,0 t70,0 t70,0 t70,0 t70,0 t70,0 t70,0"/>
    <!-- Чейн-Стокс: нарастание и убывание, затем пауза -->
    <path stroke="#7030a0" d="M240,275 q10,-4 20,0 q10,4 20,0 q10,-10 20,0 q10,10 20,0 q10,-18 20,0 q10,18 20,0 q10,-28 20,0 q10,28 20,0 q10,-18 20,0 q10,18 20,0 q10,-10 20,0 q10,10 20,0 q10,-4 20,0 q10,4 20,0 L600,275 q10,-4 20,0 q10,4 20,0 q10,-10 20,0 q10,10 20,0 q10,-18 20,0 q10,18 20,0 q10,-28 20,0 q10,28 20,0 q10,-18 20,0 q10,18 20,0 q10,-10 20,0 q10,10 20,0 q10,-4 20,0 q10,4 20,0 L880,275 L920,275"/>
    <!-- Биот: одинаковые глубокие и паузы -->
    <path stroke="#c55a11" d="M240,365 q12,-22 24,0 q12,22 24,0 q12,-22 24,0 q12,22 24,0 q12,-22 24,0 q12,22 24,0 L410,365 L480,365 q12,-22 24,0 q12,22 24,0 q12,-22 24,0 q12,22 24,0 q12,-22 24,0 q12,22 24,0 L650,365 L720,365 q12,-22 24,0 q12,22 24,0 q12,-22 24,0 q12,22 24,0 q12,-22 24,0 q12,22 24,0 L920,365"/>
    <!-- Грокко: волна без паузы, между — мелкое дыхание -->
    <path stroke="#1f4e79" d="M240,455 q10,-4 20,0 q10,4 20,0 q10,-12 20,0 q10,12 20,0 q10,-22 20,0 q10,22 20,0 q10,-12 20,0 q10,12 20,0 q10,-4 20,0 q10,4 20,0 q10,-3 20,0 q10,3 20,0 q10,-3 20,0 q10,3 20,0 q10,-4 20,0 q10,4 20,0 q10,-12 20,0 q10,12 20,0 q10,-22 20,0 q10,22 20,0 q10,-12 20,0 q10,12 20,0 q10,-4 20,0 q10,4 20,0 q10,-3 20,0 q10,3 20,0 q10,-3 20,0 q10,3 20,0 q10,-4 20,0"/>
  </g>
  <g font-size="11" fill="#7030a0" text-anchor="middle">
    <text x="560" y="300">пауза</text>
    <text x="900" y="300">пауза</text>
  </g>
  <g font-size="11" fill="#c55a11" text-anchor="middle">
    <text x="445" y="390">пауза</text>
    <text x="685" y="390">пауза</text>
  </g>
  <text x="480" y="530" text-anchor="middle" font-size="12" fill="#555">По Гребеневу, гл. 5, с. 104–107, рис. 14 (перерисовано упрощённо). Чейна — Стокса, Биота и Грокко — «периодическое» дыхание.</text>
</svg>
