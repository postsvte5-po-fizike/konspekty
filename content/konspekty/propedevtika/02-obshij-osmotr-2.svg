<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="640" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Типы температурных кривых</text>
  <text x="460" y="50" text-anchor="middle" font-size="13" fill="#555">точки — утро (у) и вечер (в), 4 дня; пунктир — 37 °C; схематично</text>

  <defs>
    <g id="grid">
      <rect x="0" y="0" width="380" height="200" fill="#fafafa" stroke="#bbb"/>
      <line x1="0" y1="40" x2="380" y2="40" stroke="#e3e3e3"/>
      <line x1="0" y1="80" x2="380" y2="80" stroke="#e3e3e3"/>
      <line x1="0" y1="120" x2="380" y2="120" stroke="#e3e3e3"/>
      <line x1="0" y1="160" x2="380" y2="160" stroke="#e3e3e3"/>
      <line x1="0" y1="160" x2="380" y2="160" stroke="#c55a11" stroke-dasharray="5,4" stroke-width="1.5"/>
      <g font-size="11" fill="#777" text-anchor="end">
        <text x="-6" y="4">41</text><text x="-6" y="44">40</text><text x="-6" y="84">39</text><text x="-6" y="124">38</text><text x="-6" y="164">37</text><text x="-6" y="204">36</text>
      </g>
      <g font-size="10.5" fill="#777" text-anchor="middle">
        <text x="30" y="216">у</text><text x="75" y="216">в</text><text x="125" y="216">у</text><text x="170" y="216">в</text><text x="220" y="216">у</text><text x="265" y="216">в</text><text x="315" y="216">у</text><text x="360" y="216">в</text>
      </g>
    </g>
  </defs>
  <!-- y: 41 -> 0, 36 -> 200; 1 °C = 40 px -->

  <!-- 1 постоянная -->
  <g transform="translate(60,90)">
    <use href="#grid"/>
    <text x="0" y="-12" font-size="15" font-weight="bold" fill="#1f4e79">1. Постоянная (continua)</text>
    <polyline points="30,72 75,52 125,68 170,48 220,72 265,56 315,64 360,48" fill="none" stroke="#c00000" stroke-width="2.5"/>
    <g fill="#c00000"><circle cx="30" cy="72" r="4"/><circle cx="75" cy="52" r="4"/><circle cx="125" cy="68" r="4"/><circle cx="170" cy="48" r="4"/><circle cx="220" cy="72" r="4"/><circle cx="265" cy="56" r="4"/><circle cx="315" cy="64" r="4"/><circle cx="360" cy="48" r="4"/></g>
    <text x="0" y="242" font-size="12.5" fill="#222">высокая, колебания ≤ 1 °C — крупозная пневмония</text>
  </g>

  <!-- 2 послабляющая -->
  <g transform="translate(500,90)">
    <use href="#grid"/>
    <text x="0" y="-12" font-size="15" font-weight="bold" fill="#1f4e79">2. Послабляющая (remittens)</text>
    <polyline points="30,124 75,60 125,118 170,52 220,128 265,64 315,120 360,56" fill="none" stroke="#c00000" stroke-width="2.5"/>
    <g fill="#c00000"><circle cx="30" cy="124" r="4"/><circle cx="75" cy="60" r="4"/><circle cx="125" cy="118" r="4"/><circle cx="170" cy="52" r="4"/><circle cx="220" cy="128" r="4"/><circle cx="265" cy="64" r="4"/><circle cx="315" cy="120" r="4"/><circle cx="360" cy="56" r="4"/></g>
    <text x="0" y="242" font-size="12.5" fill="#222">колебания &gt; 1 °C, минимум выше 37 °C — очаговая пневмония</text>
  </g>

  <!-- 3 перемежающаяся -->
  <g transform="translate(60,380)">
    <use href="#grid"/>
    <text x="0" y="-12" font-size="15" font-weight="bold" fill="#1f4e79">3. Перемежающаяся (intermittens)</text>
    <polyline points="30,168 75,40 125,170 170,166 220,164 265,36 315,170 360,168" fill="none" stroke="#c00000" stroke-width="2.5"/>
    <g fill="#c00000"><circle cx="30" cy="168" r="4"/><circle cx="75" cy="40" r="4"/><circle cx="125" cy="170" r="4"/><circle cx="170" cy="166" r="4"/><circle cx="220" cy="164" r="4"/><circle cx="265" cy="36" r="4"/><circle cx="315" cy="170" r="4"/><circle cx="360" cy="168" r="4"/></g>
    <text x="0" y="242" font-size="12.5" fill="#222">подъёмы с падением до нормы, через 1–2 дня — малярия</text>
  </g>

  <!-- 4 гектическая -->
  <g transform="translate(500,380)">
    <use href="#grid"/>
    <text x="0" y="-12" font-size="15" font-weight="bold" fill="#1f4e79">4. Гектическая (hectica)</text>
    <polyline points="30,184 75,48 125,190 170,44 220,186 265,50 315,192 360,46" fill="none" stroke="#c00000" stroke-width="2.5"/>
    <g fill="#c00000"><circle cx="30" cy="184" r="4"/><circle cx="75" cy="48" r="4"/><circle cx="125" cy="190" r="4"/><circle cx="170" cy="44" r="4"/><circle cx="220" cy="186" r="4"/><circle cx="265" cy="50" r="4"/><circle cx="315" cy="192" r="4"/><circle cx="360" cy="46" r="4"/></g>
    <text x="0" y="242" font-size="12.5" fill="#222">размах 2–4 °C ежедневно, проливной пот — сепсис</text>
  </g>
</svg>
