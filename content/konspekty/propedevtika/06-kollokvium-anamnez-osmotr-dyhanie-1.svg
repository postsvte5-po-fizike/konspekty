<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Порядок обследования больного = порядок ответа на коллоквиуме</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#555">по схеме истории болезни методички кафедры (ЧувГУ, 2005); в скобках — номера экзаменационных вопросов</text>

  <!-- Колонка 1: субъективное -->
  <rect x="30" y="80" width="260" height="36" rx="6" fill="#1f4e79"/>
  <text x="160" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">I. РАССПРОС (субъективно)</text>

  <rect x="30" y="130" width="260" height="58" rx="6" fill="#deebf7" stroke="#1f4e79"/>
  <text x="44" y="152" font-size="14" font-weight="bold" fill="#1f4e79">1. Паспортная часть</text>
  <text x="44" y="172" font-size="12.5" fill="#222">ФИО, возраст, профессия, даты, диагноз</text>

  <rect x="30" y="200" width="260" height="78" rx="6" fill="#deebf7" stroke="#1f4e79"/>
  <text x="44" y="222" font-size="14" font-weight="bold" fill="#1f4e79">2. Жалобы (8)</text>
  <text x="44" y="242" font-size="12.5" fill="#222">основные → детализация</text>
  <text x="44" y="260" font-size="12.5" fill="#222">дополнительные — опрос по системам</text>

  <rect x="30" y="290" width="260" height="78" rx="6" fill="#deebf7" stroke="#1f4e79"/>
  <text x="44" y="312" font-size="14" font-weight="bold" fill="#1f4e79">3. Anamnesis morbi (2)</text>
  <text x="44" y="332" font-size="12.5" fill="#222">когда, как началось, течение,</text>
  <text x="44" y="350" font-size="12.5" fill="#222">обследование, лечение, ухудшение</text>

  <rect x="30" y="380" width="260" height="98" rx="6" fill="#deebf7" stroke="#1f4e79"/>
  <text x="44" y="402" font-size="14" font-weight="bold" fill="#1f4e79">4. Anamnesis vitae (2)</text>
  <text x="44" y="422" font-size="12.5" fill="#222">биография, быт, труд, болезни,</text>
  <text x="44" y="440" font-size="12.5" fill="#222">эпид-, наследственный, аллерго-,</text>
  <text x="44" y="458" font-size="12.5" fill="#222">гемотрансфузионный, привычки</text>

  <line x1="160" y1="188" x2="160" y2="198" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="160" y1="278" x2="160" y2="288" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="160" y1="368" x2="160" y2="378" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Колонка 2: общий осмотр -->
  <rect x="320" y="80" width="260" height="36" rx="6" fill="#7b3f00"/>
  <text x="450" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">II. ОБЩИЙ ОСМОТР (3–7)</text>

  <rect x="320" y="130" width="260" height="348" rx="6" fill="#fbe5d6" stroke="#7b3f00"/>
  <text x="334" y="154" font-size="13" fill="#222">1. Общее состояние</text>
  <text x="334" y="180" font-size="13" fill="#222">2. Сознание (4)</text>
  <text x="334" y="206" font-size="13" fill="#222">3. Положение (3)</text>
  <text x="334" y="232" font-size="13" fill="#222">4. Телосложение, рост, масса (3)</text>
  <text x="334" y="258" font-size="13" fill="#222">5. Температура (7)</text>
  <text x="334" y="284" font-size="13" fill="#222">6. Лицо, голова, глаза, шея (5)</text>
  <text x="334" y="310" font-size="13" fill="#222">7. Кожа и слизистые (3)</text>
  <text x="334" y="336" font-size="13" fill="#222">8. Подкожная клетчатка, отёки (6)</text>
  <text x="334" y="362" font-size="13" fill="#222">9. Лимфатические узлы (6)</text>
  <text x="334" y="388" font-size="13" fill="#222">10. Мышцы, кости, суставы</text>
  <text x="334" y="424" font-size="12" font-style="italic" fill="#7b3f00">«сверху вниз, от общего</text>
  <text x="334" y="442" font-size="12" font-style="italic" fill="#7b3f00">к частному», при дневном свете</text>

  <!-- Колонка 3: органы дыхания -->
  <rect x="610" y="80" width="260" height="36" rx="6" fill="#385723"/>
  <text x="740" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">III. ОРГАНЫ ДЫХАНИЯ (9–18)</text>

  <rect x="610" y="130" width="260" height="58" rx="6" fill="#e2f0d9" stroke="#385723"/>
  <text x="624" y="152" font-size="14" font-weight="bold" fill="#385723">1. Осмотр (9, 11)</text>
  <text x="624" y="172" font-size="12.5" fill="#222">форма ГК, тип, ЧДД, ритм, глубина</text>

  <rect x="610" y="200" width="260" height="58" rx="6" fill="#e2f0d9" stroke="#385723"/>
  <text x="624" y="222" font-size="14" font-weight="bold" fill="#385723">2. Пальпация (10)</text>
  <text x="624" y="242" font-size="12.5" fill="#222">резистентность, голосовое дрожание</text>

  <rect x="610" y="270" width="260" height="78" rx="6" fill="#e2f0d9" stroke="#385723"/>
  <text x="624" y="292" font-size="14" font-weight="bold" fill="#385723">3. Перкуссия (12, 13)</text>
  <text x="624" y="312" font-size="12.5" fill="#222">сравнительная → характер звука</text>
  <text x="624" y="330" font-size="12.5" fill="#222">топографическая → границы, экскурсия</text>

  <rect x="610" y="360" width="260" height="118" rx="6" fill="#e2f0d9" stroke="#385723"/>
  <text x="624" y="382" font-size="14" font-weight="bold" fill="#385723">4. Аускультация (14–18)</text>
  <text x="624" y="402" font-size="12.5" fill="#222">основной шум: везикулярное /</text>
  <text x="624" y="420" font-size="12.5" fill="#222">бронхиальное; побочные: хрипы,</text>
  <text x="624" y="438" font-size="12.5" fill="#222">крепитация, шум трения плевры;</text>
  <text x="624" y="456" font-size="12.5" fill="#222">бронхофония</text>

  <line x1="740" y1="188" x2="740" y2="198" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="258" x2="740" y2="268" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="348" x2="740" y2="358" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <line x1="292" y1="300" x2="316" y2="300" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="582" y1="300" x2="606" y2="300" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Итог -->
  <line x1="450" y1="480" x2="450" y2="518" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="480" x2="560" y2="522" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="160" y1="480" x2="340" y2="522" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="524" width="500" height="64" rx="8" fill="#fff2cc" stroke="#b8860b" stroke-width="2"/>
  <text x="450" y="550" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f6000">СИНДРОМ → предварительный диагноз</text>
  <text x="450" y="572" text-anchor="middle" font-size="13" fill="#222">сопоставить жалобы + осмотр + пальпацию + перкуссию + аускультацию</text>

  <text x="450" y="618" text-anchor="middle" font-size="12" fill="#666">Каждая находка описывается с указанием стороны, топографической области, межреберья и линии.</text>
</svg>
