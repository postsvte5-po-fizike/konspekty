<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Где образуются дыхательные шумы: от гортани до плевры (схема)</title>
  <defs>
    <linearGradient id="lung" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf0ef"/>
      <stop offset="100%" stop-color="#f6dcda"/>
    </linearGradient>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
      <circle cx="5" cy="5" r="4" fill="#1b1e23"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1e23">Где рождается звук → какой шум мы слышим</text>

  <!-- лёгкое (правое, схематично) с плеврой -->
  <path d="M470 150 C420 150 360 200 340 290 C320 380 330 470 370 520 C410 560 520 566 580 540
           C610 520 618 470 612 400 C606 320 590 230 560 185 C540 158 505 150 470 150 Z"
        fill="url(#lung)" stroke="#c97a73" stroke-width="2"/>
  <!-- плевра: париетальный листок -->
  <path d="M470 138 C412 138 346 192 326 288 C305 386 316 480 360 532 C404 578 526 584 592 552
           C626 530 634 474 626 398 C620 316 602 222 568 176 C546 146 508 138 470 138 Z"
        fill="none" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="10 5"/>

  <!-- гортань и трахея -->
  <path d="M488 44 C478 44 474 52 474 60 L474 78 C474 86 480 92 488 92 L512 92 C520 92 526 86 526 78 L526 60 C526 52 522 44 512 44 Z"
        fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <path d="M490 62 Q500 70 510 62" fill="none" stroke="#495057" stroke-width="2"/>
  <path d="M488 92 L488 150 M512 92 L512 150" stroke="#495057" stroke-width="3" fill="none"/>
  <path d="M500 150 C500 170 498 190 496 212" fill="none" stroke="#495057" stroke-width="12" stroke-linecap="round"/>
  <text x="512" y="190" font-size="11" fill="#495057">главный бронх</text>
  <g stroke="#adb5bd" stroke-width="2"><line x1="488" y1="106" x2="512" y2="106"/><line x1="488" y1="122" x2="512" y2="122"/><line x1="488" y1="138" x2="512" y2="138"/></g>

  <!-- крупные бронхи -->
  <path d="M496 212 C486 222 466 228 440 236 C420 244 404 262 396 290" fill="none" stroke="#495057" stroke-width="9" stroke-linecap="round"/>
  <path d="M496 212 C512 222 532 230 548 244 C560 258 566 280 566 300" fill="none" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
  <!-- средние бронхи -->
  <g fill="none" stroke="#495057" stroke-width="4.5" stroke-linecap="round">
    <path d="M440 230 C420 228 396 232 378 246"/>
    <path d="M396 290 C384 320 380 350 384 382"/>
    <path d="M396 290 C412 318 430 340 452 356"/>
    <path d="M548 240 C570 236 588 244 598 262"/>
    <path d="M566 300 C572 336 572 370 566 404"/>
  </g>
  <!-- мелкие бронхи и бронхиолы -->
  <g fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round">
    <path d="M384 382 C378 408 380 430 390 452"/><path d="M384 382 C396 404 410 420 428 430"/>
    <path d="M452 356 C470 372 480 392 484 414"/><path d="M452 356 C476 356 494 364 508 378"/>
    <path d="M566 404 C556 430 548 450 536 468"/><path d="M566 404 C582 426 590 450 592 474"/>
    <path d="M378 246 C364 258 356 274 352 292"/><path d="M598 262 C604 282 606 302 604 322"/>
  </g>
  <!-- ацинусы (гроздья альвеол) -->
  <g fill="#fff5f5" stroke="#e03131" stroke-width="1.4">
    <circle cx="390" cy="458" r="7"/><circle cx="399" cy="466" r="6"/><circle cx="383" cy="468" r="6"/>
    <circle cx="433" cy="434" r="7"/><circle cx="441" cy="442" r="6"/><circle cx="428" cy="444" r="6"/>
    <circle cx="486" cy="420" r="7"/><circle cx="494" cy="428" r="6"/><circle cx="480" cy="430" r="6"/>
    <circle cx="534" cy="474" r="7"/><circle cx="526" cy="482" r="6"/><circle cx="542" cy="483" r="6"/>
    <circle cx="592" cy="480" r="7"/><circle cx="600" cy="488" r="6"/><circle cx="585" cy="490" r="6"/>
    <circle cx="512" cy="382" r="6"/><circle cx="352" cy="298" r="6"/><circle cx="604" cy="328" r="6"/>
  </g>

  <!-- ===== подписи слева ===== -->
  <g font-size="13.5">
    <!-- гортань -->
    <path d="M472 66 L272 66" stroke="#1b1e23" stroke-width="1" marker-end="url(#dot)"/>
    <rect x="20" y="46" width="252" height="44" rx="8" fill="#e7f5ff" stroke="#1c7ed6"/>
    <text x="32" y="65" font-weight="bold" fill="#1864ab">Гортань (голосовая щель)</text>
    <text x="32" y="82" fill="#1b1e23">бронхиальное дыхание</text>

    <!-- крупные бронхи -->
    <path d="M430 236 L272 180" stroke="#1b1e23" stroke-width="1" marker-end="url(#dot)"/>
    <rect x="20" y="152" width="252" height="62" rx="8" fill="#f8f9fa" stroke="#495057"/>
    <text x="32" y="171" font-weight="bold" fill="#343a40">Крупные бронхи</text>
    <text x="32" y="188" fill="#1b1e23">сухие жужжащие (басовые) хрипы</text>
    <text x="32" y="205" fill="#1b1e23">крупнопузырчатые влажные</text>

    <!-- мелкие бронхи -->
    <path d="M386 400 L272 300" stroke="#1b1e23" stroke-width="1" marker-end="url(#dot)"/>
    <rect x="20" y="268" width="252" height="62" rx="8" fill="#f8f9fa" stroke="#495057"/>
    <text x="32" y="287" font-weight="bold" fill="#343a40">Мелкие бронхи, бронхиолы</text>
    <text x="32" y="304" fill="#1b1e23">сухие свистящие хрипы</text>
    <text x="32" y="321" fill="#1b1e23">мелкопузырчатые влажные</text>

    <!-- альвеолы -->
    <path d="M384 466 L272 420" stroke="#1b1e23" stroke-width="1" marker-end="url(#dot)"/>
    <rect x="20" y="386" width="252" height="62" rx="8" fill="#fff5f5" stroke="#e03131"/>
    <text x="32" y="405" font-weight="bold" fill="#c92a2a">Альвеолы</text>
    <text x="32" y="422" fill="#1b1e23">везикулярное дыхание</text>
    <text x="32" y="439" fill="#1b1e23">крепитация (высота вдоха)</text>
  </g>

  <!-- ===== подписи справа ===== -->
  <g font-size="13.5">
    <path d="M630 420 L736 470" stroke="#1b1e23" stroke-width="1" marker-end="url(#dot)"/>
    <rect x="736" y="440" width="252" height="62" rx="8" fill="#ebfbee" stroke="#2f9e44"/>
    <text x="748" y="459" font-weight="bold" fill="#2b8a3e">Плевра (листки)</text>
    <text x="748" y="476" fill="#1b1e23">шум трения плевры</text>
    <text x="748" y="493" fill="#1b1e23">вдох + выдох, «у самого уха»</text>

    <rect x="736" y="150" width="252" height="120" rx="8" fill="#fff9db" stroke="#f08c00"/>
    <text x="748" y="170" font-weight="bold" fill="#e67700">Меняют звук на пути к уху</text>
    <text x="748" y="190" fill="#1b1e23">уплотнение ткани → проводит</text>
    <text x="748" y="207" fill="#1b1e23">бронхиальное, хрипы звучные</text>
    <text x="748" y="227" fill="#1b1e23">жидкость / воздух в плевре →</text>
    <text x="748" y="244" fill="#1b1e23">гасят: дыхание ослаблено</text>
    <text x="748" y="261" fill="#1b1e23">или не слышно</text>

    <rect x="736" y="300" width="252" height="100" rx="8" fill="#f3f0ff" stroke="#6741d9"/>
    <text x="748" y="320" font-weight="bold" fill="#5f3dc4">Полость + бронх</text>
    <text x="748" y="340" fill="#1b1e23">амфорическое дыхание</text>
    <text x="748" y="360" fill="#1b1e23">открытый пневмоторакс →</text>
    <text x="748" y="377" fill="#1b1e23">металлический оттенок</text>
  </g>

  <text x="500" y="604" text-anchor="middle" font-size="12" fill="#6c717a">Схема, не в масштабе: одно лёгкое, ветвление бронхов упрощено; зелёный пунктир — плевра</text>
</svg>
