<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Голосовое дрожание: где класть ладони</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#555">всегда парой — справа и симметрично слева; области — по методичке кафедры</text>

  <!-- ВИД СПЕРЕДИ -->
  <g transform="translate(240,0)">
    <text x="0" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Спереди</text>
    <path d="M-150,120 C-160,200 -158,330 -140,470 L140,470 C158,330 160,200 150,120 C120,100 60,96 0,98 C-60,96 -120,100 -150,120 Z" fill="#fafafa" stroke="#444" stroke-width="2"/>
    <!-- ключицы -->
    <path d="M-12,118 C-50,112 -95,112 -132,124" fill="none" stroke="#777" stroke-width="5" stroke-linecap="round"/>
    <path d="M12,118 C50,112 95,112 132,124" fill="none" stroke="#777" stroke-width="5" stroke-linecap="round"/>
    <!-- грудина -->
    <rect x="-11" y="120" width="22" height="170" rx="6" fill="#d9d9d9" stroke="#888"/>
    <!-- рёберные дуги -->
    <path d="M0,292 C-40,320 -90,350 -135,370" fill="none" stroke="#aaa" stroke-width="2"/>
    <path d="M0,292 C40,320 90,350 135,370" fill="none" stroke="#aaa" stroke-width="2"/>
    <!-- сердце (зона) -->
    <path d="M10,230 C40,215 85,235 95,275 C90,300 55,310 20,300 Z" fill="#f4cccc" stroke="#cc6666" stroke-dasharray="3,3"/>
    <text x="58" y="275" font-size="10.5" fill="#a33" text-anchor="middle">сердце</text>
    <!-- точки: 1 надключичные, 2 подключичные, 3 подмышечные -->
    <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="-75" cy="100" r="13" fill="#1f4e79"/><text x="-75" y="105">1</text>
      <circle cx="75" cy="100" r="13" fill="#1f4e79"/><text x="75" y="105">1</text>
      <circle cx="-75" cy="160" r="13" fill="#1f4e79"/><text x="-75" y="165">2</text>
      <circle cx="75" cy="160" r="13" fill="#1f4e79"/><text x="75" y="165">2</text>
      <circle cx="-128" cy="250" r="13" fill="#385723"/><text x="-128" y="255">3</text>
      <circle cx="128" cy="250" r="13" fill="#385723"/><text x="128" y="255">3</text>
    </g>
    <line x1="-62" y1="160" x2="62" y2="160" stroke="#1f4e79" stroke-dasharray="4,4"/>
    <line x1="-115" y1="250" x2="115" y2="250" stroke="#385723" stroke-dasharray="4,4"/>
    <text x="-110" y="500" font-size="12" fill="#555">правая</text>
    <text x="110" y="500" font-size="12" fill="#555" text-anchor="end">левая</text>
  </g>

  <!-- ВИД СЗАДИ -->
  <g transform="translate(640,0)">
    <text x="0" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Сзади</text>
    <path d="M-150,120 C-160,200 -158,330 -140,470 L140,470 C158,330 160,200 150,120 C120,100 60,96 0,98 C-60,96 -120,100 -150,120 Z" fill="#fafafa" stroke="#444" stroke-width="2"/>
    <!-- лопатки -->
    <path d="M-120,140 L-35,132 L-50,300 Z" fill="none" stroke="#999" stroke-width="2"/>
    <path d="M120,140 L35,132 L50,300 Z" fill="none" stroke="#999" stroke-width="2"/>
    <line x1="-118" y1="160" x2="-38" y2="150" stroke="#999" stroke-width="2"/>
    <line x1="118" y1="160" x2="38" y2="150" stroke="#999" stroke-width="2"/>
    <!-- позвоночник -->
    <line x1="0" y1="100" x2="0" y2="470" stroke="#bbb" stroke-width="10" stroke-dasharray="14,4"/>
    <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="-82" cy="122" r="13" fill="#7030a0"/><text x="-82" y="127">4</text>
      <circle cx="82" cy="122" r="13" fill="#7030a0"/><text x="82" y="127">4</text>
      <circle cx="-22" cy="200" r="13" fill="#c55a11"/><text x="-22" y="205">5</text>
      <circle cx="22" cy="200" r="13" fill="#c55a11"/><text x="22" y="205">5</text>
      <circle cx="-78" cy="350" r="13" fill="#c00000"/><text x="-78" y="355">6</text>
      <circle cx="78" cy="350" r="13" fill="#c00000"/><text x="78" y="355">6</text>
    </g>
    <line x1="-65" y1="350" x2="65" y2="350" stroke="#c00000" stroke-dasharray="4,4"/>
    <text x="-110" y="500" font-size="12" fill="#555">левая</text>
    <text x="110" y="500" font-size="12" fill="#555" text-anchor="end">правая</text>
  </g>

  <!-- легенда -->
  <g font-size="12.5" fill="#222">
    <text x="480" y="528" text-anchor="middle">1 — надключичные · 2 — подключичные · 3 — подмышечные (руки за голову)</text><text x="480" y="548" text-anchor="middle">4 — надлопаточные · 5 — межлопаточные (руки скрещены на груди) · 6 — подлопаточные</text>
  </g>
</svg>
