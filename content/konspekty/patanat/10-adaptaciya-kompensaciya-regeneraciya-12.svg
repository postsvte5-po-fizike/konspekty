<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520">
<title>Гипертрофия миокарда: компенсация и декомпенсация</title>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap'); text { font-family: Onest, 'PT Sans', 'Helvetica Neue', Arial, sans-serif; }</style>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#444"/></marker>
</defs>
<rect width="960" height="520" fill="#fff"/>
<text x="480.0" y="34.0" font-size="20" font-weight="700" fill="#1f1f1f" text-anchor="middle">Гипертрофия миокарда левого желудочка: от компенсации к декомпенсации</text>
<text x="480.0" y="58.0" font-size="13.5" font-weight="400" fill="#666" text-anchor="middle">поперечный срез желудочков сердца; схема, не в масштабе</text>
<circle cx="129.3" cy="225" r="63.3" fill="#c9715f" stroke="#8e4335" stroke-width="1.6"/>
<circle cx="131.4" cy="225" r="56.3" fill="#fdf1ec" stroke="#8e4335" stroke-width="1.2"/>
<circle cx="170" cy="225" r="74" fill="#c9715f" stroke="#8e4335" stroke-width="1.8"/>
<circle cx="170" cy="225" r="46" fill="#fdf1ec" stroke="#8e4335" stroke-width="1.4"/>
<ellipse cx="203.6" cy="248.5" rx="9" ry="16" transform="rotate(125 203.6 248.5)" fill="#c9715f" stroke="#8e4335" stroke-width="1.2"/>
<ellipse cx="136.4" cy="248.5" rx="9" ry="16" transform="rotate(235 136.4 248.5)" fill="#c9715f" stroke="#8e4335" stroke-width="1.2"/>
<text x="170.0" y="230.0" font-size="15" font-weight="700" fill="#8e4335" text-anchor="middle">ЛЖ</text>
<text x="87.0" y="230.0" font-size="13" font-weight="700" fill="#8e4335" text-anchor="middle">ПЖ</text>
<line x1="216" y1="225" x2="216" y2="325" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="244" y1="225" x2="244" y2="325" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="216" y1="321" x2="244" y2="321" stroke="#444" stroke-width="1.2" marker-start="url(#ak)" marker-end="url(#ak)"/>
<text x="230.0" y="339.0" font-size="12.5" font-weight="600" fill="#444" text-anchor="middle">≈ 1 см</text>
<rect x="25" y="388" width="290" height="112" rx="10" fill="hsl(210,60%,96%)" stroke="hsl(210,45%,70%)"/>
<text x="170.0" y="412.0" font-size="14.5" font-weight="700" fill="hsl(210,55%,30%)" text-anchor="middle">Норма</text>
<text x="170.0" y="434.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">стенка ЛЖ 1,0–1,2 см,</text>
<text x="170.0" y="452.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">ПЖ 0,2–0,3 см</text>
<text x="170.0" y="470.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">сосочковые мышцы обычные</text>
<text x="170.0" y="490.0" font-size="12.5" font-weight="600" fill="#8e4335" text-anchor="middle">масса ≈ 300 г</text>
<circle cx="432.8" cy="225" r="80.8" fill="#c9715f" stroke="#8e4335" stroke-width="1.6"/>
<circle cx="435.5" cy="225" r="71.8" fill="#fdf1ec" stroke="#8e4335" stroke-width="1.2"/>
<circle cx="490" cy="225" r="104" fill="#c9715f" stroke="#8e4335" stroke-width="1.8"/>
<circle cx="490" cy="225" r="52" fill="#fdf1ec" stroke="#8e4335" stroke-width="1.4"/>
<ellipse cx="525.8" cy="250.1" rx="15" ry="24" transform="rotate(125 525.8 250.1)" fill="#c9715f" stroke="#8e4335" stroke-width="1.2"/>
<ellipse cx="454.2" cy="250.1" rx="15" ry="24" transform="rotate(235 454.2 250.1)" fill="#c9715f" stroke="#8e4335" stroke-width="1.2"/>
<text x="490.0" y="230.0" font-size="15" font-weight="700" fill="#8e4335" text-anchor="middle">ЛЖ</text>
<text x="375.0" y="230.0" font-size="13" font-weight="700" fill="#8e4335" text-anchor="middle">ПЖ</text>
<line x1="542" y1="225" x2="542" y2="355" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="594" y1="225" x2="594" y2="355" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="542" y1="351" x2="594" y2="351" stroke="#444" stroke-width="1.2" marker-start="url(#ak)" marker-end="url(#ak)"/>
<text x="568.0" y="369.0" font-size="12.5" font-weight="600" fill="#444" text-anchor="middle">2–3 см</text>
<rect x="345" y="388" width="290" height="112" rx="10" fill="hsl(140,60%,96%)" stroke="hsl(140,45%,70%)"/>
<text x="490.0" y="412.0" font-size="14.5" font-weight="700" fill="hsl(140,55%,30%)" text-anchor="middle">Компенсация</text>
<text x="490.0" y="434.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">стенка резко утолщена;</text>
<text x="490.0" y="452.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">полость умеренно расширена —</text>
<text x="490.0" y="470.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">тоногенное (активное) расширение</text>
<text x="490.0" y="490.0" font-size="12.5" font-weight="600" fill="#8e4335" text-anchor="middle">масса до 900–1000 г</text>
<circle cx="746.2" cy="230" r="98.2" fill="#c9715f" stroke="#8e4335" stroke-width="1.6"/>
<circle cx="748.6" cy="230" r="90.2" fill="#fdf1ec" stroke="#8e4335" stroke-width="1.2"/>
<circle cx="810" cy="230" r="116" fill="#c9715f" stroke="#8e4335" stroke-width="1.8"/>
<circle cx="810" cy="230" r="86" fill="#fdf1ec" stroke="#8e4335" stroke-width="1.4"/>
<ellipse cx="877.3" cy="277.1" rx="7" ry="12" transform="rotate(125 877.3 277.1)" fill="#c9715f" stroke="#8e4335" stroke-width="1.2"/>
<ellipse cx="742.7" cy="277.1" rx="7" ry="12" transform="rotate(235 742.7 277.1)" fill="#c9715f" stroke="#8e4335" stroke-width="1.2"/>
<text x="810.0" y="235.0" font-size="15" font-weight="700" fill="#8e4335" text-anchor="middle">ЛЖ</text>
<text x="670.0" y="235.0" font-size="13" font-weight="700" fill="#8e4335" text-anchor="middle">ПЖ</text>
<line x1="896" y1="230" x2="896" y2="372" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="926" y1="230" x2="926" y2="372" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="896" y1="368" x2="926" y2="368" stroke="#444" stroke-width="1.2" marker-start="url(#ak)" marker-end="url(#ak)"/>
<text x="911.0" y="386.0" font-size="12.5" font-weight="600" fill="#444" text-anchor="middle">тоньше</text>
<rect x="665" y="388" width="290" height="112" rx="10" fill="hsl(15,60%,96%)" stroke="hsl(15,45%,70%)"/>
<text x="810.0" y="412.0" font-size="14.5" font-weight="700" fill="hsl(15,55%,30%)" text-anchor="middle">Декомпенсация</text>
<text x="810.0" y="434.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">дистрофия кардиомиоцитов, склероз;</text>
<text x="810.0" y="452.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">полость резко расширена —</text>
<text x="810.0" y="470.0" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">миогенное (пассивное) расширение</text>
<text x="810.0" y="490.0" font-size="12.5" font-weight="600" fill="#8e4335" text-anchor="middle">масса велика</text>
<path d="M262 112 L 330 112" stroke="#888" stroke-width="2" marker-end="url(#ak)"/>
<path d="M600 104 L 662 104" stroke="#888" stroke-width="2" marker-end="url(#ak)"/>
<text x="296.0" y="102.0" font-size="11.5" font-weight="500" fill="#777" text-anchor="middle">нагрузка</text>
<text x="631.0" y="80.0" font-size="11.5" font-weight="500" fill="#777" text-anchor="middle">причина</text>
<text x="631.0" y="94.0" font-size="11.5" font-weight="500" fill="#777" text-anchor="middle">не устранена</text>
</svg>