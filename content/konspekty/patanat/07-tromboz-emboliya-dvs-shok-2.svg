<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c4f9e"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0262d"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4a"/></marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Куда попадает эмбол: три круга и три направления</text>
  <text x="450" y="51" text-anchor="middle" font-size="13" fill="#555">синий — венозная кровь, красный — артериальная; эмбол останавливается там, где сосуд становится уже него</text>

  <!-- лёгкие -->
  <rect x="330" y="72" width="240" height="62" rx="10" fill="#eef2fb" stroke="#2c4f9e" stroke-width="2"/>
  <text x="450" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Лёгкие</text>
  <text x="450" y="118" text-anchor="middle" font-size="12.5" fill="#333">ветви лёгочной артерии — ТЭЛА, жировая эмболия</text>

  <!-- сердце -->
  <rect x="250" y="200" width="160" height="80" rx="10" fill="#eef2fb" stroke="#2c4f9e" stroke-width="2"/>
  <text x="330" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Правое сердце</text>
  <text x="330" y="252" text-anchor="middle" font-size="12.5" fill="#333">ПП → ПЖ</text>
  <rect x="490" y="200" width="160" height="80" rx="10" fill="#fdeeee" stroke="#c0262d" stroke-width="2"/>
  <text x="570" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Левое сердце</text>
  <text x="570" y="252" text-anchor="middle" font-size="12.5" fill="#333">ЛП → ЛЖ → аорта</text>
  <!-- овальное окно -->
  <line x1="410" y1="240" x2="488" y2="240" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <text x="449" y="296" text-anchor="middle" font-size="12" fill="#7b3fa0">открытое овальное окно,</text>
  <text x="449" y="311" text-anchor="middle" font-size="12" fill="#7b3fa0">дефект перегородки</text>

  <!-- вены большого круга -->
  <rect x="40" y="380" width="250" height="82" rx="10" fill="#eef2fb" stroke="#2c4f9e" stroke-width="2"/>
  <text x="165" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Вены большого круга</text>
  <text x="165" y="428" text-anchor="middle" font-size="12.5" fill="#333">глубокие вены голени и бедра,</text>
  <text x="165" y="446" text-anchor="middle" font-size="12.5" fill="#333">вены таза (главный источник ТЭЛА)</text>

  <!-- артерии большого круга -->
  <rect x="610" y="380" width="250" height="82" rx="10" fill="#fdeeee" stroke="#c0262d" stroke-width="2"/>
  <text x="735" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Артерии большого круга</text>
  <text x="735" y="428" text-anchor="middle" font-size="12.5" fill="#333">мозг, почки, селезёнка, кишка,</text>
  <text x="735" y="446" text-anchor="middle" font-size="12.5" fill="#333">конечности → инфаркты, гангрена</text>

  <!-- воротная -->
  <rect x="330" y="470" width="240" height="70" rx="10" fill="#edf7ef" stroke="#2f8a4a" stroke-width="2"/>
  <text x="450" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Воротная вена → печень</text>
  <text x="450" y="516" text-anchor="middle" font-size="12.5" fill="#333">из вен желудка, кишечника, селезёнки</text>
  <text x="450" y="532" text-anchor="middle" font-size="12.5" fill="#333">(абсцессы печени, метастазы рака)</text>

  <!-- стрелки ортоградные -->
  <path d="M165 378 C 165 320, 220 290, 262 282" fill="none" stroke="#2c4f9e" stroke-width="3" marker-end="url(#ab)"/>
  <text x="70" y="335" font-size="13" fill="#2c4f9e" font-weight="bold">1. ортоградная</text>
  <text x="70" y="351" font-size="12" fill="#2c4f9e">по току крови</text>
  <path d="M330 198 C 330 170, 360 150, 380 136" fill="none" stroke="#2c4f9e" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M520 136 C 545 150, 570 170, 570 198" fill="none" stroke="#c0262d" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M650 262 C 710 280, 735 320, 735 376" fill="none" stroke="#c0262d" stroke-width="3" marker-end="url(#ar)"/>
  <text x="752" y="320" font-size="12" fill="#c0262d">тромбы клапанов,</text>
  <text x="752" y="335" font-size="12" fill="#c0262d">ушка ЛП, аневризмы ЛЖ</text>

  <!-- парадоксальная: из вен в артерии -->
  <path d="M292 420 C 400 400, 520 400, 606 420" fill="none" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <text x="449" y="360" text-anchor="middle" font-size="13" fill="#7b3fa0" font-weight="bold">3. парадоксальная: вены → (окно) → артерии,</text>
  <text x="449" y="376" text-anchor="middle" font-size="13" fill="#7b3fa0" font-weight="bold">минуя лёгкие</text>

  <!-- ретроградная -->
  <path d="M260 464 L 260 486" fill="none" stroke="#2c4f9e" stroke-width="2.5" stroke-dasharray="3 4" marker-end="url(#ab)"/>
  <text x="40" y="500" font-size="13" fill="#2c4f9e" font-weight="bold">2. ретроградная</text>
  <text x="40" y="516" font-size="12" fill="#2c4f9e">тяжёлый эмбол опускается против тока</text>
  <text x="40" y="532" font-size="12" fill="#2c4f9e">(нижняя полая → почечные, печёночные вены)</text>

  <text x="890" y="552" text-anchor="end" font-size="11.5" fill="#888">Схема, не в масштабе.</text>
</svg>
