<text x="850.0" y="144.0" font-size="11.5" fill="#7b3fa0" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">мозгового вещества</text>
<text x="850.0" y="158.0" font-size="11.5" fill="#7b3fa0" text-anchor="end" font-weight="normal" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">надпочечников</text>
