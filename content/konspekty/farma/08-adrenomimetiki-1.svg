<circle cx="420.0" cy="300.0" r="12" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="420.0" y="304.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<circle cx="540.0" cy="404.0" r="12" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="540.0" y="408.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<circle cx="270.0" cy="420.0" r="12" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="270.0" y="424.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<circle cx="398.0" cy="520.0" r="12" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="398.0" y="524.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<circle cx="660.0" cy="410.0" r="12" fill="#444" stroke="#fff" stroke-width="1.5"/><text x="660.0" y="414.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<text x="40.0" y="742.0" font-size="13.2" text-anchor="start"><tspan fill="#444" font-weight="bold">1</tspan><tspan fill="#222" font-weight="normal"> синтез: метилдопа → ложный медиатор α-метилнорадреналин (действует на α₂ в ЦНС)</tspan></text>
<text x="40.0" y="764.0" font-size="13.2" text-anchor="start"><tspan fill="#444" font-weight="bold">2</tspan><tspan fill="#222" font-weight="normal"> депо в везикулах: резерпин истощает запасы НА (симпатолитик — занятие 9)</tspan></text>
<text x="40.0" y="786.0" font-size="13.2" text-anchor="start"><tspan fill="#444" font-weight="bold">3</tspan><tspan fill="#222" font-weight="normal"> выделение: эфедрин вытесняет НА из окончания → тахифилаксия при истощении запасов</tspan></text>
<text x="40.0" y="808.0" font-size="13.2" text-anchor="start"><tspan fill="#444" font-weight="bold">4</tspan><tspan fill="#222" font-weight="normal"> пресинаптические α₂: клонидин в ЦНС и на окончаниях — выброс НА ↓</tspan></text>
<text x="40.0" y="830.0" font-size="13.2" text-anchor="start"><tspan fill="#444" font-weight="bold">5</tspan><tspan fill="#222" font-weight="normal"> постсинаптические рецепторы: прямые адреномиметики (адреналин, НА, фенилэфрин, сальбутамол, добутамин)</tspan></text>
<text x="40.0" y="852.0" font-size="13.2" text-anchor="start"><tspan fill="#444" font-weight="bold">6</tspan><tspan fill="#222" font-weight="normal"> захват I: блокируют кокаин и трициклические антидепрессанты → НА в щели ↑ (внешний источник)</tspan></text>
<text x="40.0" y="886.0" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" font-style="italic">Действие НА прекращают: захват I (основной путь), захват II в клетку-эффектор и ферменты — МАО в окончании, КОМТ в клетке и печени.</text>
</svg>
