<path d="M319.0 512.0 L 319.0 496.0 Q 330.0 508.0 341.0 496.0 L 341.0 512.0" fill="#b0262d" fill-opacity="0.25" stroke="#b0262d" stroke-width="2" filter="url(#soft)"/><text x="330.0" y="488.0" font-size="13" fill="#b0262d" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">α₁</text>
<path d="M459.0 508.0 L 459.0 492.0 Q 470.0 504.0 481.0 492.0 L 481.0 508.0" fill="#c46a12" fill-opacity="0.25" stroke="#c46a12" stroke-width="2" filter="url(#soft)"/><text x="470.0" y="484.0" font-size="13" fill="#c46a12" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">β₁</text>
<path d="M599.0 510.0 L 599.0 494.0 Q 610.0 506.0 621.0 494.0 L 621.0 510.0" fill="#2f8a4a" fill-opacity="0.25" stroke="#2f8a4a" stroke-width="2" filter="url(#soft)"/><text x="610.0" y="486.0" font-size="13" fill="#2f8a4a" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">β₂</text>
<path d="M749.0 516.0 L 749.0 500.0 Q 760.0 512.0 771.0 500.0 L 771.0 516.0" fill="#b0262d" fill-opacity="0.25" stroke="#b0262d" stroke-width="2" filter="url(#soft)"/><text x="760.0" y="492.0" font-size="13" fill="#b0262d" text-anchor="middle" font-weight="bold" font-style="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">α₂</text>
<text x="330.0" y="560.0" font-size="12" fill="#b0262d" text-anchor="middle" font-weight="normal" font-style="normal">Gq → Ca²⁺ ↑</text>
<text x="470.0" y="560.0" font-size="12" fill="#c46a12" text-anchor="middle" font-weight="normal" font-style="normal">Gs → цАМФ ↑</text>
<text x="610.0" y="560.0" font-size="12" fill="#2f8a4a" text-anchor="middle" font-weight="normal" font-style="normal">Gs → цАМФ ↑</text>
<text x="760.0" y="560.0" font-size="12" fill="#b0262d" text-anchor="middle" font-weight="normal" font-style="normal">Gi → цАМФ ↓</text>
<text x="760.0" y="576.0" font-size="11.5" fill="#888" text-anchor="middle" font-weight="normal" font-style="italic">(вне синапса)</text>
