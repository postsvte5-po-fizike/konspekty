<text x="330.0" y="452.0" font-size="12" fill="#b0262d" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">выброс НА ↓</text>
