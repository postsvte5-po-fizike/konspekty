раво,</text><text x="800" y="196" font-size="13" font-weight="bold" fill="#c92a2a">max тот же</text><text x="750" y="300" font-size="13" font-weight="bold" fill="#5f3dc4">+ неконкурентный:</text><text x="750" y="318" font-size="13" font-weight="bold" fill="#5f3dc4">max ↓</text><text x="20" y="460" font-size="13" fill="#1b1e23">Сила (potency) — положение кривой по оси доз (EC₅₀); эффективность (efficacy) — высота плато (Emax).</text>
