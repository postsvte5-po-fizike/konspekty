<rect x="16" y="598" width="312" height="10" fill="#e8590c"/>
<text x="28" y="599" font-weight="bold" fill="#ffffff" font-size="14">Суппозитории официнальные</text>
<text x="30" y="630" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: Suppositorium cum X 0,2</text>
<text x="30" y="652" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.t.d. N. 10</text>
<text x="30" y="674" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">S. …</text>
<text x="30" y="704" font-size="12" fill="#495057">X — в творительном падеже</text>
<rect x="344" y="578" width="312" height="158" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<rect x="344" y="578" width="312" height="30" rx="10" fill="#e8590c"/>
<rect x="344" y="598" width="312" height="10" fill="#e8590c"/>
<text x="356" y="599" font-weight="bold" fill="#ffffff" font-size="14">Суппозитории магистральные</text>
<text x="358" y="630" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: X 0,1</text>
<text x="358" y="652" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Olei Cacao q.s.</text>
<text x="358" y="674" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">ut fiat suppositorium rectale</text>
<text x="358" y="696" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.t.d. N. 10</text>
<text x="358" y="726" font-size="12" fill="#495057">ректальные 3,0 г, вагинальные 4,0 г</text>
<rect x="672" y="578" width="312" height="158" rx="10" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="672" y="578" width="312" height="30" rx="10" fill="#6741d9"/>
<rect x="672" y="598" width="312" height="10" fill="#6741d9"/>
<text x="684" y="599" font-weight="bold" fill="#ffffff" font-size="14">Торговое название</text>
<text x="686" y="630" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: Tabulettas «…» N. 20</text>
<text x="686" y="652" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Suppositoria «…» N. 10</text>
<text x="686" y="674" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.S. …</text>
<text x="686" y="704" font-size="12" fill="#495057">название — в именительном падеже</text>
<text x="16" y="772" font-size="11.5" fill="#6c717a">По: Харкевич Д.А. Основы фармакологии, 2015, Приложение «Общая рецептура». X — любое вещество; дозы условные.</text>
