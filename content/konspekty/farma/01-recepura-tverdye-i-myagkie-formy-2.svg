<text x="686" y="260" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: X subtilissimi 10,0</text>
<text x="686" y="282" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.S. Присыпать …</text>
<text x="686" y="312" font-size="12" fill="#495057">наружный, «мельчайший»</text>
<rect x="16" y="382" width="312" height="180" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
