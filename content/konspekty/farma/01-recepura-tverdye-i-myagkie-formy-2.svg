<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 782" font-family="Helvetica, Arial, sans-serif">
<title>Шаблоны прописи: твёрдые и мягкие формы</title>
<rect width="1000" height="782" fill="#ffffff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1e23">Шаблоны прописи: твёрдые и мягкие формы</text>
<rect x="16" y="56" width="312" height="136" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="16" y="56" width="312" height="30" rx="10" fill="#1c7ed6"/>
<rect x="16" y="76" width="312" height="10" fill="#1c7ed6"/>
<text x="28" y="77" font-weight="bold" fill="#ffffff" font-size="14">Таблетки — вариант 1</text>
<text x="30" y="108" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: X 0,5</text>
<text x="30" y="130" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.t.d. N. 20 in tabulettis</text>
<text x="30" y="152" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">S. …</text>
<text x="30" y="182" font-size="12" fill="#495057">X — вещество в род. падеже; доза на 1 приём</text>
<rect x="344" y="56" width="312" height="136" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="344" y="56" width="312" height="30" rx="10" fill="#1c7ed6"/>
<rect x="344" y="76" width="312" height="10" fill="#1c7ed6"/>
<text x="356" y="77" font-weight="bold" fill="#ffffff" font-size="14">Таблетки — вариант 2</text>
<text x="358" y="108" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: Tabulettam X 0,5</text>
<text x="358" y="130" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.t.d. N. 20</text>
<text x="358" y="152" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">S. …</text>
<text x="358" y="182" font-size="12" fill="#495057">Tabulettam — вин. падеж ед. ч.</text>
<rect x="672" y="56" width="312" height="136" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="672" y="56" width="312" height="30" rx="10" fill="#1c7ed6"/>
<rect x="672" y="76" width="312" height="10" fill="#1c7ed6"/>
<text x="684" y="77" font-weight="bold" fill="#ffffff" font-size="14">Драже</text>
<text x="686" y="108" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: Dragee X 0,05</text>
<text x="686" y="130" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.t.d. N. 20</text>
<text x="686" y="152" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">S. …</text>
<text x="686" y="182" font-size="12" fill="#495057">одна форма прописи</text>
<rect x="16" y="208" width="312" height="158" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
