<rect x="16" y="228" width="312" height="10" fill="#1c7ed6"/>
<text x="28" y="229" font-weight="bold" fill="#ffffff" font-size="14">Капсулы</text>
<text x="30" y="260" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: X 0,02</text>
<text x="30" y="282" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.t.d. N. 28</text>
<text x="30" y="304" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">in capsulis gelatinosis</text>
<text x="30" y="334" font-size="12" fill="#495057">мягкие — … gelatinosis elasticis</text>
<rect x="344" y="208" width="312" height="158" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="344" y="208" width="312" height="30" rx="10" fill="#1c7ed6"/>
<rect x="344" y="228" width="312" height="10" fill="#1c7ed6"/>
<text x="356" y="229" font-weight="bold" fill="#ffffff" font-size="14">Порошок разделённый</text>
<text x="358" y="260" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: X 0,02</text>
<text x="358" y="282" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Sacchari 0,3</text>
<text x="358" y="304" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">M.f. pulvis</text>
<text x="358" y="326" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.t.d. N. 10</text>
<text x="358" y="356" font-size="12" fill="#495057">доза &lt; 0,1 → сахар 0,3</text>
<rect x="672" y="208" width="312" height="158" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
<rect x="672" y="208" width="312" height="30" rx="10" fill="#1c7ed6"/>
<rect x="672" y="228" width="312" height="10" fill="#1c7ed6"/>
