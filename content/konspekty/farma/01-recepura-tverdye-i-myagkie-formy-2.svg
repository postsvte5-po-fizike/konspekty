<text x="30" y="434" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: Unguenti X 3% — 15,0</text>
<text x="30" y="456" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.S. …</text>
<text x="30" y="486" font-size="12" fill="#495057">только сокращённо</text>
<rect x="344" y="382" width="312" height="180" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<rect x="344" y="382" width="312" height="30" rx="10" fill="#e8590c"/>
<rect x="344" y="402" width="312" height="10" fill="#e8590c"/>
<text x="356" y="403" font-weight="bold" fill="#ffffff" font-size="14">Мазь магистральная</text>
<text x="358" y="434" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: X 1,0</text>
<text x="358" y="456" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Vaselini ad 50,0</text>
<text x="358" y="478" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">M.f. unguentum</text>
<text x="358" y="500" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">D.S. …</text>
<text x="358" y="530" font-size="12" fill="#495057">не на вазелине / сложная / ЕД — так</text>
<rect x="672" y="382" width="312" height="180" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<rect x="672" y="382" width="312" height="30" rx="10" fill="#e8590c"/>
<rect x="672" y="402" width="312" height="10" fill="#e8590c"/>
<text x="684" y="403" font-weight="bold" fill="#ffffff" font-size="14">Паста</text>
<text x="686" y="434" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Rp.: X 10,0</text>
<text x="686" y="456" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Amyli</text>
<text x="686" y="478" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Zinci oxydi aa 5,0</text>
<text x="686" y="500" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">Vaselini ad 50,0</text>
<text x="686" y="522" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1b1e23">M.f. pasta</text>
<text x="686" y="552" font-size="12" fill="#495057">порошков ≥ 25%</text>
<rect x="16" y="578" width="312" height="158" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
